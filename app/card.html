<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F2">
<title>La tua carta fedeltà</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
body{background:var(--wash);min-height:100vh}
.top{display:flex;justify-content:flex-end;padding:12px 16px 0;max-width:420px;margin:0 auto}
main{max-width:420px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:18px;justify-items:center}
.pass{max-width:380px}
.box{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:22px}
.box h1{font-size:24px;font-stretch:112%;font-weight:800;margin-bottom:8px}
.box p{color:var(--ink-2);font-size:16px}
.box form{margin-top:20px}
.fine{font-size:14px;color:var(--muted);text-align:center;margin-top:12px}
.box .field{margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);margin:4px 0 16px;line-height:1.4}
.check input{width:20px;height:20px;flex:0 0 20px;margin:1px 0 0;accent-color:var(--pop)}
.left{text-align:center;color:var(--ink-2)}
.left.mine{background:var(--pop-wash);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:600}
.left b{color:var(--pop)}
.wallet{display:grid;gap:10px;width:100%;justify-items:center}
.wallet form{width:100%}
.wbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#000;color:#fff;border:0;border-radius:12px;padding:14px 18px;font:600 16px/1 -apple-system,var(--font);cursor:pointer}
.wbtn[disabled]{opacity:.35;cursor:not-allowed}
.wbtn svg{width:22px;height:22px}
.wbadge{display:block;margin:0 auto;padding:0;border:0;background:none;cursor:pointer;line-height:0}
.wbadge img{height:56px;width:auto}
.wallet .other{display:block;margin:2px auto 0;font-size:14px;color:var(--ink-2)}
.note{font-size:13px;color:var(--muted);text-align:center}
.history{list-style:none;margin:0;padding:0;font-size:15px}
.history li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1.5px solid var(--line)}
.history li:last-child{border-bottom:0}
.history span:last-child{color:var(--muted)}
.box h2{font-size:16px;margin-bottom:6px}
.by{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.by i{width:10px;height:10px;border-radius:50%;background:var(--pop)}
</style>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
</head>
<body>
<div class="top"><div class="lang"></div></div>
<main id="app" aria-live="polite"></main>

<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/stamps.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/remote.js"></script>
<script>
I18N.add({
  it: {
    'c.broken': 'Questo link non funziona', 'c.brokenP': 'Chiedi alla cassa il QR del locale e inquadralo di nuovo.',
    'c.join': 'Unisciti a {business}', 'c.joinP': 'Un timbro a ogni visita. Dopo {n} timbri: {reward}.',
    'c.name': 'Nome e cognome', 'c.namePh': 'Es. Giulia Rossi', 'c.get': 'Prendi la mia carta',
    'c.email': 'Email', 'c.phone': 'Cellulare', 'c.phonePh': '+39 333 123 4567', 'c.birth': 'Data di nascita',
    'c.marketing': 'Voglio ricevere novità e offerte da {business} via email o SMS (facoltativo).',
    'c.errName': 'Scrivi nome e cognome.', 'c.errEmail': 'Controlla l\'email.', 'c.errPhone': 'Controlla il numero di cellulare.', 'c.errBirth': 'Controlla la data di nascita.',
    'c.fine': 'Niente app. I tuoi dati li vede solo {business}, per la carta fedeltà.', 'c.privacy': 'Privacy', 'c.ready': 'La tua carta è pronta',
    'c.left': 'Mostra il codice quando paghi. <b>Ancora {n}</b> per {reward}.', 'c.claim': 'Mostra la carta alla cassa per avere il premio.',
    'c.apple': 'Aggiungi a Apple Wallet', 'c.google': 'Aggiungi a Google Wallet',
    'c.walletNote': 'Il salvataggio nel Wallet arriva presto. Intanto aggiungi questa pagina alla schermata Home.',
    'c.activity': 'Ultime visite', 'c.joined': 'Iscrizione', 'c.stamp': '+{n} timbro', 'c.unstamp': '−{n} timbro', 'c.redeem': 'Premio ricevuto',
    'c.tStamp': 'Timbro aggiunto', 'c.tFull': 'Carta piena! Il premio è pronto.', 'c.tRedeem': 'Buon premio!', 'c.by': 'Carta fedeltà con'
  },
  en: {
    'c.broken': 'This link isn\'t working', 'c.brokenP': 'Ask at the till for their QR code and scan it again.',
    'c.join': 'Join {business}', 'c.joinP': 'One stamp every visit. After {n} stamps: {reward}.',
    'c.name': 'Full name', 'c.namePh': 'E.g. Emma Smith', 'c.get': 'Get my card',
    'c.email': 'Email', 'c.phone': 'Mobile number', 'c.phonePh': '+44 7700 900123', 'c.birth': 'Date of birth',
    'c.marketing': 'Send me news and offers from {business} by email or text (optional).',
    'c.errName': 'Please write your first and last name.', 'c.errEmail': 'Please check your email.', 'c.errPhone': 'Please check your mobile number.', 'c.errBirth': 'Please check your date of birth.',
    'c.fine': 'No app. Only {business} sees your details, for the loyalty card.', 'c.privacy': 'Privacy', 'c.ready': 'Your card is ready',
    'c.left': 'Show the code when you pay. <b>{n} more</b> for {reward}.', 'c.claim': 'Show this card at the till to get your reward.',
    'c.apple': 'Add to Apple Wallet', 'c.google': 'Add to Google Wallet',
    'c.walletNote': 'Wallet saving is coming soon. For now, add this page to your home screen.',
    'c.activity': 'Recent visits', 'c.joined': 'Joined', 'c.stamp': '+{n} stamp', 'c.unstamp': '−{n} stamp', 'c.redeem': 'Reward received',
    'c.tStamp': 'Stamp added', 'c.tFull': 'Card full! Your reward is ready.', 'c.tRedeem': 'Enjoy your reward!', 'c.by': 'Loyalty card by'
  },
  pl: {
    'c.broken': 'Ten link nie działa', 'c.brokenP': 'Poproś przy kasie o kod QR i zeskanuj go jeszcze raz.',
    'c.join': '{business} zaprasza do programu lojalnościowego', 'c.joinP': 'Pieczątka przy każdej wizycie. Po {n} pieczątkach: {reward}.',
    'c.name': 'Imię i nazwisko', 'c.namePh': 'Np. Anna Kowalska', 'c.get': 'Odbierz kartę',
    'c.email': 'E-mail', 'c.phone': 'Numer telefonu komórkowego', 'c.phonePh': '+48 600 123 456', 'c.birth': 'Data urodzenia',
    'c.marketing': 'Chcę otrzymywać od lokalu {business} nowości i oferty e-mailem lub SMS-em (opcjonalnie).',
    'c.errName': 'Wpisz imię i nazwisko.', 'c.errEmail': 'Sprawdź adres e-mail.', 'c.errPhone': 'Sprawdź numer telefonu.', 'c.errBirth': 'Sprawdź datę urodzenia.',
    'c.fine': 'Bez aplikacji. Twoje dane widzi tylko {business}, na potrzeby karty lojalnościowej.', 'c.privacy': 'Prywatność', 'c.ready': 'Twoja karta jest gotowa',
    'c.left': ({ n }) => `Pokaż kod przy płatności. Jeszcze <b>${n} ${I18N.plural(+n, ['pieczątka', 'pieczątki', 'pieczątek'])}</b> i odbierasz nagrodę: {reward}.`, 'c.claim': 'Pokaż tę kartę przy kasie i odbierz nagrodę.',
    'c.apple': 'Dodaj do Apple Wallet', 'c.google': 'Dodaj do Google Wallet',
    'c.walletNote': 'Zapisywanie w Portfelu już wkrótce. Na razie dodaj tę stronę do ekranu głównego.',
    'c.activity': 'Ostatnie wizyty', 'c.joined': 'Dołączenie do programu', 'c.stamp': ({ n }) => `+${n} ${I18N.plural(+n, ['pieczątka', 'pieczątki', 'pieczątek'])}`, 'c.unstamp': ({ n }) => `−${n} ${I18N.plural(+n, ['pieczątka', 'pieczątki', 'pieczątek'])}`, 'c.redeem': 'Nagroda odebrana',
    'c.tStamp': 'Pieczątka dodana', 'c.tFull': 'Karta pełna! Nagroda czeka.', 'c.tRedeem': 'Smacznego!', 'c.by': 'Karta lojalnościowa od'
  }
});

(() => {
  const app = document.getElementById('app');
  const cardId = new URLSearchParams(location.search).get('card') || '';
  // Which customer card belongs to this phone, per café card. In connected
  // mode it also keeps the secret that proves it to the database.
  const MINE = 'timbro:mine';
  const mine = () => { try { return JSON.parse(localStorage.getItem(MINE)) || {}; } catch (e) { return {}; } };
  const remember = (cid, entry) => { try { const m = mine(); m[cid] = entry; localStorage.setItem(MINE, JSON.stringify(m)); } catch (e) {} };
  const myEntry = () => { const e = mine()[cardId]; return typeof e === 'string' ? { id: e } : e || null; };
  let card = null, me = null;

  // Load the card (and this phone's customer card) from the demo or the database.
  async function load() {
    const entry = myEntry();
    if (!Remote.enabled) { card = Store.getCard(cardId); me = entry ? Store.getCustomer(entry.id) : null; return; }
    if (entry && entry.secret) {
      const r = await Remote.getMyCard(entry.id, entry.secret);
      if (r) { card = r.card; me = r.customer; return; }
    }
    card = await Remote.getCard(cardId); me = null;
  }
  const t = (k, v) => I18N.t(k, v);
  const words = card => ({ title: (I18N.lang === 'en' && card.titleEn) || card.title, reward: (I18N.lang === 'en' && card.rewardEn) || card.reward });
  let last = null; // previous stamp count, to animate new stamps

  // "Add to Wallet" buttons. They post the card to the wallet server
  // (CONFIG.walletApi, see wallet/README.md), which answers with a signed
  // .pkpass file (iPhone) or a redirect to Google's save page (Android).
  const WALLET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>';
  function walletButtons(card, me) {
    const mineFirst = UI.getPlatform() === 'google' ? ['google', 'apple'] : ['apple', 'google'];
    const entry = myEntry() || {};
    const data = UI.esc(JSON.stringify({ card, customer: { id: me.id, name: me.name, stamps: me.stamps, secret: entry.secret } }));
    const one = (kind, main) => {
      const label = t(kind === 'apple' ? 'c.apple' : 'c.google');
      const on = CONFIG.walletApi && (CONFIG.walletPlatforms || ['apple', 'google']).includes(kind);
      if (!on) return main ? `<button class="wbtn" type="button" disabled>${WALLET_ICON}${label}</button>` : '';
      // Apple's and Google's official badges (assets/wallet/<apple|google>-wallet-<lang>.svg);
      // if a file is missing, the plain black button.
      const plain = `<button class="wbtn" type="submit">${WALLET_ICON}${label}</button>`;
      const badge = `<button class="wbadge" type="submit" data-plain="${UI.esc(plain)}"><img src="../assets/wallet/${kind}-wallet-${I18N.lang}.svg" alt="${UI.esc(label)}" onerror="this.parentNode.outerHTML=this.parentNode.dataset.plain"></button>`;
      return main
        ? `<form method="post" action="${UI.esc(CONFIG.walletApi.replace(/\/$/, ''))}/${kind}"><input type="hidden" name="data" value="${data}">${badge}</form>`
        : `<form method="post" action="${UI.esc(CONFIG.walletApi.replace(/\/$/, ''))}/${kind}"><input type="hidden" name="data" value="${data}"><button class="link other" type="submit">${label}</button></form>`;
    };
    return one(mineFirst[0], true) + one(mineFirst[1], false);
  }

  function render(animate = true) {
    if (!card) {
      app.innerHTML = `<div class="box"><h1>${t('c.broken')}</h1><p>${t('c.brokenP')}</p></div>`;
      return;
    }
    const w = words(card);
    document.title = `${w.title} · ${card.business}`;

    if (!me) {
      app.innerHTML = `${UI.renderPass(card, null, { stamps: 0, compact: true })}
        <div class="box">
          <h1>${UI.esc(t('c.join', { business: card.business }))}</h1>
          <p>${UI.esc(t('c.joinP', { n: card.stampsNeeded, reward: w.reward }))}</p>
          <form id="join" novalidate>
            <label class="field"><span>${t('c.name')}</span>
              <input type="text" name="name" maxlength="60" autocomplete="name" required placeholder="${t('c.namePh')}">
            </label>
            <label class="field"><span>${t('c.birth')}</span>
              <input type="date" name="birth" autocomplete="bday" required max="${new Date(Date.now() - 13 * 365.25 * 864e5).toISOString().slice(0, 10)}" min="1915-01-01">
            </label>
            <label class="field"><span>${t('c.email')}</span>
              <input type="email" name="email" maxlength="120" autocomplete="email" inputmode="email" required>
            </label>
            <label class="field"><span>${t('c.phone')}</span>
              <input type="tel" name="phone" maxlength="20" autocomplete="tel" inputmode="tel" required placeholder="${t('c.phonePh')}">
            </label>
            <label class="check"><input type="checkbox" name="marketing"><span>${UI.esc(t('c.marketing', { business: card.business }))}</span></label>
            <button class="btn pop block" type="submit">${t('c.get')}</button>
          </form>
          <p class="fine">${UI.esc(t('c.fine', { business: card.business }))} <a href="../legal/#${{ it: 'privacy', en: 'privacy-en', pl: 'privacy-pl' }[I18N.lang]}" target="_blank">${t('c.privacy')}</a></p>
        </div>
        <p class="by">${t('c.by')} <i></i><b>${UI.esc(CONFIG.brand)}</b></p>`;
      document.getElementById('join').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = e.target.querySelector('button'); btn.disabled = true;
        try {
          const f = e.target, who = { name: f.name.value.trim().replace(/\s+/g, ' '), email: f.email.value.trim(), phone: f.phone.value.trim(), birthDate: f.birth.value, marketing: f.marketing.checked };
          // The same checks as the database, in the customer's language.
          const age = (Date.now() - new Date(who.birthDate)) / (365.25 * 864e5);
          const bad = !/\S+\s+\S+/.test(who.name) ? ['name', 'c.errName'] : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(who.email) ? ['email', 'c.errEmail']
            : !/^\+?[0-9]{7,15}$/.test(who.phone.replace(/[^0-9+]/g, '')) ? ['phone', 'c.errPhone'] : !(age >= 13 && age < 110) ? ['birth', 'c.errBirth'] : null;
          if (bad) { UI.toast(t(bad[1])); f[bad[0]].focus(); btn.disabled = false; return; }
          if (Remote.enabled) { const r = await Remote.joinCard(cardId, who); remember(cardId, { id: r.id, secret: r.secret }); }
          else remember(cardId, { id: Store.join(cardId, who).id });
          await load();
          last = 0;
          render();
          UI.toast(t('c.ready'));
        } catch (err) { UI.toast(err.message); btn.disabled = false; }
      });
      return;
    }

    let pop;
    if (animate && last !== null && me.stamps > last) {
      pop = me.stamps - 1;
      UI.toast(t(me.stamps >= card.stampsNeeded ? 'c.tFull' : 'c.tStamp'));
    }
    if (animate && last > 0 && me.stamps === 0 && me.history.at(-1).type === 'redeem') UI.toast(t('c.tRedeem'));
    last = me.stamps;

    const left = card.stampsNeeded - me.stamps;
    // The café's own "almost there" / "reward ready" message (dashboard → Notifications), if switched on.
    const msgs = UI.messagesOf(card), lang = UI.msgLang(card);
    const own = left <= 0 ? (msgs.ready.on && msgs.ready) : left <= (msgs.close.left || 1) ? (msgs.close.on && msgs.close) : null;
    const ownText = own ? UI.fillMessage(own[lang], card, { name: me.name, left, lang }) : '';
    const events = me.history.slice(-5).reverse().map(h => {
      const what = h.type === 'joined' ? t('c.joined') : h.type === 'redeem' ? t('c.redeem') : t(h.type === 'stamp' ? 'c.stamp' : 'c.unstamp', { n: h.n });
      return `<li><span>${what}</span><span>${new Date(h.t).toLocaleDateString(I18N.locale(), { day: 'numeric', month: 'short' })}</span></li>`;
    }).join('');

    app.innerHTML = `${UI.renderPass(card, me, { pop })}
      ${ownText ? `<p class="left mine">${UI.esc(ownText)}</p>` : `<p class="left">${left > 0 ? t('c.left', { n: left, reward: UI.esc(w.reward) }) : t('c.claim')}</p>`}
      <div class="wallet">${walletButtons(card, me)}
      </div>
      ${CONFIG.walletApi && (CONFIG.walletPlatforms || ['apple', 'google']).includes(UI.getPlatform() === 'google' ? 'google' : 'apple') ? '' : `<p class="note">${t('c.walletNote')}</p>`}
      <div class="box"><h2>${t('c.activity')}</h2><ul class="history">${events}</ul></div>
      <p class="by">${t('c.by')} <i></i><b>${UI.esc(CONFIG.brand)}</b></p>`;
  }

  I18N.switchers();
  I18N.apply();
  document.addEventListener('langchange', () => render(false));
  // Before going to the wallet server, add the name/mark images (see UI.walletAssets).
  app.addEventListener('submit', async e => {
    const form = e.target.closest('form[action]');
    if (!form || form.dataset.ready) return;
    e.preventDefault();
    const field = form.querySelector('input[name=data]');
    const data = JSON.parse(field.value);
    Object.assign(data.card, await UI.walletAssets(data.card));
    // Artwork kept as files (e.g. the Sowa example) goes as data, which the server can read.
    const toData = src => fetch(src).then(r => r.blob()).then(b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); }));
    for (const k of ['logo', 'stampImage', 'stripImage']) if (data.card[k] && !/^data:/.test(data.card[k])) try { data.card[k] = await toData(data.card[k]); } catch (err) {}
    data.lang = I18N.lang;
    field.value = JSON.stringify(data);
    form.dataset.ready = '1';
    form.submit();
  });
  async function refresh(animate = true) {
    try { await load(); } catch (err) { if (!card) { app.innerHTML = `<div class="box"><h1>${t('c.broken')}</h1><p>${UI.esc(err.message)}</p></div>`; } return; }
    render(animate);
  }
  if (Remote.enabled) {
    // Check for new stamps every few seconds while the page is open.
    setInterval(() => { if (document.visibilityState === 'visible' && me) refresh(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me) refresh(); });
  } else {
    Store.onChange(() => refresh());
  }
  refresh(false);
})();
</script>
</body>
</html>
