<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timbro · Area locale</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/poster.css">
<style>
main{max-width:1120px;margin:0 auto;padding:24px 24px 72px}
.example{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:var(--pop-wash);margin-bottom:22px;font-size:15px}
.example[hidden]{display:none}
.example b{color:var(--pop)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card-pick{display:flex;gap:8px;align-items:center}
.card-pick select{width:auto;min-width:220px;font-weight:600}
.tabs{margin-bottom:28px}
[role=tabpanel][hidden]{display:none}
h2.sec{font-size:26px;font-stretch:112%;font-weight:800;margin-bottom:8px}
.sec-sub{color:var(--ink-2);margin-bottom:22px;max-width:40em}

/* design */
.design{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.preview{position:sticky;top:84px;display:grid;justify-items:center;gap:10px}
.preview .phone{width:320px}
.preview .label{justify-self:center}
.logo-row{display:flex;align-items:center;gap:14px}
h3.group{font-size:19px;font-weight:800;font-stretch:112%;margin:30px 0 16px;padding-top:22px;border-top:1.5px solid var(--line)}
.hint{display:block;margin-top:8px;font-size:14px}
.chips .sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.2)}
.chips label .mini{width:18px;height:18px}
#fonts .ff-wide{font-stretch:125%;text-transform:uppercase;letter-spacing:.14em;font-size:13px}
#fonts .ff-serif{font-family:'EB Garamond',serif;font-style:italic;font-size:17px}
#fonts .ff-mono{font-family:var(--mono);text-transform:uppercase;font-size:13px}
#mark-text-field input{font:700 22px/1 'Noto Serif JP','EB Garamond',serif;text-align:center;max-width:90px}
.logo-row label{cursor:pointer}
.preview .phone-screen{min-height:430px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-size:15px;font-weight:600;margin-bottom:8px;padding:0}
.icons label{padding:9px}
.icons label svg{width:20px;height:20px}
.stepper{display:inline-flex;justify-self:start;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.stepper button{width:46px;height:46px;border:0;background:transparent;font:600 22px/1 var(--font);cursor:pointer;border-radius:999px;color:var(--ink)}
.stepper button:hover{background:var(--wash)}
.stepper output{min-width:42px;text-align:center;font:500 17px var(--mono)}
details.en{border:1.5px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:20px}
details.en summary{cursor:pointer;padding:14px 0;font-weight:600;font-size:15px}
details.en[open]{padding-bottom:4px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.status{font-size:14px;color:var(--muted)}
.templates{margin-bottom:22px;padding-bottom:22px;border-bottom:1.5px solid var(--line)}
.design > form{grid-column:1}
.preview{grid-column:2;grid-row:1 / span 2}
.review{padding:14px 16px;border-radius:12px;margin-bottom:20px;font-size:15px}
.review.pending{background:var(--pop-wash)}
.review.changes{background:#FFF1E8}
.review.approved{background:var(--wash)}
.review b{display:block;margin-bottom:2px}
.which button{font-size:12px}
.nt{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.nt-rules{display:grid;gap:14px}
.rule{border:1.5px solid var(--line);border-radius:16px;padding:18px;margin:0;min-width:0}
.rule.off .rule-body{opacity:.45}
.rule-head{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.rule-head input{width:44px;height:26px;flex:none;appearance:none;border-radius:999px;background:#D6D6D3;position:relative;cursor:pointer;transition:background .15s;margin:0}
.rule-head input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.rule-head input:checked{background:var(--pop)}
.rule-head input:checked::after{transform:translateX(18px)}
.rule-head input:focus-visible{outline:3px solid var(--pop-wash);outline-offset:2px}
.rule-head b{display:block;font-size:17px}
.rule-head small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.rule-body{margin-top:14px;display:grid;gap:10px}
.rule-opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.rule-opts select{width:auto;min-height:40px;padding:6px 10px}
.rule .field{margin:0}
.rule .field > span{display:flex;justify-content:space-between;font-size:14px}
.rule .field em{font-style:normal;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.rule textarea{min-height:64px;resize:vertical}
.vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.vars button{font:500 13px/1 var(--mono);padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.vars button:hover{border-color:var(--ink)}
.nt-save{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.nt-preview{position:sticky;top:16px;display:grid;justify-items:center;gap:12px}
.lock{width:300px;min-height:560px;border-radius:44px;border:10px solid #111;padding:44px 12px 20px;background:radial-gradient(120% 80% at 20% 0%,#3B3F8F 0%,#15172E 55%,#0B0B0C 100%);color:#fff;display:flex;flex-direction:column;gap:8px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.lock .clock{text-align:center;margin-bottom:14px}
.lock .clock b{display:block;font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:1}
.lock .clock span{font-size:15px;opacity:.85}
.lock .tag{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin:6px 6px 0}
.ntf{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:18px;background:rgba(245,245,247,.82);color:#111;backdrop-filter:blur(10px)}
.ntf .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.ntf .ic i{width:14px;height:14px;border-radius:50%}
.ntf .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ntf .top b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntf .top span{color:#6B6B70;flex:none}
.ntf p{font-size:13.5px;line-height:1.35;margin-top:1px}
.lock.google{border-radius:34px;background:radial-gradient(120% 80% at 80% 0%,#3A5A7A 0%,#16202B 60%,#0B0B0C 100%)}
.lock.google .clock b{font-weight:400}
.lock.google .ntf{border-radius:24px;background:#fff;grid-template-columns:1fr}
.lock.google .ntf .ic{display:none}
.lock.google .app{display:flex;align-items:center;gap:6px;font-size:12px;color:#5F6368}
.lock.google .app i{width:16px;height:16px;border-radius:50%;display:inline-block}
.lock .empty{opacity:.7;font-size:14px;text-align:center;margin-top:30px}
@media (max-width:900px){.nt{grid-template-columns:1fr}.nt-preview{position:static;order:-1}.lock{min-height:0;width:100%;max-width:320px}}
.res-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.res-head .sec-sub{margin-bottom:0}
.res-sample{background:var(--pop-wash);border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:15px}
.res-top{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lab{font-size:14px;color:var(--ink-2)}
.kpi .val{font-size:34px;font-weight:800;font-stretch:112%;letter-spacing:-.03em;line-height:1.05}
.kpi.hero .val{font-size:56px}
.kpi .delta{font-size:13px;color:var(--muted)}
.kpi .delta b{color:var(--ink);font-weight:700}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card-box{border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 10px;min-width:0}
.card-box.wide{grid-column:1/-1}
.card-box h3{font-size:17px;font-weight:700}
.card-box .note{font-size:14px;color:var(--muted);margin:2px 0 6px}
.chart{position:relative;outline:none}
.chart:focus-visible{box-shadow:0 0 0 3px var(--pop-wash);border-radius:8px}
.chart svg{display:block;overflow:visible}
.chart g:focus{outline:none}
.chart g.on .col,.chart g:focus .col{opacity:.75}
.chart-tip{position:absolute;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:6px 10px;pointer-events:none;white-space:nowrap;font-size:13px;line-height:1.3;z-index:2}
.chart-tip b{display:block;font-size:15px}
.chart-tip span{color:#C9C9CD}
.people{list-style:none;margin:6px 0 10px;padding:0}
.people li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1.5px solid var(--line);font-size:15px}
.people li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;margin-top:8px}
.money label{display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.money input{min-height:44px}
.money .out b{display:block;font-size:26px;font-weight:800;font-stretch:112%;letter-spacing:-.02em}
.money .out span{font-size:14px;color:var(--ink-2)}
.res-table summary{cursor:pointer;font-weight:600;margin:6px 0 10px}
.res-table table{font-size:14px}
@media (max-width:980px){.res-top{grid-template-columns:1fr 1fr}.kpi.hero{grid-column:1/-1}.money{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.res-grid{grid-template-columns:1fr}}
.bill-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:4px 0 22px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:2px}
.seg button{font:600 14px/1 var(--font);padding:9px 14px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bill-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bill-plan{border:1.5px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.bill-plan.mine{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bill-plan h3{font-size:20px;font-weight:800;font-stretch:112%}
.bill-plan .price{font-size:30px;font-weight:800;letter-spacing:-.02em}
.bill-plan .price small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.bill-plan p{color:var(--ink-2);font-size:15px;flex:1}
.bill-plan .tag{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--pop)}
@media (max-width:860px){.bill-plans{grid-template-columns:1fr}}
.till{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.till-steps{margin:0 0 22px;padding-left:20px;color:var(--ink-2)}
.till-steps li{padding:4px 0}
.link-box{margin-top:20px;border:1.5px solid var(--ink);border-radius:16px;padding:20px;display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.link-box .qr svg{width:100%;height:auto}
.link-box b{display:block;font:500 30px/1.1 var(--mono);letter-spacing:.14em;margin:6px 0}
.link-box small{color:var(--muted)}
.devices{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.devices li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1.5px solid var(--line)}
.devices li span small{display:block;color:var(--muted);font-size:13px}
.devices .empty-dev{color:var(--muted)}
@media (max-width:860px){.till{grid-template-columns:1fr}.link-box{grid-template-columns:110px 1fr}}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.insp{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.insp figure{position:relative;margin:0;width:88px;height:88px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line)}
.insp figure img{width:100%;height:100%;object-fit:cover}
.insp figure button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(11,11,12,.75);color:#fff;font:600 14px/1 var(--font);cursor:pointer}
.insp-add{width:88px;height:88px;border-radius:12px;border:1.5px dashed #B5B5B8;display:grid;place-content:center;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;padding:6px}
.insp-add span:first-child{font-size:26px;line-height:1;color:var(--ink)}
.insp-add:hover{border-color:var(--ink)}
.by-us{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1.5px solid var(--ink);border-radius:14px;margin-bottom:20px}
.by-us p{font-size:15px;color:var(--ink-2)}
.by-us b{color:var(--ink)}
.plan-pick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.plan-pick select{width:auto;min-height:38px;padding:6px 10px;font-weight:600;color:var(--ink)}

/* print */
.print{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:start}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.linkrow{display:flex;gap:8px;margin:8px 0 20px}
.linkrow input{font:500 14px var(--mono)}
.where{list-style:none;margin:0 0 20px;padding:0}
.where li{padding:10px 0 10px 30px;border-bottom:1.5px solid var(--line);position:relative}
.where li::before{content:"";position:absolute;left:0;top:15px;width:14px;height:14px;border-radius:50%;background:var(--pop)}

/* promote */
.promote{display:grid;grid-template-columns:360px 1fr;gap:40px;align-items:start}
.insta img{width:100%;border-radius:8px;box-shadow:0 0 0 1.5px var(--line)}
.insta .btns{margin:14px 0 0}
.msgs{display:grid;gap:12px}
.msg{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.msg header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.msg h3{font-size:15px;font-weight:700;letter-spacing:0}
.msg p{white-space:pre-line;color:var(--ink-2);font-size:15px}
.plan-list{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.plan-list li{border-bottom:1.5px solid var(--line)}
.plan-list label{display:grid;grid-template-columns:24px 80px 1fr;gap:12px;align-items:start;padding:14px 0;cursor:pointer}
.plan-list input{width:20px;height:20px;accent-color:var(--pop);margin:2px 0 0}
.plan-list .day{font:500 13px/1.6 var(--mono);color:var(--muted);text-transform:uppercase}
.plan-list input:checked ~ span:last-child{text-decoration:line-through;color:var(--muted)}
.subhead{font-size:20px;font-weight:800;font-stretch:112%;margin:40px 0 14px}

/* customers */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{border:1.5px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-size:34px;font-weight:800;font-stretch:112%;letter-spacing:-.03em}
.stat span{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:13px 12px;border-bottom:1.5px solid var(--line)}
th{font:500 12px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td code{font:500 13px var(--mono);background:var(--wash);padding:3px 7px;border-radius:6px}
.bar{display:flex;align-items:center;gap:10px}
.bar i{flex:1;max-width:120px;height:6px;border-radius:3px;background:var(--wash);overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--pop)}
.ready{color:#fff;background:var(--pop);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.empty{text-align:center;padding:56px 20px}
.empty h3{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px}
.table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;padding:4px 10px}

@media (max-width:960px){
  .design,.print,.promote{grid-template-columns:1fr}
  .preview{position:static;order:-1;grid-column:1;grid-row:auto}
  .stats{grid-template-columns:1fr 1fr}
  .print > :first-child,.insta{max-width:360px}
}
@media (max-width:560px){
  main{padding:16px 16px 56px}
  .appbar{padding:10px 16px}
  .appbar .hide-sm{display:none}
  .row{grid-template-columns:1fr}
  .card-pick{width:100%}
  .card-pick select{flex:1;min-width:0}
  .preview .phone{width:290px}
}
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span>Timbro</a>
  <div class="right">
    <div class="lang"></div>
    <button class="btn line small" type="button" id="logout" hidden data-i18n="d.logout"></button>
    <a class="btn small" href="stamper.html"><span class="hide-sm" data-i18n="d.openStamper"></span><span aria-hidden="true">→</span></a>
  </div>
</header>

<main>
  <div class="example" id="example" hidden>
    <span data-i18n-html="d.example"></span>
    <button class="btn pop small" type="button" id="example-new" data-i18n="d.createOwn"></button>
  </div>

  <div class="top">
    <div class="card-pick">
      <label class="sr-only" for="card-select" data-i18n="d.card"></label>
      <select id="card-select"></select>
      <button class="btn line small" id="new-card" type="button" data-i18n="d.newCard"></button>
    </div>
  </div>

  <div class="tabs" role="tablist" data-i18n-attr="aria-label:d.sections">
    <button role="tab" id="t-design" aria-controls="tab-design" data-tab="design" data-i18n="d.tDesign"></button>
    <button role="tab" id="t-print" aria-controls="tab-print" data-tab="print" data-i18n="d.tPrint"></button>
    <button role="tab" id="t-promote" aria-controls="tab-promote" data-tab="promote" data-i18n="d.tPromote"></button>
    <button role="tab" id="t-customers" aria-controls="tab-customers" data-tab="customers" data-i18n="d.tCustomers"></button>
    <button role="tab" id="t-results" aria-controls="tab-results" data-tab="results" data-i18n="d.tResults"></button>
    <button role="tab" id="t-notify" aria-controls="tab-notify" data-tab="notify" data-i18n="d.tNotify"></button>
    <button role="tab" id="t-till" aria-controls="tab-till" data-tab="till" data-i18n="d.tTill"></button>
    <button role="tab" id="t-plan" aria-controls="tab-plan" data-tab="plan" data-i18n="d.tPlan"></button>
  </div>

  <!-- CARD DESIGN -->
  <section role="tabpanel" id="tab-design" aria-labelledby="t-design">
    <div class="design">
      <form class="panel" id="card-form" autocomplete="off">
        <fieldset class="templates">
          <legend data-i18n="d.start"></legend>
          <div class="chips" id="templates"></div>
        </fieldset>
        <div class="row">
          <label class="field"><span data-i18n="d.business"></span><input type="text" name="business" maxlength="28" required></label>
          <label class="field"><span data-i18n="d.title"></span><input type="text" name="title" maxlength="26" required></label>
        </div>
        <div class="row">
          <label class="field"><span data-i18n="d.reward"></span><input type="text" name="reward" maxlength="40" required><small data-i18n="d.rewardHint"></small></label>
          <div class="field"><span id="st-l" data-i18n="d.stamps"></span>
            <div class="stepper" role="group" aria-labelledby="st-l">
              <button type="button" data-step="-1" aria-label="−1">−</button>
              <output id="stamps-out">10</output>
              <button type="button" data-step="1" aria-label="+1">+</button>
            </div>
          </div>
        </div>
        <details class="en">
          <summary data-i18n="d.enTitle"></summary>
          <p class="muted" style="font-size:14px;margin-bottom:14px" data-i18n="d.enHint"></p>
          <div class="row">
            <label class="field"><span data-i18n="d.titleEn"></span><input type="text" name="titleEn" maxlength="26" placeholder="Coffee card"></label>
            <label class="field"><span data-i18n="d.rewardEn"></span><input type="text" name="rewardEn" maxlength="40" placeholder="a free coffee"></label>
          </div>
        </details>
        <div class="actions">
          <button class="btn" type="submit" data-i18n="d.save"></button>
          <span class="status" id="status" aria-live="polite"></span>
        </div>
      </form>

      <form class="panel" id="design-form" autocomplete="off" style="grid-column:1">

(() => {
  const $ = id => document.getElementById(id);
  const form = $('card-form');
  let current = null, stamps = 10, dirty = false, instaLang = I18N.lang;
  let draft = null;          // the design being edited (not live until approved)
  let view = 'draft';        // preview: 'live' design or the 'draft'

  // ---------- texts (saved straight away) ----------
  function controls() {
    $('templates').innerHTML = CONFIG.templates.map(tp =>
      `<input type="radio" name="tpl" id="tp-${tp.id}" value="${tp.id}"><label for="tp-${tp.id}">${UI.icon(tp.icon)}${UI.esc(I18N.pick(tp).type)}</label>`).join('');
  }
  function readTexts() {
    const f = new FormData(form);
    const v = k => (f.get(k) || '').trim();
    return { business: v('business') || 'Il tuo locale', title: v('title') || 'Carta fedeltà', reward: v('reward') || 'un premio',
      titleEn: v('titleEn'), rewardEn: v('rewardEn'), stampsNeeded: stamps, type: f.get('tpl') || current.type };
  }
  function fillTexts(c) {
    ['business', 'title', 'reward', 'titleEn', 'rewardEn'].forEach(k => form[k].value = c[k] || '');
    stamps = c.stampsNeeded;
    form.querySelectorAll('input[name=tpl]').forEach(r => r.checked = r.value === c.type);
    $('stamps-out').textContent = stamps;
  }

  // ---------- design (sent for approval) ----------
  let editor = null;
  const planOf = c => CONFIG.plans.find(p => p.id === c.plan) || CONFIG.plans[0];
  const isCustom = () => planOf(current).design === 'custom';
  // Start: the owner edits the design and sends it for approval.
  // Plus/Pro: Witkowski Design designs it; the owner sends a request in words.
  function setupDesign() {
    const custom = isCustom();
    if (!editor) editor = DesignEditor.mount($('editor'), { mode: 'owner', onChange: d => { draft = d; setView('draft'); } });
    $('editor').hidden = custom;
    $('by-us').hidden = !custom;
    $('design-reset').hidden = custom;
    $('sub-plan').innerHTML = CONFIG.plans.map(p => `<option value="${p.id}">${UI.esc(I18N.pick(p).name)}</option>`).join('');
    $('sub-plan').value = planOf(current).id;
    // In connected mode the plan comes from the subscription: only Witkowski Design can change it here.
    $('sub-plan').disabled = Store.remote && !isAdmin;
    $('d-sub').textContent = I18N.t(custom ? 'd.dSubCustom' : 'd.dSubSelf');
    $('design-submit').textContent = I18N.t(custom ? 'd.sendRequest' : 'd.send');
    $('note-field').querySelector('span').textContent = I18N.t(custom ? 'd.noteCustom' : 'd.note');
    $('upsell').hidden = custom;
  }
  $('sub-plan').addEventListener('change', e => {
    // Prototype: the plan is chosen here. With payments it comes from the subscription.
    current = Store.setPlan(current.id, e.target.value);
    loadCard(current.id);
  });
  const designDiffers = () => JSON.stringify(Store.designOf({ ...current, ...draft })) !== JSON.stringify(Store.designOf(current));

  function renderReview() {
    const r = current.review, box = $('review');
    if (!r) { box.hidden = true; return; }
    box.hidden = false;
    box.className = 'review ' + r.status;
    box.innerHTML = r.status === 'pending' && r.kind === 'request' ? `<b>${I18N.t('d.rvRequest')}</b>${UI.esc(r.note)}`
      : r.status === 'pending' ? `<b>${I18N.t('d.rvPending')}</b>${I18N.t('d.rvPendingP')}`
      : r.status === 'changes' ? `<b>${I18N.t('d.rvChanges')}</b>${UI.esc(r.reply)}`
      : `<b>${I18N.t('d.rvApproved')}</b>${I18N.t('d.rvApprovedP')}`;
  }
  function setView(v) {
    view = v;
    $('which').hidden = isCustom() || !(designDiffers() || (current.review && current.review.status === 'pending'));
    $('which').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
    preview();
  }
  $('which').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });

  function preview() {
    const texts = readTexts();
    const look = view === 'live' ? Store.designOf(current) : draft;
    $('preview').innerHTML = UI.renderPass({ ...current, ...texts, ...look }, null, { stamps: Math.min(3, texts.stampsNeeded) });
    $('stamps-out').textContent = stamps;
  }
  UI.platformSwitch($('plat'), () => preview());

  $('design-form').addEventListener('submit', e => {
    e.preventDefault();
    if (isCustom()) {
      const note = e.target.note.value.trim();
      if (!note && !insp.length) { UI.toast(I18N.t('d.needNote')); e.target.note.focus(); return; }
      current = Store.requestDesign(current.id, note, { images: insp, links: readLinks() });
      e.target.note.value = ''; clearExtras();
      renderReview(); setView('live');
      UI.toast(I18N.t('d.requestSent'));
      return;
    }
    current = Store.proposeDesign(current.id, draft, e.target.note.value, { images: insp, links: readLinks() });
    e.target.note.value = ''; clearExtras();
    renderReview(); setView('draft');
    UI.toast(I18N.t('d.sent'));
  });
  $('design-reset').addEventListener('click', () => {
    draft = Store.designOf(current); editor.set(draft); setView('live');
  });

  // ---------- images and inspiration for the designer ----------
  let insp = [];
  const MAX_INSP = 8;
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(img.src);
        resolve(cv.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  function drawInsp() {
    const box = $('insp');
    box.querySelectorAll('figure').forEach(f => f.remove());
    box.insertAdjacentHTML('afterbegin', insp.map((src, i) =>
      `<figure><img src="${src}" alt=""><button type="button" data-rm="${i}" aria-label="${I18N.t('d.remove')}">×</button></figure>`).join(''));
    box.querySelector('.insp-add').hidden = insp.length >= MAX_INSP;
  }
  $('insp-file').addEventListener('change', async e => {
    for (const f of [...e.target.files]) {
      if (insp.length >= MAX_INSP) { UI.toast(I18N.t('d.inspMax')); break; }
      try { insp.push(await shrinkPhoto(f)); } catch (err) {}
    }
    e.target.value = ''; drawInsp();
  });
  $('insp').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { insp.splice(+b.dataset.rm, 1); drawInsp(); } });
  const readLinks = () => $('design-form').links.value.split(/\s+/).map(x => x.trim()).filter(x => /^https?:\/\/\S+$/.test(x) || /^www\./.test(x)).slice(0, 10);
  const clearExtras = () => { insp = []; drawInsp(); $('design-form').links.value = ''; };

  function markDirty() { dirty = true; $('status').textContent = I18N.t('d.unsaved'); preview(); }
  form.addEventListener('input', e => { if (e.target.name !== 'tpl') markDirty(); });
  form.addEventListener('change', e => {
    if (e.target.name !== 'tpl') return;
    // A template fills in the texts and number of stamps; the business name stays.
    const tp = CONFIG.templates.find(x => x.id === e.target.value), main = I18N.pick(tp);
    form.title.value = main.title; form.reward.value = main.reward;
    form.titleEn.value = I18N.lang === 'it' ? tp.en.title : ''; form.rewardEn.value = I18N.lang === 'it' ? tp.en.reward : '';
    stamps = tp.stamps;
    markDirty();
  });
  form.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { stamps = Math.max(3, Math.min(15, stamps + +b.dataset.step)); markDirty(); }));
  form.addEventListener('submit', e => {
    e.preventDefault();
    current = Store.saveCard({ ...current, ...readTexts() });
    dirty = false; $('status').textContent = '';
    fillSelect(); renderPrint(); renderPromote();
    UI.toast(I18N.t('d.saved'));
  });

  // ---------- cards ----------
  function fillSelect() {
    $('card-select').innerHTML = Store.listCards().map(c => `<option value="${c.id}">${UI.esc(c.business)} · ${UI.esc(c.title)}</option>`).join('');
    $('card-select').value = current.id;
    $('example').hidden = Store.remote || current.id !== 'the-coffee';
  }
  function loadCard(id) {
    current = Store.getCard(id) || Store.listCards()[0];
    fillSelect(); fillTexts(current);
    // Show a pending proposal in the editor so the owner can see what they sent.
    draft = current.review && current.review.status === 'pending' ? { ...Store.designOf(current), ...current.review.design } : Store.designOf(current);
    setupDesign();
    editor.set(draft); renderReview(); setView('draft');
    dirty = false; $('status').textContent = '';
    renderPrint(); renderPromote(); renderCustomers();
    if (!$('tab-results').hidden) renderResults();
    if (!$('tab-notify').hidden) renderNotify();
    history.replaceState(null, '', `?card=${current.id}${location.hash}`);
  }
  $('card-select').addEventListener('change', e => loadCard(e.target.value));

  function createCard(opts = {}) {
    const tp = CONFIG.templates.find(x => x.id === opts.type) || CONFIG.templates[0];
    const lang = opts.lang || I18N.lang, main = tp[lang] || tp.en;
    const reward = opts.reward || main.reward;
    const card = Store.saveCard({
      business: opts.name || (current && current.id !== 'the-coffee' ? current.business : I18N.t('d.business')),
      plan: 'start', type: tp.id, ...(opts.city ? { city: opts.city } : {}), title: main.title, reward, stampsNeeded: +opts.stamps || tp.stamps,
      titleEn: lang === 'it' ? tp.en.title : '', rewardEn: lang === 'it' && reward === tp.it.reward ? tp.en.reward : '',
      icon: tp.icon, ...(() => { const st = CONFIG.styles.find(x => x.id === opts.style) || CONFIG.styles[0]; return { style: st.id, ...st.look }; })()
    });
    loadCard(card.id);
    showTab('design');
    UI.toast(I18N.t('d.created'));
    form.business.focus(); form.business.select();
  }
  $('new-card').addEventListener('click', () => createCard());
  $('example-new').addEventListener('click', () => createCard());

  // ---------- print ----------
  function renderPrint() {
    const url = UI.publicJoinUrl(current.id);
    $('poster-preview').innerHTML = MARKETING.poster(current);
    $('join-link').value = url;
    $('print-poster').href = `poster.html?card=${current.id}&lang=it`;
    $('print-poster-en').href = `poster.html?card=${current.id}&lang=en`;
    const tl = $('try-link'); if (tl) tl.href = UI.joinUrl(current.id);
  }
  $('copy-link').addEventListener('click', () => UI.copy($('join-link').value));
  $('download-qr').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = UI.qrCanvas(UI.publicJoinUrl(current.id), 1200).toDataURL('image/png');
    a.download = `${current.business.replace(/\W+/g, '-').toLowerCase()}-qr.png`;
    a.click();
  });

  // ---------- promote ----------
  let instaUrl = '';
  async function renderPromote() {
    const cv = await MARKETING.instagram(current, instaLang);
    instaUrl = cv.toDataURL('image/png');
    $('insta').src = instaUrl;
    $('insta').alt = I18N.t('d.mInsta') + ': ' + current.business;
    document.querySelectorAll('#insta-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === instaLang)));
    $('msgs').innerHTML = MARKETING.copy(current, I18N.lang).map((m, i) => `
      <article class="msg"><header><h3>${UI.esc(m.label)}</h3><button class="btn line small" type="button" data-copy="${i}">${I18N.t('d.copy')}</button></header><p>${UI.esc(m.text)}</p></article>`).join('');
    const done = planState();
    $('plan').innerHTML = MARKETING.plan(I18N.lang).map(([day, task], i) => `
      <li><label><input type="checkbox" data-plan="${i}" ${done[i] ? 'checked' : ''}><span class="day">${UI.esc(day)}</span><span>${UI.esc(task)}</span></label></li>`).join('');
  }

    if (!hasBefore) return `<span class="delta">${I18N.t('d.vsNone')}</span>`;
    const d = before ? Math.round((now - before) / before * 100) : 100;
    return `<span class="delta"><b>${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</b> ${I18N.t('d.vsPrev')}</span>`;

  document.addEventListener('langchange', () => { if (!$('tab-results').hidden) renderResults(); });
  let resTimer; window.addEventListener('resize', () => { clearTimeout(resTimer); resTimer = setTimeout(() => { if (!$('tab-results').hidden) renderResults(); }, 200); });

  // ---------- plan: the subscription (Stripe, see supabase/functions/) ----------
  let billing = null, interval = 'month';
  const LIVE = ['trialing', 'active', 'past_due', 'unpaid', 'paused'];
  const fmtDate = ms => new Date(ms).toLocaleDateString(I18N.lang === 'it' ? 'it-IT' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  function renderBilling() {
    const b = billing || {}, live = LIVE.includes(b.status), canPay = Store.remote && !Remote.demo;
    // Already subscribed: show their own billing period; changes happen in Stripe's portal.
    if (live && b.interval) interval = b.interval;
    const planName = (CONFIG.plans.find(p => p.id === b.plan) && I18N.pick(CONFIG.plans.find(p => p.id === b.plan)).name) || '';
    const period = b.interval ? ` (${I18N.t(b.interval === 'year' ? 'd.yearlyShort' : 'd.monthlyShort')})` : '';
    const v = { plan: planName + period, date: b.periodEnd ? fmtDate(b.periodEnd) : '', days: CONFIG.trialDays };
    $('bill-status').textContent = !canPay ? I18N.t('d.billDemo')
      : live && b.canceling ? I18N.t('d.billCanceling', v)
      : b.status === 'trialing' ? I18N.t('d.billTrial', v) : b.status === 'active' ? I18N.t('d.billActive', v)
      : ['past_due', 'unpaid'].includes(b.status) ? I18N.t('d.billPastDue') : b.status === 'canceled' ? I18N.t('d.billCanceled')
      : I18N.t(b.trialUsed ? 'd.billNoTrial' : 'd.billNone', v);
    $('bill-manage').hidden = !(canPay && b.customer && b.status);
    $('bill-hint').hidden = $('bill-manage').hidden;
    $('bill-interval').hidden = live;
    $('bill-interval').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.i === interval)));
    const money = n => new Intl.NumberFormat(I18N.lang === 'it' ? 'it-IT' : 'en-IE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
    $('bill-plans').innerHTML = CONFIG.plans.map(p => {
      const L = I18N.pick(p), mine = live && b.plan === p.id;
      const price = interval === 'year' ? p.month * CONFIG.yearlyMonths : p.month;
      return `<div class="bill-plan${mine ? ' mine' : ''}">
        ${mine ? `<span class="tag">${I18N.t('d.mine')}</span>` : ''}
        <h3>${UI.esc(L.name)}</h3>
        <div class="price">${money(price)} <small>${I18N.t(interval === 'year' ? 'd.perYear' : 'd.perMonth')} · ${I18N.t('d.vat')}</small></div>
        <p>${UI.esc(L.for)}</p>
        ${live ? '' : `<button class="btn ${p.popular ? 'pop' : 'line'} block" type="button" data-buy="${p.id}"${canPay ? '' : ' disabled'}>${UI.esc(I18N.t('d.choose', { plan: L.name }))}</button>`}
      </div>`;
    }).join('');
  }
  async function openStripe(call, btn) {
    btn.disabled = true;
    try { const { url } = await call(); location.href = url; }
    catch (err) { UI.toast(err.message); btn.disabled = false; }
  }
  $('bill-interval').addEventListener('click', e => { const x = e.target.closest('button'); if (x) { interval = x.dataset.i; renderBilling(); } });
  $('bill-plans').addEventListener('click', e => { const x = e.target.closest('[data-buy]'); if (x) openStripe(() => Remote.checkout(x.dataset.buy, interval), x); });
  $('bill-manage').addEventListener('click', e => openStripe(() => Remote.billingPortal(), e.currentTarget));
  document.addEventListener('langchange', renderBilling);

  let profile = {};   // what the owner typed when signing up
  async function start() {
    I18N.apply();
    controls();
    const q = new URLSearchParams(location.search);
    const startTab = ['design', 'print', 'promote', 'customers', 'results', 'notify', 'till', 'plan'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'design';
    // In the demo, keep the till and the dashboard in the demo too.
    if (Remote.demo) document.querySelectorAll('a[href="stamper.html"]').forEach(a => a.href = 'stamper.html?demo');
    if (Remote.enabled) {
      if (!await Remote.requireLogin()) return;
      let data;
      try { data = await Remote.ownerData(); }
      catch (err) { document.querySelector('main').innerHTML = `<p class="help">${UI.esc(I18N.t('d.loadErr', { msg: err.message }))}</p>`; return; }
      Store.attachRemote(data);
      isAdmin = data.isAdmin; devices = data.devices; profile = data.profile || {}; billing = data.billing;
      $('logout').hidden = false;
      // Keep customers, phones and design replies up to date.
      setInterval(async () => {
        if (document.visibilityState !== 'visible') return;
        try { const d = await Remote.ownerData(); devices = d.devices; billing = d.billing; Store.refresh(d); renderDevices(); renderBilling(); } catch (err) {}
      }, 30000);
    }
    renderDevices(); renderBilling();
    // Back from Stripe Checkout. The webhook may take a moment: look again shortly.
    if (q.get('billing')) {
      UI.toast(I18N.t(q.get('billing') === 'success' ? 'd.billThanks' : 'd.billCancelled'));
      history.replaceState(null, '', location.pathname + location.hash);
      if (Store.remote) setTimeout(async () => { try { billing = (await Remote.ownerData()).billing; renderBilling(); } catch (err) {} }, 4000);
    }
    if (q.get('new') || !Store.listCards().length) {
      current = Store.listCards()[0] || null;
      createCard({ name: q.get('name') || profile.business, type: q.get('type') || profile.type, city: profile.city, style: q.get('style'), reward: q.get('reward'), stamps: q.get('stamps'), lang: q.get('lang') });
    } else {
      loadCard(q.get('card'));
      showTab(startTab);
    }
  }
  start();
})();
</script>
</body>
</html>
