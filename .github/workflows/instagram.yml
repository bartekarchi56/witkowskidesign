# Posts to Instagram what marketing/instagram/schedule.json says is due (Rome time).
# Needs the repository secrets IG_USER_ID and IG_ACCESS_TOKEN (marketing/instagram/README.md,
# "Automatic posting"). Until they exist it posts nothing. Run it by hand from the Actions tab too.
name: Instagram
on:
  schedule:
    - cron: '7,37 5-20 * * *'   # every 30 minutes, about 7:07 to 22:37 in Rome (GitHub often starts these late)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post what is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
        run: node marketing/instagram/post.js
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/instagram/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Instagram: record posted" && git push)
