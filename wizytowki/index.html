<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timbro · Wizytówki w Apple i Google Wallet</title>
<meta name="description" content="Wizytówka w telefonie: Apple Wallet i Google Wallet, z logo i kolorami Twojej firmy. Jednorazowa opłata, bez abonamentu.">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* "For businesses": business cards in Apple and Google Wallet (served by wallet/bizcard.js), sold once.
   Pictures: put files in wizytowki/img/ with the names in data-img (e.g. hero.jpg); until then the
   page shows a dashed box saying what to make. The order form opens an e-mail (or WhatsApp). */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--ink)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px}
.nav .right{display:flex;align-items:center;gap:10px}
section{padding:96px 0}
.head{max-width:720px;margin-bottom:44px}
.head h2{font-size:clamp(32px,4.4vw,54px);margin:14px 0 0;line-height:1.02}
.head p{font-size:19px;color:var(--ink-2);margin-top:18px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:72px 0 88px}
.hero h1{font-size:clamp(40px,6vw,80px);line-height:.98;margin:14px 0 0}
.hero h1 em{font-style:normal;color:var(--pop)}
.hero .lede{font-size:20px;color:var(--ink-2);margin:26px 0 32px;max-width:30em}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin:36px 0 0;padding:24px 0 0;list-style:none;border-top:1.5px solid var(--ink);font-weight:600;font-size:15px}
.facts li{display:flex;align-items:center;gap:8px}
.facts li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pop)}
/* phones with the business card, drawn like the real Wallet pass */
.phones{display:flex;justify-content:center;gap:22px;align-items:flex-start}
.ph{width:250px;border-radius:44px;padding:9px;background:#2A2A2C;box-shadow:0 0 0 1.5px #8E8E93 inset,0 40px 70px -34px rgba(11,11,12,.55)}
.ph:nth-child(2){margin-top:46px}
.ph .scr{border-radius:36px;background:#F2F2F7;overflow:hidden;padding:46px 10px 18px;position:relative;min-height:470px}
.ph .isl{position:absolute;top:10px;left:50%;width:76px;height:22px;margin-left:-38px;border-radius:12px;background:#000}
.bc{border-radius:14px;padding:16px 16px 18px;color:#FAFAF8;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bc .lg{font:800 22px/1 var(--font);letter-spacing:-.03em;margin-bottom:26px;display:flex;align-items:center;gap:7px}
.bc .lg i{width:16px;height:16px;border-radius:50%;background:currentColor;opacity:.9}
.bc small{display:block;font:600 9px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:5px}
.bc b{display:block;font-size:20px;line-height:1.1;margin-bottom:14px}
.bc .row{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:14px}
.bc .row span{display:block}
.bc .qr{width:110px;height:110px;margin:6px auto 0;background:#fff;border-radius:8px;padding:7px;box-sizing:border-box}
.bc .qr svg{width:100%;height:100%;display:block}
/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{border:1.5px solid var(--ink);border-radius:20px;padding:26px 24px;background:#fff}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--pop);color:#fff;font-weight:800;margin-bottom:16px}
.steps h3{margin:0 0 8px;font-size:21px}
.steps p{margin:0;color:var(--ink-2)}
/* why */
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.why div{background:var(--pop-wash);border-radius:20px;padding:24px}
.why h3{margin:0 0 8px;font-size:19px}
.why p{margin:0;color:var(--ink-2)}
/* pictures: an AI image goes here (wizytowki/img/<name>) */
.pics{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}
.pic{border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:#fff}
.pic:first-child{aspect-ratio:auto;grid-row:span 1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.empty{border:2px dashed #B9B9C3;display:grid;place-items:center;text-align:center;padding:22px;color:var(--muted);font-size:14px;line-height:1.45}
.pic.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.pic.empty code{font:500 12px var(--mono);color:var(--pop)}
/* prices */
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.price{border:1.5px solid var(--ink);border-radius:20px;padding:24px;background:#fff;display:flex;flex-direction:column}
.price.hl{background:var(--ink);color:#fff}
.price h3{margin:0 0 6px;font-size:20px}
.price .amt{font:800 40px/1 var(--font);letter-spacing:-.03em;margin:14px 0 4px}
.price .per{font-size:14px;opacity:.7}
.price p{margin:14px 0 0;font-size:15px;opacity:.85}
.once{margin-top:18px;color:var(--ink-2)}
/* order form */
.order{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.order form{border:1.5px solid var(--ink);border-radius:24px;padding:28px;background:#fff;display:grid;gap:14px}
.order label{display:grid;gap:6px;font-weight:600;font-size:15px;min-width:0}
.order .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.order .alt{margin-top:14px;font-size:15px;color:var(--ink-2)}
.order .alt a{color:var(--pop);font-weight:600}
footer{background:var(--ink);color:#fff;padding:40px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer a{color:#fff}
@media (max-width:960px){
  .hero,.order{grid-template-columns:1fr}
  .steps,.why{grid-template-columns:1fr}
  .prices{grid-template-columns:1fr 1fr}
  .pics{grid-template-columns:1fr 1fr}
  .pic:first-child{grid-column:1/-1;aspect-ratio:16/10}
}
@media (max-width:560px){
  section{padding:68px 0}
  .prices,.order .two{grid-template-columns:1fr}
  .ph{width:200px}.ph .scr{min-height:390px}.ph:nth-child(2){display:none}
}
</style>

  <section id="why" style="padding-top:0">

    </div>

  <section id="prices" style="padding-top:0">

    </div>
  </section>

  <section id="order" style="padding-top:0">
    <div class="wrap order">
      <div class="head" style="margin:0">
        <span class="label" data-i18n="b.orL"></span>
        <h2 class="display" data-i18n="b.orT"></h2>

      </div>
      <div>

          </div>
          <div class="two">
            <label><span data-i18n="b.fEmail"></span><input name="email" type="email" required autocomplete="email"></label>
            <label><span data-i18n="b.fPhone"></span><input name="phone" type="tel" autocomplete="tel"></label>
          </div>
          <label><span data-i18n="b.fPack"></span><select name="pack" id="pack"></select></label>
          <label><span data-i18n="b.fMsg"></span><textarea name="msg" rows="4" data-i18n-attr="placeholder:b.fMsgPh"></textarea></label>
          <button class="btn pop" type="submit" data-i18n="b.send"></button>
        </form>
        <p class="alt"><span data-i18n="b.alt"></span> <a id="wa" target="_blank" rel="noopener">WhatsApp</a></p>
      </div>
    </div>
  </section>
</main>

    <div class="row"><div><small>Tel.</small><span>${phone}</span></div><div style="text-align:right"><small>E-mail</small><span>${mail}</span></div></div>
    <div class="qr">${sampleQr}</div></div></div></div>`;

  function render() {
    const pl = I18N.lang === 'pl', pr = pl ? P.pl : P.other;
    $('phones').innerHTML = card('#1B1B19', '#FAFAF8', 'abit.', 'Bartosz Witkowski', pl ? 'Założyciel' : 'Founder', '+48 530 340 988', 'abit@…')
      + card('#2B32FF', '#FFFFFF', 'Timbro', 'Bartosz Witkowski', pl ? 'Założyciel' : 'Founder', '+48 530 340 988', 'timbro@…');
    $('price-list').innerHTML = [['b.pr1', 'b.pr1p', pr[0], 'b.per1'], ['b.pr2', 'b.pr2p', pr[1], 'b.per1'], ['b.pr3', 'b.pr3p', pr[2], 'b.perP'], ['b.pr4', 'b.pr4p', pr[3], 'b.perC']]
      .map(([h, p, a, per], i) => `<div class="price${i === 0 ? ' hl' : ''}"><h3>${t(h)}</h3><div class="amt">${a}</div><div class="per">${t(per)}</div><p>${t(p)}</p></div>`).join('');
    $('pack').innerHTML = [['b.pr1', pr[0]], ['b.pr2', pr[1]], ['b.pr3', pr[2] + ' ' + t('b.perP')]].map(([k, a]) => `<option>${t(k)} (${a})</option>`).join('');
    // Pictures: the file if it exists, otherwise a box saying what image to make.
    document.querySelectorAll('.pic').forEach(box => {
      const img = new Image();
      img.onload = () => { box.className = 'pic'; box.innerHTML = ''; box.appendChild(img); };
      img.onerror = () => { box.className = 'pic empty'; box.innerHTML = `<div><b>AI</b>${UI.esc(t(box.dataset.hint))}<br><code>wizytowki/img/${box.dataset.img}</code></div>`; };
      img.alt = t(box.dataset.hint); img.src = 'img/' + box.dataset.img;
    });
    const wa = (CONFIG.contact.phone || '').replace(/\D/g, '');
    $('wa').href = `https://wa.me/${wa}?text=${encodeURIComponent(t('b.mailSubj', { company: '' }))}`;
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target), g = k => (f.get(k) || '').toString().trim();
    const body = [`${t('b.fName')}: ${g('name')}`, `${t('b.fCompany')}: ${g('company')}`, `${t('b.fEmail')}: ${g('email')}`,
      `${t('b.fPhone')}: ${g('phone')}`, `${t('b.fPack')}: ${g('pack')}`, '', g('msg')].join('\n');
    location.href = `mailto:${MAIL}?subject=${encodeURIComponent(t('b.mailSubj', { company: g('company') }))}&body=${encodeURIComponent(body)}`;
  });

  document.addEventListener('langchange', render);
  I18N.switchers(); I18N.apply(); render();
})();
</script>
</body>
</html>
