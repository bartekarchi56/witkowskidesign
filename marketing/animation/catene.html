<!doctype html>
<html lang="it">
<head>

<title>Ogni sede, i suoi numeri</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* Chains: "You run 11 cafés. Which one is really working?" A 37-second reel in 3D (three.js) in the
   style of the night-map explainers: a dark city seen from above, a glowing dome over each of eleven
   cafés, one total that splits into the eleven shops (each till phone knows its shop: update 11), a
   column of visits over each, the best and the weakest, the phone with "Locations compared" and one
   shop's own numbers (app/dashboard.html, ANALYTICS.byLocation), then the Chains plan: from €8 per
   location a month, 11 locations or more, a pilot first. Captions come in word by word.
   Vertical 540 x 960 (1080 x 1920 at 2x). ?lang=it|en. make.js calls window.renderAt(t). */
html,body{margin:0;background:#000}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:#06080d}
canvas{position:absolute;inset:0;width:540px;height:960px;display:block}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.top{top:84px;text-align:center;padding:0 30px}
.cap{font-size:37px;line-height:1.13;font-weight:800;font-stretch:112%;letter-spacing:-.015em;color:#fff;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.cap span{display:inline-block;opacity:0;transform:translateY(12px);margin:0 .12em}
.cap span.k{color:#fff;background:var(--pop);padding:0 8px;border-radius:9px;text-shadow:none}
.cap span.y{color:#16152b;background:#FFC24B;padding:0 8px;border-radius:9px;text-shadow:none}
.cap span.r{color:#fff;background:#FF4D5E;padding:0 8px;border-radius:9px;text-shadow:none}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;opacity:0;will-change:transform}
.lab .pill{display:inline-block;background:rgba(14,17,27,.82);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:5px 9px 6px;backdrop-filter:blur(4px)}
.lab b{display:block;font-size:17px;line-height:1;font-weight:800;font-stretch:110%}
.lab span{display:block;font:500 9px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:3px}
.lab.gold .pill{background:#FFC24B;color:#16152b;border-color:transparent}
.lab.gold span{color:#5d4a1c}
.lab.red .pill{background:#FF4D5E;border-color:transparent}
.lab.red span{color:rgba(255,255,255,.85)}
.lab.big .pill{padding:12px 20px 13px;border-radius:16px}
.lab.big b{font-size:46px}
.lab.big span{font-size:11px}
.price{top:330px;text-align:center;color:#fff;opacity:0}
.price .eur{font-size:150px;line-height:1;font-weight:800;font-stretch:115%;letter-spacing:-.04em;background:linear-gradient(180deg,#fff 30%,#9ea4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.price .per{font:600 15px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:6px}
.price .from{font:600 15px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#FFC24B;margin-bottom:8px}
.end{bottom:150px;text-align:center;opacity:0}
.end span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#16152b;font-size:20px;font-weight:700;padding:14px 20px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.end span i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 5px var(--pop),inset 0 0 0 7px #fff;flex:none}
.vig{inset:0;background:radial-gradient(120% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.65) 100%)}
.band{top:0;height:300px;background:linear-gradient(rgba(6,8,13,.9),rgba(6,8,13,0))}
.grain{inset:0;opacity:.05;mix-blend-mode:screen}
</style>
</head>
<body>

// street lights: tiny warm dots along the streets
{ const pts = []; for (let k = 0; k < 260; k++) { const alongX = hash(k) > .5, a = (Math.floor(hash(k + 1) * NX) - (NX - 2) / 2) * STEP, b = (hash(k + 2) - .5) * NZ * STEP; pts.push(alongX ? b * .6 : a - STEP / 2, .03, alongX ? a * 1.2 - STEP / 2 : b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));

// ---------------- eleven cafés, each under a dome ----------------
const NAMES = ['Navigli', 'Brera', 'Duomo', 'Isola', 'Sarpi', 'Porta Romana', 'Tortona', 'Centrale', 'NoLo', 'Città Studi', 'Lambrate'];
const VISITS = [812, 640, 598, 214, 455, 503, 388, 571, 296, 347, 412];   // example numbers, Navigli best, Isola weakest

  { const pts = []; for (let s = 0; s <= 64; s++) pts.push(V(Math.cos(s / 64 * Math.PI * 2) * R_DOME, .01, Math.sin(s / 64 * Math.PI * 2) * R_DOME)); g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat)); }

}
const shops = SPOTS.map(([i, j], n) => {

  const body = new THREE.Mesh(new THREE.BoxGeometry(.5, .32, .38), new THREE.MeshStandardMaterial({ color: '#2a2230', roughness: .8 })); body.position.y = .16; root.add(body);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(.38, .14), new THREE.MeshBasicMaterial({ color: '#ffb35c' })); win.position.set(0, .14, .191); root.add(win);
  for (let s = 0; s < 6; s++) { const st = new THREE.Mesh(new THREE.BoxGeometry(.085, .02, .12), new THREE.MeshBasicMaterial({ color: s % 2 ? '#ffffff' : '#ff5a4f' })); st.position.set(-.21 + s * .084, .27, .23); st.rotation.x = .35; root.add(st); }

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#ffb84a', transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false })); glow.scale.set(2.2, 2.2, 1); glow.position.y = .15; root.add(glow);
  // the till's ping: a ring on the ground
  const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 64), new THREE.MeshBasicMaterial({ color: '#8f96ff', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.y = .02; root.add(ring);
  // the column of visits
  const colM = new THREE.MeshBasicMaterial({ color: '#4b52ff', transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false });
  const col = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, 1, 32, 1, true), colM); col.position.y = .5; root.add(col);
  const cap = new THREE.Mesh(new THREE.CircleGeometry(.16, 32), new THREE.MeshBasicMaterial({ color: '#c9ccff', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); cap.rotation.x = -Math.PI / 2; root.add(cap);
  const appear = .25 + n * .16;
  return { n, x, z, root, dome, shell, glow, ring, col, colM, cap, appear, name: NAMES[n], v: VISITS[n], h: VISITS[n] / 812 * 3.2 };
});
const BEST = 0, WEAK = 3;
// the total that splits: a stream of light from the middle to each café
const centre = V(0, 2.4, 0);
const sparks = shops.map(s => [...Array(9)].map((_, k) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#a8adff', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); m.scale.set(.35, .35, 1); m.visible = false; scene.add(m); return { m, d: k * .045 + s.n * .03 }; }));

// ---------------- labels pinned to the scene ----------------
function label(cls) { const e = document.createElement('div'); e.className = 'lab ' + cls; e.innerHTML = '<div class="pill"><b></b><span></span></div>'; $('labs').appendChild(e); return e; }
const camera = new THREE.PerspectiveCamera(38, W / H, .1, 100);
function pin(e, p, vis, txt, sub) {
  const v = p.clone().project(camera);
  e.style.transform = `translate(${(v.x * .5 + .5) * W}px, ${(-v.y * .5 + .5) * H}px) translate(-50%,-100%) scale(${.6 + .4 * backOut(vis)})`;
  e.style.opacity = clamp01(vis * 3);
  if (txt !== undefined && e._t !== txt) { e.querySelector('b').textContent = txt; e._t = txt; }
  if (sub !== undefined && e._s !== sub) { e.querySelector('span').textContent = sub; e._s = sub; }
}
const NAME_LAB = shops.map(() => label(''));
const TOTAL = label('big');

// ---------------- the phone with the dashboard, on its own canvas ----------------
const pr = new THREE.WebGLRenderer({ canvas: $('p'), antialias: true, alpha: true, preserveDrawingBuffer: true });
pr.setPixelRatio(DPR); pr.setSize(W, H, false); pr.setClearColor(0x000000, 0); pr.outputColorSpace = THREE.SRGBColorSpace;
const phoneScene = new THREE.Scene();
phoneScene.add(new THREE.HemisphereLight('#ffffff', '#3a3f60', 1.6));
{ const k = new THREE.DirectionalLight('#ffffff', 1.6); k.position.set(2, 3, 5); phoneScene.add(k); }
function roundedShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
const phone = new THREE.Group();
{ const b = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(1, 2.05, .14), { depth: .08, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 3 }), new THREE.MeshStandardMaterial({ color: '#2a2a30', roughness: .3, metalness: .6 })); b.position.z = -.04; phone.add(b); }
const scr = document.createElement('canvas'); scr.width = 540; scr.height = Math.round(540 * 1.98 / .93);
const scrTex = new THREE.CanvasTexture(scr); scrTex.colorSpace = THREE.SRGBColorSpace; const sg = scr.getContext('2d');
{ const s = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(.93, 1.98, .11)), new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false })); const uv = s.geometry.attributes.uv, pos = s.geometry.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / .93 + .5, pos.getY(i) / 1.98 + .5); s.position.z = .065; phone.add(s); }

const phoneCam = new THREE.PerspectiveCamera(30, W / H, .1, 50); phoneCam.position.set(0, 0, 6.2); phoneCam.lookAt(0, 0, 0);

const ORDER = shops.map(s => s.n).sort((a, b) => VISITS[b] - VISITS[a]);
// u: the bars growing; sel: 0..1 into Navigli's own page; tap: 0..1 the finger
function drawDash(u, sel, tap) {

  g.fillStyle = '#0f1220'; g.fillRect(0, 0, w, h);

    g.fillStyle = 'rgba(255,255,255,.08)'; rr(g, 36, y + 32, w - 72 - 150, 18, 9); g.fill();

  });

    g.fillStyle = '#fff'; g.font = '800 46px Archivo'; g.fillText(NAMES[BEST], 36, 168);
    g.fillStyle = GOLD; rr(g, 36, 186, 150, 34, 17); g.fill(); g.fillStyle = '#16152b'; g.font = '700 16px "Spline Sans Mono"'; g.textAlign = 'center'; g.fillText('★ ' + T.best.toUpperCase(), 111, 209);
    const cu = clamp01((sel - .4) / .6);
