<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Come funziona</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* "How Timbro works", step by step in 3D (three.js): the customer scans the QR on the counter and
   saves the card in Wallet; at the till the barista stamps it with a tap; the customer comes back,
   gets a reminder and fills the card; the reward; the owner's dashboard. Ends on the Timbro screen.
   Vertical 540 x 960 (1080 x 1920 at 2x). ?lang=it|en. make.js calls window.renderAt(t). */
html,body{margin:0;background:#111}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:#F4F1EA}
canvas{position:absolute;inset:0;width:540px;height:960px;display:block}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.head{top:44px;text-align:center;padding:0 30px}
.step{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pop);background:#fff;padding:8px 12px;border-radius:99px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pop);color:#fff;font-size:12px}
.head h1{margin:16px 0 0;font-size:34px;line-height:1.06;font-weight:800;font-stretch:112%;letter-spacing:-.01em;color:var(--ink)}
.head p{margin:10px 0 0;font-size:17px;line-height:1.35;color:var(--ink-2)}
.days{top:200px;text-align:center;opacity:0}
.days span{display:inline-block;margin:0 3px;font:600 14px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 11px;border-radius:10px;background:#fff;color:#9a9aa0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.days span.on{background:var(--pop);color:#fff}
.end{inset:0;background:#fff;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
.brand{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;font-stretch:112%}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 6px var(--pop),inset 0 0 0 8px #fff}
.end h2{margin:22px 0 8px;font-size:36px;line-height:1.05;font-weight:800;font-stretch:112%}
.end h2 em{font-style:normal;color:var(--pop)}
.end p{margin:0;font-size:17px;color:var(--ink-2)}
.end ul{list-style:none;padding:0;margin:26px 0;text-align:left;display:grid;gap:12px}
.end li{font-size:18px;font-weight:600;display:flex;gap:10px;align-items:center}
.end li i{width:22px;height:22px;border-radius:50%;background:var(--pop);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.end .free{display:inline-block;background:var(--pop-wash);color:var(--pop);font-weight:700;font-size:19px;padding:11px 18px;border-radius:12px}
.end .url{margin-top:16px;font:500 15px/1 var(--mono);letter-spacing:.04em;color:var(--ink)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="ov head" id="head"><span class="step" id="step"><b id="stepN">1</b><span id="stepL"></span></span><h1 id="h1"></h1><p id="sub"></p></div>
  <div class="ov days" id="days"></div>
  <div class="ov end" id="end">
    <div class="brand"><i></i>Timbro</div>
    <h2 id="endH"></h2>
    <p id="endP"></p>
    <ul id="endL"></ul>
    <span class="free" id="endFree"></span>
    <div class="url" id="endUrl"></div>
  </div>
</div>
<script src="../../assets/js/config.js"></script>

// Timeline (seconds)
const S1 = 2.8, S2 = 7.2, S3 = 11.4, S4 = 15.4, S5 = 18.6, S6 = 22.0, END = 26.4, DURATION = 30.7;
const BLUE = '#2B32FF';

const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), mat('#EFE8DC')); wall.position.set(0, 4, -3); scene.add(wall);

})();

board.position.y = .66; board.rotation.x = -.12; board.castShadow = true; stand.add(board);

// A coffee cup with steam
const cup = new THREE.Group();
const cupBody = new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(0, 0), new THREE.Vector2(.2, 0), new THREE.Vector2(.26, .38), new THREE.Vector2(.25, .38), new THREE.Vector2(.19, .02), new THREE.Vector2(0, .02)], 32), mat('#ffffff', { roughness: .3, side: THREE.DoubleSide }));
cupBody.castShadow = true; cup.add(cupBody);
const coffee = new THREE.Mesh(new THREE.CircleGeometry(.24, 32), mat('#6b3f22', { roughness: .3 })); coffee.rotation.x = -Math.PI / 2; coffee.position.y = .34; cup.add(coffee);
const saucer = new THREE.Mesh(new THREE.CylinderGeometry(.42, .36, .04, 32), mat('#ffffff', { roughness: .3 })); saucer.position.y = .0; saucer.castShadow = true; cup.add(saucer);
const handle = new THREE.Mesh(new THREE.TorusGeometry(.1, .03, 10, 20, Math.PI * 1.2), mat('#ffffff', { roughness: .3 })); handle.position.set(.27, .2, 0); handle.rotation.z = -Math.PI * .6; cup.add(handle);

scene.add(cup);

// "+1" bubble, a scan beam between the two phones, confetti
const plusTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = BLUE; g.beginPath(); g.arc(64, 64, 58, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 6; g.beginPath(); g.arc(64, 64, 44, 0, 7); g.stroke(); g.fillStyle = '#fff'; g.font = '800 48px Archivo'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('+1', 64, 67); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();

const beam = new THREE.Mesh(new THREE.PlaneGeometry(1, .9), new THREE.MeshBasicMaterial({ color: '#6f75ff', transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(beam);
const CONF_COL = [BLUE, '#FFC24B', '#FF5C7A', '#2EC4B6', '#ffffff'];
const confetti = [...Array(70)].map((_, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(.07, .12), new THREE.MeshBasicMaterial({ color: CONF_COL[i % 5], side: THREE.DoubleSide })); m.visible = false; scene.add(m); return m; });

const camera = new THREE.PerspectiveCamera(30, W / H, .1, 100);

// ---------- screens (2D canvas, redrawn every frame) ----------
function drawQR(g, x, y, s, seed) {
  const n = 21, c = s / n; g.fillStyle = '#111';
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const finder = (a, b) => i >= a && i < a + 7 && j >= b && j < b + 7;

  g.fillStyle = '#111'; g.textAlign = 'left'; g.font = '600 30px Archivo'; g.fillText(T.bar.toUpperCase().split('').join(' '), x + 30, y + 58);
  g.textAlign = 'right'; g.fillStyle = '#777'; g.font = '600 18px Archivo'; g.fillText(T.stamps.toUpperCase(), x + w - 30, y + 44);

function screenCamera(D, scanY) {

  g.fillStyle = '#666'; g.font = '500 24px Archivo'; g.fillText(T.bar, w / 2, 176);

  g.fillStyle = press ? '#333' : '#000'; rr(g, 60, by, w - 120, 96, 18); g.fill();
  g.font = '600 25px Archivo'; const tw = g.measureText(T.add).width, x0 = w / 2 - (tw + 52) / 2;
  g.fillStyle = '#fff'; rr(g, x0, by + 31, 38, 32, 6); g.fill(); g.fillStyle = BLUE; g.fillRect(x0, by + 39, 38, 6); g.fillStyle = '#FFC24B'; g.fillRect(x0, by + 47, 38, 6);
  g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(T.add, x0 + 52, by + 57);
  if (press) { g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(w / 2, by + 48, 30 + press * 90, 0, 7); g.fill(); }
}
function screenWallet(D, n, opts = {}) {
  const { ctx: g, c } = D, w = c.width, h = c.height;
  g.fillStyle = '#F2F2F7'; g.fillRect(0, 0, w, h); statusBar(g, w);
  g.fillStyle = '#111'; g.textAlign = 'left'; g.font = '800 46px Archivo'; g.fillText('Wallet', 40, 150);
  drawPassOn(g, 36, 200 + (opts.drop || 0) * -500, w - 72, n, { pop: opts.pop });
  if (opts.added) { g.globalAlpha = opts.added; g.fillStyle = '#111'; rr(g, w / 2 - 170, h - 150, 340, 66, 33); g.fill(); g.fillStyle = '#fff'; g.font = '600 25px Archivo'; g.textAlign = 'center'; g.fillText('✓ ' + T.added, w / 2, h - 108); g.globalAlpha = 1; }
  if (opts.banner) {
    const y = -150 + 240 * opts.banner;
    g.fillStyle = 'rgba(250,250,252,.97)'; g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 30; rr(g, 24, y, w - 48, 130, 28); g.fill(); g.shadowColor = 'transparent';
    g.fillStyle = BLUE; rr(g, 46, y + 30, 56, 56, 14); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(74, y + 58, 13, 0, 7); g.fill(); g.fillStyle = BLUE; g.beginPath(); g.arc(74, y + 58, 9, 0, 7); g.fill();
    g.textAlign = 'left'; g.fillStyle = '#111'; g.font = '700 24px Archivo'; g.fillText('Timbro · ' + T.bar, 120, y + 52);
    g.fillStyle = '#333'; g.font = '500 22px Archivo'; g.fillText(opts.msg || T.notif, 120, y + 90);
    g.fillStyle = '#888'; g.textAlign = 'right'; g.font = '500 20px Archivo'; g.fillText(T.now, w - 50, y + 52);
  }
}
function screenTill(D, ok) {
  const { ctx: g, c } = D, w = c.width, h = c.height;
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); statusBar(g, w);
  g.fillStyle = '#111'; g.textAlign = 'center'; g.font = '800 32px Archivo'; g.fillText('Timbro · ' + T.till, w / 2, 140);
  if (ok < .5) {
    g.fillStyle = '#222'; rr(g, 60, 210, w - 120, w - 120, 24); g.fill();
    g.strokeStyle = '#4ADE80'; g.lineWidth = 7; g.strokeRect(120, 270, w - 240, w - 240);
    g.fillStyle = '#fff'; drawQR(g, 150, 300, w - 300, 9);
  } else {
    const k = backOut((ok - .5) * 2.5);
    g.fillStyle = '#22C55E'; g.beginPath(); g.arc(w / 2, 420, 120 * k, 0, 7); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 22; g.lineCap = 'round'; g.beginPath(); g.moveTo(w / 2 - 50, 420); g.lineTo(w / 2 - 12, 458); g.lineTo(w / 2 + 56, 384); g.stroke();
    g.fillStyle = '#111'; g.font = '800 38px Archivo'; g.fillText(T.stamped, w / 2, 620);
    g.fillStyle = '#666'; g.font = '500 28px Archivo'; g.fillText('Giulia R. · 1/10', w / 2, 666);
  }
}
function screenCompose(D, typed, press, sent) {
  const { ctx: g, c } = D, w = c.width, h = c.height;
  g.fillStyle = '#F7F7F9'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#111'; g.textAlign = 'left'; g.font = '800 40px Archivo'; g.fillText(T.compose, 48, 80);
  g.fillStyle = '#fff'; rr(g, 48, 116, w - 96, 60, 14); g.fill(); g.fillStyle = '#555'; g.font = '500 24px Archivo'; g.fillText(T.to, 70, 155);
  g.fillStyle = '#fff'; rr(g, 48, 196, w - 96, 200, 14); g.fill();
  const txt = T.msg.slice(0, Math.round(T.msg.length * typed));
  g.fillStyle = '#111'; g.font = '600 34px Archivo'; g.fillText(txt, 72, 260);
  if (typed < 1 || Math.floor(typed * 20) % 2) { const cw = g.measureText(txt).width; g.fillStyle = BLUE; g.fillRect(76 + cw, 232, 3, 36); }
  const by = h - 150, bw = 360, bx = w - 48 - bw;
  g.fillStyle = sent ? '#22C55E' : press ? '#1B21D6' : BLUE; rr(g, bx, by, bw, 90, 18); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '700 32px Archivo'; g.fillText(sent ? T.sent : T.send, bx + bw / 2, by + 56);
  if (press && !sent) { g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(bx + bw / 2, by + 45, 30 + press * 120, 0, 7); g.fill(); }
}
function screenDash(D, p) {
  const { ctx: g, c } = D, w = c.width, h = c.height;
  g.fillStyle = '#F7F7F9'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#111'; g.textAlign = 'left'; g.font = '800 40px Archivo'; g.fillText(T.dash, 48, 80);
  g.fillStyle = BLUE; g.beginPath(); g.arc(w - 70, 66, 18, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(w - 70, 66, 7, 0, 7); g.fill();
  T.kpi.forEach(([l, v], i) => {
    const x = 48 + i * ((w - 96 - 40) / 3 + 20), bw = (w - 96 - 40) / 3;
    g.fillStyle = '#fff'; rr(g, x, 116, bw, 130, 16); g.fill();
    g.fillStyle = '#777'; g.font = '500 22px Archivo'; g.fillText(l, x + 20, 156);
    g.fillStyle = i === 1 ? BLUE : '#111'; g.font = '800 46px Archivo'; g.fillText(v, x + 20, 216);
  });
  g.fillStyle = '#fff'; rr(g, 48, 270, w - 96, h - 320, 16); g.fill();
  g.fillStyle = '#777'; g.font = '500 22px Archivo'; g.fillText(T.chart, 72, 310);
  const vals = [.35, .42, .4, .55, .62, .58, .7, .76, .74, .86, .9, .95];
  vals.forEach((v, i) => {
    const bw = (w - 160) / vals.length, x = 72 + i * bw, hh = (h - 420) * v * ease((p - i * .04) * 2);
    g.fillStyle = i === vals.length - 1 ? BLUE : '#AEB1FF'; rr(g, x + 6, h - 70 - hh, bw - 12, hh, 6); g.fill();
  });
  g.fillStyle = '#aaa'; g.font = '500 18px Archivo'; g.textAlign = 'right'; g.fillText(T.sample, w - 64, 310);
}

// ---------- keyframes ----------
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, a] = keys[i - 1], [t1, b] = keys[i]; const x = ease((t - t0) / (t1 - t0)); return a.map((v, k) => lerp(v, b[k], x)); }
  return keys[keys.length - 1][1];
}
// [time, [x, y, z, rotX, rotY, rotZ, scale]]
const PHONE = [[0, [1.2, 1.4, .3, 0, -.6, .1, 0]], [.8, [.2, 1.35, .6, 0, -.25, 0, 1]], [S1 + .7, [.3, 1.3, .8, -.05, -.2, 0, 1]], [S2, [.3, 1.3, .8, -.05, -.2, 0, 1]], [S2 + .8, [.62, 1.3, .6, 0, -.45, 0, .85]], [S3, [.62, 1.3, .6, 0, -.45, 0, .85]], [S3 + .8, [0, 1.35, 1.0, 0, 0, 0, 1]], [S5, [0, 1.35, 1.0, 0, 0, 0, 1]], [S5 + .9, [.95, 1.3, .4, 0, -.5, 0, .8]], [S6, [.95, 1.3, .4, 0, -.5, 0, .8]], [S6 + .7, [2.9, 1.3, .4, 0, -.5, 0, .8]], [S6 + 2.0, [2.9, 1.0, 1.4, 0, 0, 0, .66]], [S6 + 2.6, [0, 1.0, 1.4, 0, 0, 0, .66]]];
const TILL = [[S2, [-3.4, 1.3, .8, 0, .6, 0, .85]], [S2 + .9, [-.62, 1.3, .8, 0, .5, 0, .85]], [S3 - .1, [-.62, 1.3, .8, 0, .5, 0, .85]], [S3 + .7, [-3.6, 1.3, .8, 0, .5, 0, .85]]];
const TABLET = [[S5, [-3.4, 1.3, .9, 0, .5, 0, .8]], [S5 + 1, [-.45, 1.3, .9, 0, .28, 0, .8]], [S6, [-.45, 1.3, .9, 0, .28, 0, .8]], [S6 + .7, [0, 1.5, 1.2, 0, 0, 0, 1]], [S6 + 2.0, [0, 1.5, 1.2, 0, 0, 0, 1]], [S6 + 2.6, [0, 2.45, -.5, 0, 0, 0, .7]]];
const PHONE_L = [[S6 + 2.0, [-3.2, 1.05, 1.2, 0, .3, 0, .62]], [S6 + 2.6, [-.78, 1.05, 1.2, 0, .3, 0, .62]]];
const PHONE_R = [[S6 + 2.1, [3.2, 1.05, 1.2, 0, -.3, 0, .62]], [S6 + 2.7, [.78, 1.05, 1.2, 0, -.3, 0, .62]]];
const CAM = [[0, [0, 2.4, 8.9, 0, 1.6, .4]], [S3, [0, 2.4, 8.9, 0, 1.6, .4]], [S3 + .7, [0, 2.3, 7.9, 0, 1.55, .6]], [S5, [0, 2.3, 7.9, 0, 1.55, .6]], [S5 + 1, [0, 2.4, 9.2, 0, 1.6, .4]], [S6, [0, 2.4, 9.2, 0, 1.6, .4]], [S6 + .8, [0, 2.3, 8.6, 0, 1.6, .6]]];
const place = (obj, k) => { obj.position.set(k[0], k[1], k[2]); obj.rotation.set(k[3], k[4], k[5]); obj.scale.setScalar(Math.max(.0001, k[6])); };

// ---------- frame ----------
function renderAt(t) {
  // captions
  const steps = [[0, S1], [S1, S2], [S2, S3], [S3, S4], [S4, S5], [S5, S6], [S6, END]];
  let si = steps.findIndex(([a, b]) => t >= a && t < b); if (si < 0) si = 6;
  const [a] = steps[si];
  const fadeIn = ease((t - a) / .4);
  $('head').style.opacity = (si === 0 ? ease(t / .5) : fadeIn) * (1 - ease((t - END) / .4));
  $('head').style.transform = `translateY(${(1 - fadeIn) * 12}px)`;
  $('step').style.visibility = si === 0 ? 'hidden' : 'visible';
  const txt = si === 0 ? T.intro : T.steps[si - 1];
  $('stepN').textContent = si; $('stepL').textContent = `${T.step} ${si}`; $('h1').textContent = txt[0]; $('sub').textContent = txt[1];

  place(phone.g, track(PHONE, t));
  place(till.g, t < S2 || t > S3 + .8 ? [-9, 0, 0, 0, 0, 0, 0] : track(TILL, t));
  place(tablet.g, t < S5 ? [-9, 0, 0, 0, 0, 0, 0] : track(TABLET, t));
  place(phoneL.g, t < S6 + 2 ? [-9, 0, 0, 0, 0, 0, 0] : track(PHONE_L, t));
  place(phoneR.g, t < S6 + 2 ? [-9, 0, 0, 0, 0, 0, 0] : track(PHONE_R, t));
  phone.g.position.y += Math.sin(t * 1.6) * .02;
  // the QR stand goes away after step 2, the cup arrives with the reward
  const st = 1 - ease((t - S3) / .6); stand.scale.setScalar(Math.max(.0001, st * backOut((t - .3) / .8)));
  const cupIn = backOut((t - S4 - .5) / .7) * (1 - ease((t - S5) / .5));
  cup.position.set(-.9, .08, 1.35); cup.scale.setScalar(Math.max(.0001, cupIn * .95));
  steam.forEach((s, i) => { const u = ((t * .5 + i / 6) % 1); s.position.set(Math.sin(u * 6 + i) * .06, .45 + u * .7, 0); s.scale.setScalar(.18 + u * .3); s.material.opacity = Math.sin(u * Math.PI) * .5; });

  // the customer's screen
  let n = 0;
  if (t < S1 + .2) screenWallet(phone, 0, { drop: 2 });
  else if (t < S1 + 1.9) screenCamera(phone, (Math.sin((t - S1) * 4) + 1) / 2);
  else if (t < S1 + 3.2) { const pr = t > S1 + 2.7 ? clamp01((t - S1 - 2.7) / .3) : 0; screenAdd(phone, pr, 0); }
  else if (t < S2 + 1.6) { const d = ease((t - S1 - 3.2) / .6); screenWallet(phone, 0, { drop: 2 * (1 - d), added: clamp01((t - S1 - 3.6) / .3) * (1 - clamp01((t - S2 - 1) / .3)) }); }
  else if (t < S3) { n = t > S2 + 1.9 ? 1 : 0; screenWallet(phone, n, { pop: n ? (t - S2 - 1.9) / .4 : undefined }); }
  else if (t < S4) {
    // a stamp on each visit (Mon, Wed, Fri, ...), then the reminder
    const k = Math.min(8, Math.floor((t - S3 - .5) / .42) + 2); n = t < S3 + .5 ? 1 : k;
    const banner = t > S3 + 3.2 ? ease((t - S3 - 3.2) / .35) : 0;
    screenWallet(phone, n, { pop: n > 1 ? ((t - S3 - .5) % .42) / .3 : undefined, banner });
    [...$('days').children].forEach((s, i) => s.classList.toggle('on', i < n - 1));
  } else if (t < S6 + 1) { n = t > S4 + .3 ? 10 : 9; screenWallet(phone, n, { pop: n === 10 ? (t - S4 - .3) / .4 : undefined }); }
  else screenWallet(phone, 2, { banner: ease((t - S6 - 2.75) / .35), msg: T.msg });
  phone.tex.needsUpdate = true;
  $('days').style.opacity = ease((t - S3 - .2) / .3) * (1 - ease((t - S4) / .3));
  if (t >= S2 && t <= S3 + .8) { screenTill(till, clamp01((t - S2 - 1.2) / 1.0)); till.tex.needsUpdate = true; }
  if (t >= S5 && t < S6 + .4) { screenDash(tablet, clamp01((t - S5 - .8) / 1.6)); tablet.tex.needsUpdate = true; }
  if (t >= S6 + .4) { const pr = clamp01((t - S6 - 1.8) / .3); screenCompose(tablet, clamp01((t - S6 - .6) / 1.1), pr, t > S6 + 2.1); tablet.tex.needsUpdate = true; }
  if (t >= S6 + 2) {
    screenWallet(phoneL, 4, { banner: ease((t - S6 - 2.6) / .35), msg: T.msg }); phoneL.tex.needsUpdate = true;
    screenWallet(phoneR, 7, { banner: ease((t - S6 - 2.9) / .35), msg: T.msg }); phoneR.tex.needsUpdate = true;
  }

  // the scan beam from the till phone to the card, and the +1
  const bt = clamp01((t - S2 - 1.0) / .9);
  beam.material.opacity = Math.sin(bt * Math.PI) * .45;
  const pp = phone.g.position, tp = till.g.position;
  beam.position.set((pp.x + tp.x) / 2, (pp.y + tp.y) / 2 - .1, (pp.z + tp.z) / 2 + .2);
  beam.scale.set(Math.max(.01, Math.hypot(pp.x - tp.x, pp.z - tp.z) - .7), 1, 1); beam.rotation.y = .1;
  const pt = (t - S2 - 1.9) / .9;
  plus.visible = pt > 0 && pt < 1;
  plus.position.set(pp.x + .1, pp.y + .75 + pt * .35, pp.z + .3); plus.scale.setScalar(.34 * backOut(pt * 3)); plus.material.opacity = pt < .7 ? 1 : 1 - (pt - .7) / .3;

  // confetti on the reward
  const ct = t - S4 - .3;
  confetti.forEach((m, i) => {
    m.visible = ct > 0 && ct < 2.6;
    if (!m.visible) return;
    const ang = hash(i) * Math.PI * 2, sp = 1.4 + hash(i + 50) * 1.6;
    m.position.set(Math.cos(ang) * sp * ct * .7, 1.9 + Math.sin(ang) * .3 + 2.2 * ct - 2.4 * ct * ct, .9 + Math.sin(ang) * sp * ct * .3);
    m.rotation.set(ct * 8 + i, ct * 6 + i * 2, 0);
  });

  const cam = track(CAM, t); camera.position.set(cam[0] + Math.sin(t * .4) * .15, cam[1], cam[2]); camera.lookAt(cam[3], cam[4], cam[5]);
  $('end').style.opacity = ease((t - END) / .6);
  renderer.render(scene, camera);
}
window.renderAt = renderAt;
window.DURATION = DURATION;
renderAt(0);
window.READY = true;
if (!q.has('capture')) {
  const start = performance.now();
  const loop = () => { renderAt(((performance.now() - start) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
  loop();
}
