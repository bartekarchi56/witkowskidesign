<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La carta che si sveglia vicino al bar</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* "Your phone knows when you walk past the café": a 35-second reel about the Wallet card's location
   notice (dashboard → Notifications → "Near the café"; wallet/apple.js puts the café's place in the
   pass with maxDistance 100). In the style of the tech explainers: a map with a glowing circle and a
   lock-screen notice, "not a text, not an email, no app", a green radar with the 100 m ring, the twist
   (the café doesn't watch you, the phone does the matching), Monday / Wednesday in the rain / Friday
   night, a stack of cafés, the Timbro mark and "Comment TIMBRO". Drawn in 2D on one canvas.
   Vertical 540 x 960 (1080 x 1920 at 2x). ?lang=it|en. make.js calls window.renderAt(t). */
html,body{margin:0;background:#111}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:#f3e8d6}
canvas{position:absolute;inset:0;width:540px;height:960px;display:block}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.top{top:74px;text-align:center;padding:0 26px}
.chip{display:inline-flex;align-items:center;gap:9px;font:500 12.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#16152b;padding:8px 13px 7px;border-radius:99px;margin-bottom:14px;box-shadow:0 6px 16px rgba(40,25,10,.18)}
.chip i{width:9px;height:9px;border-radius:50%;background:#FF3B30;box-shadow:0 0 0 2px #fff}
.cap{font-size:36px;line-height:1.12;font-weight:800;font-stretch:112%;letter-spacing:-.015em;color:#16152b;text-wrap:balance}
.cap mark{background:var(--pop);color:#fff;padding:0 9px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap mark.y{background:#FFC24B;color:#16152b}
.cap mark.g{background:#3BFF8A;color:#04170b}
.dark .cap{color:#fff}
.dark .chip{background:#3BFF8A;color:#04170b}
.src{margin:14px auto 0;display:inline-flex;align-items:center;gap:8px;font:500 11px/1.35 var(--mono);color:#6d5c49;letter-spacing:.02em;background:rgba(255,255,255,.6);padding:6px 11px;border-radius:8px}
.dark .src{color:#bfe9cf;background:rgba(0,0,0,.35)}
.end{bottom:150px;text-align:center;opacity:0}
.end span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#16152b;font-size:20px;font-weight:700;padding:14px 20px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.end span i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 5px var(--pop),inset 0 0 0 7px #fff;flex:none}
.grain{inset:0;opacity:.07;mix-blend-mode:multiply}
.dark .grain{mix-blend-mode:screen;opacity:.05}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="ov top" id="top"><div class="chip" id="chip"><i></i><span id="chipT"></span></div><div class="cap" id="cap"></div><div><div class="src" id="src"></div></div></div>
  <div class="ov end" id="end"><span><i></i><b id="endT"></b></span></div>
  <div class="ov grain" id="grain"></div>
</div>
<script>
(async () => {
const q = new URLSearchParams(location.search);
const lang = q.get('lang') === 'en' ? 'en' : 'it';
document.documentElement.lang = lang;
const VJ = await (await fetch('vicino.json')).json(), B = VJ.beats, DURATION = VJ.duration;
const T = {
  it: {

      [B.D + .2, '', 'Ma il bar <mark>non ti sta guardando.</mark>', ''],

    wallet: 'Wallet', added: 'Aggiunta al Wallet', stamps: 'TIMBRI', reward: 'un caffè gratis',
    days: [['LUNEDÌ', '8:12'], ['MERCOLEDÌ', '13:40'], ['VENERDÌ', '21:05']],
    dayText: ['Sei vicino a Bar Aurora: ancora 3 timbri per un caffè gratis.', 'Sei vicino a Bar Aurora: ancora 2 timbri per un caffè gratis.', 'Sei vicino a Bar Aurora: il tuo caffè gratis ti aspetta!'],

  },
  en: {
    caps: [
      [0.3, '', 'You walk past a café…', ''],
      [B.this, '', '…and your phone <mark>does this.</mark>', ''],
      [B.B + .2, '', 'Not a text. Not an email. <mark>No app.</mark>', ''],
      [B.C + .2, 'Rec', 'There’s an <mark class="g">invisible circle</mark> around the café.', ''],
      [B.wake, 'Rec', 'Step inside it and the card <mark class="g">wakes up.</mark>', 'Apple Wallet · iPhone'],
      [B.D + .2, '', 'But the café <mark>isn’t watching you.</mark>', ''],
      [B.phone, '', 'It’s the card in your Wallet, <mark>on your phone.</mark>', 'Your location never leaves your phone'],
      [B.E + .2, '', 'Monday. Wednesday in the rain. Friday night.', ''],
      [B.grid, '', 'Every walk past is <mark class="y">a reason to come in.</mark>', ''],
      [B.cta, '', 'Comment <mark>TIMBRO</mark> 👇', '']
    ],

    bar: 'Bar Aurora', now: 'now', date: 'Monday 28 October',
    near: 'You are near Bar Aurora: 2 stamps to go for a free coffee.',
    sms: 'Text', mail: 'Email', app: 'App', radius: '100 m', scan: 'SCANNING', you: 'YOU',
    wallet: 'Wallet', added: 'Added to Wallet', stamps: 'STAMPS', reward: 'a free coffee',
    days: [['MONDAY', '8:12'], ['WEDNESDAY', '13:40'], ['FRIDAY', '21:05']],
    dayText: ['You are near Bar Aurora: 3 stamps to go for a free coffee.', 'You are near Bar Aurora: 2 stamps to go for a free coffee.', 'You are near Bar Aurora: your free coffee is waiting!'],
    others: [['Forno Sarpi', 'You are near: 1 stamp to go for a free croissant.', '#C9572B'], ['Matcha Lab', 'Your free matcha is 2 stamps away.', '#5B7F3A'], ['Pasticceria Rosa', 'Come and pick up your reward!', '#D9668A'], ['Bar Aurora', '2 stamps to go for a free coffee.', '#2B32FF'], ['Bubble Tea 88', 'You are near: 3 stamps to go.', '#8A5CF6']]
  }
}[lang];
const $ = id => document.getElementById(id);
$('endT').textContent = T.end;
await Promise.all(['800 40px Archivo', '700 40px Archivo', '600 40px Archivo', '500 40px Archivo', '500 20px "Spline Sans Mono"', '600 20px "Spline Sans Mono"'].map(f => document.fonts.load(f)));

const W = 540, H = 960, DPR = +(q.get('dpr') || 2), BLUE = '#2B32FF', INK = '#16152b', GREEN = '#3BFF8A';
const cv = $('c'); cv.width = W * DPR; cv.height = H * DPR;
const g = cv.getContext('2d');
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const backOut = x => { x = clamp01(x); const c = 1.7; return Math.max(0, 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2)); };
const hash = i => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const lerp = (a, b, x) => a + (b - a) * x;
// on screen from a to b: pops in, fades out
const win = (t, a, b, i = .45, o = .35) => clamp01((t - a) / i) * (1 - clamp01((t - b) / o));
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, x, y, maxW, lh) { const words = text.split(' '); let line = ''; for (const w of words) { const tl = line ? line + ' ' + w : w; if (g.measureText(tl).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; } else line = tl; } g.fillText(line, x, y); return y; }

// ---------------- the city map: blocks between streets, a park, the café on a corner ----------------
const CAFE = { x: 270, y: 560 };
const BLOCKS = [];
{ const xs = [-60, 40, 150, 290, 400, 520, 640], ys = [180, 300, 420, 590, 720, 860, 1000, 1140];
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) BLOCKS.push([xs[i] + 13, ys[j] + 13, xs[i + 1] - xs[i] - 26, ys[j + 1] - ys[j] - 26, hash(i * 9 + j)]); }
// the walker: up the street on the left of the café's block, then along its street
const PATH = [[118, 1100], [118, 650], [118, 576], [230, 576]];
function along(u) { const segs = []; let L = 0; for (let i = 1; i < PATH.length; i++) { const d = Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]); segs.push(d); L += d; } let s = clamp01(u) * L; for (let i = 0; i < segs.length; i++) { if (s <= segs[i]) { const k = s / segs[i]; return [lerp(PATH[i][0], PATH[i + 1][0], k), lerp(PATH[i][1], PATH[i + 1][1], k)]; } s -= segs[i]; } return PATH[PATH.length - 1]; }
const RADIUS = 150;   // 100 m on this map

function drawMap(t, dark) {
  g.fillStyle = dark ? '#03100a' : '#efe3cf'; g.fillRect(-200, -200, W + 400, H + 400);
  BLOCKS.forEach(([x, y, w, h, r]) => {
    if (dark) { g.strokeStyle = 'rgba(59,255,138,.28)'; g.lineWidth = 1.2; rr(x, y, w, h, 6); g.stroke(); }
    else { g.fillStyle = r > .82 ? '#cfe0b0' : '#e2d2b9'; rr(x, y, w, h, 8); g.fill(); if (r <= .82) { g.fillStyle = 'rgba(255,255,255,.35)'; for (let k = 0; k < 3; k++) { rr(x + 8 + k * (w - 16) / 3, y + 8, (w - 16) / 3 - 6, h * .3, 4); g.fill(); } } }
  });
  if (dark) {
    g.strokeStyle = 'rgba(59,255,138,.08)'; g.lineWidth = 1;
    for (let x = -200; x < W + 200; x += 30) { g.beginPath(); g.moveTo(x, -200); g.lineTo(x, H + 200); g.stroke(); }
    for (let y = -200; y < H + 400; y += 30) { g.beginPath(); g.moveTo(-200, y); g.lineTo(W + 200, y); g.stroke(); }
  } else {
    // street names, small
    g.fillStyle = 'rgba(110,90,60,.45)'; g.font = '600 9px "Spline Sans Mono"'; g.textAlign = 'center';
    g.save(); g.translate(118, 820); g.rotate(-Math.PI / 2); g.fillText('VIA PAOLO SARPI', 0, 3); g.restore();
    g.fillText('VIA CANONICA', 400, 579);
  }
}
function pin(x, y, s, dark) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 2, 12, 4, 0, 0, 7); g.fill();
  g.fillStyle = dark ? GREEN : BLUE; g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(-6, -12, -22, -22, -22, -40); g.arc(0, -40, 22, Math.PI, 0); g.bezierCurveTo(22, -22, 6, -12, 0, 0); g.fill();
  g.fillStyle = dark ? '#03100a' : '#fff'; g.beginPath(); g.arc(0, -40, 14, 0, 7); g.fill();
  // a cup
  g.fillStyle = dark ? GREEN : BLUE; rr(-7, -46, 12, 11, 3); g.fill(); g.strokeStyle = dark ? GREEN : BLUE; g.lineWidth = 2; g.beginPath(); g.arc(6, -41, 3, -1.4, 1.4); g.stroke(); g.fillRect(-9, -34, 16, 2);
  g.restore();
}
function walker(x, y, dark, t) {
  const r = 9 + Math.sin(t * 6) * .6;
  g.fillStyle = dark ? 'rgba(59,255,138,.25)' : 'rgba(255,59,48,.22)'; g.beginPath(); g.arc(x, y, r + 8, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r + 2.5, 0, 7); g.fill();
  g.fillStyle = dark ? GREEN : '#FF3B30'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}

// ---------------- the phone and the iOS lock screen ----------------
function phoneFrame(cx, cy, s, rot, drawScreen) {
  const w = 280, h = 590;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(s, s);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 40; g.shadowOffsetY = 18;
  g.fillStyle = '#1b1b1e'; rr(-w / 2 - 9, -h / 2 - 9, w + 18, h + 18, 52); g.fill();
  g.shadowColor = 'transparent';
  g.save(); rr(-w / 2, -h / 2, w, h, 44); g.clip(); g.translate(-w / 2, -h / 2); drawScreen(w, h); g.restore();
  g.fillStyle = '#000'; rr(-46, -h / 2 + 12, 92, 26, 13); g.fill();
  g.restore();
}
function wallpaper(w, h, kind = 0) {
  const gr = g.createLinearGradient(0, 0, w * .4, h);
  const P = [['#7f86ff', '#2B32FF', '#120f4a'], ['#9fc3e8', '#5e86b3', '#2a3b57'], ['#4a5a6b', '#2f3b47', '#151b22'], ['#1b1846', '#0d0b29', '#04030f']][kind];
  gr.addColorStop(0, P[0]); gr.addColorStop(.55, P[1]); gr.addColorStop(1, P[2]); g.fillStyle = gr; g.fillRect(0, 0, w, h);
}
function lockClock(w, time, date) {
  g.fillStyle = 'rgba(255,255,255,.9)'; g.textAlign = 'center';
  g.font = '600 15px Archivo'; g.fillText(date, w / 2, 92);
  g.font = '700 84px Archivo'; g.fillText(time, w / 2, 172);
}
// the notification: the card's icon, the café, "now", the text; k = 0..1 for the drop-in
function notice(x, y, w, k, title, text, color, small) {
  if (k <= 0) return;
  const s = .8 + .2 * backOut(k);
  g.save(); g.globalAlpha *= clamp01(k * 2.5); g.translate(x + w / 2, y); g.scale(s, s); g.translate(-w / 2, (1 - easeOut(k)) * -30);
  g.font = (small ? '400 11.5px' : '400 13px') + ' Archivo';
  const lines = []; { let line = ''; for (const wd of text.split(' ')) { const tl = line ? line + ' ' + wd : wd; if (g.measureText(tl).width > w - 70 && line) { lines.push(line); line = wd; } else line = tl; } lines.push(line); }
  const lh = small ? 14 : 16, h = (small ? 36 : 42) + lines.length * lh;
  g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 20; g.shadowOffsetY = 6;
  g.fillStyle = 'rgba(245,245,250,.93)'; rr(0, 0, w, h, small ? 16 : 20); g.fill(); g.shadowColor = 'transparent';
  // the card's icon: Wallet pass in the café's colour
  g.fillStyle = color; rr(12, 12, small ? 30 : 34, small ? 30 : 34, 8); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(12 + (small ? 15 : 17), 12 + (small ? 15 : 17), small ? 7 : 8, 0, 7); g.stroke();
  g.textAlign = 'left'; g.fillStyle = '#111'; g.font = (small ? '700 12.5px' : '700 14px') + ' Archivo'; g.fillText(title, small ? 52 : 56, small ? 26 : 28);
  g.textAlign = 'right'; g.fillStyle = '#8a8a90'; g.font = '400 11px Archivo'; g.fillText(T.now, w - 14, small ? 26 : 28);
  g.textAlign = 'left'; g.fillStyle = '#222'; g.font = (small ? '400 11.5px' : '400 13px') + ' Archivo';
  lines.forEach((l, i) => g.fillText(l, small ? 52 : 56, (small ? 42 : 46) + i * lh));
  g.restore();
  return h;
}

// ---------------- the café front (the twist) ----------------
function storefront(cx, cy, s) {
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.fillStyle = 'rgba(80,50,20,.18)'; g.beginPath(); g.ellipse(0, 170, 210, 16, 0, 0, 7); g.fill();
  g.fillStyle = '#f7efe3'; rr(-190, -150, 380, 320, 10); g.fill();
  g.fillStyle = '#e7d9c4'; g.fillRect(-190, 150, 380, 20);
  // the sign
  g.fillStyle = INK; rr(-150, -138, 300, 52, 10); g.fill();
  g.fillStyle = '#fff'; g.font = '800 26px Archivo'; g.textAlign = 'center'; g.fillText(T.bar.toUpperCase(), 0, -102);
  // the awning, scalloped, blue and white
  for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? '#fff' : BLUE; g.fillRect(-190 + i * 38, -78, 38, 46); g.beginPath(); g.arc(-171 + i * 38, -32, 19, 0, Math.PI); g.fill(); }
  // the window and the door
  g.fillStyle = '#bcd6e6'; rr(-165, -2, 210, 140, 6); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.moveTo(-150, 130); g.lineTo(-90, 6); g.lineTo(-60, 6); g.lineTo(-120, 130); g.fill();
  g.fillStyle = '#7a4b2a'; rr(-120, 92, 120, 10, 3); g.fill();
  for (let i = 0; i < 3; i++) { g.fillStyle = '#fff'; rr(-112 + i * 38, 70, 22, 22, 4); g.fill(); }
  g.fillStyle = INK; rr(70, -2, 95, 152, 6); g.fill(); g.fillStyle = '#bcd6e6'; rr(82, 10, 71, 80, 4); g.fill(); g.fillStyle = '#FFC24B'; g.beginPath(); g.arc(150, 100, 5, 0, 7); g.fill();

  g.fillStyle = BLUE; g.beginPath(); g.arc(117, 118, 13, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(117, 118, 8, 0, 7); g.stroke();
  g.restore();
}
function eye(cx, cy, s, cross) {
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.shadowColor = 'rgba(0,0,0,.2)'; g.shadowBlur = 20; g.shadowOffsetY = 8; g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 54, 0, 7); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = INK; g.beginPath(); g.moveTo(-34, 0); g.quadraticCurveTo(0, -36, 34, 0); g.quadraticCurveTo(0, 36, -34, 0); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 13, 0, 7); g.fill(); g.fillStyle = INK; g.beginPath(); g.arc(0, 0, 7, 0, 7); g.fill();

  g.restore();
}
// the Wallet pass in the phone
function pass(x, y, w, n) {
  g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 18; g.shadowOffsetY = 8;
  g.fillStyle = BLUE; rr(x, y, w, 170, 14); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#fff'; g.textAlign = 'left'; g.font = '700 14px Archivo'; g.fillText(T.bar.toUpperCase(), x + 16, y + 26);
  g.textAlign = 'right'; g.font = '600 9px Archivo'; g.globalAlpha *= .8; g.fillText(T.stamps, x + w - 16, y + 20); g.globalAlpha /= .8; g.font = '700 15px Archivo'; g.fillText(`${n}/10`, x + w - 16, y + 37);
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(x, y + 50, w, 76);
  for (let i = 0; i < 10; i++) { const cx = x + w * (.14 + (i % 5) * .18), cy = y + 50 + (i < 5 ? 21 : 55); g.fillStyle = i < n ? '#fff' : 'rgba(255,255,255,.28)'; g.beginPath(); g.arc(cx, cy, 11, 0, 7); g.fill(); if (i < n) { g.strokeStyle = BLUE; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, 6.5, 0, 7); g.stroke(); } }
  g.fillStyle = '#fff'; g.textAlign = 'left'; g.font = '500 12px Archivo'; g.fillText(T.reward, x + 16, y + 152);
}

// ---------------- the end: particles that make the Timbro mark ----------------
const DOTS = [...Array(140)].map((_, i) => { const a = hash(i) * Math.PI * 2, r = 220 + hash(i + 7) * 260, ring = i % 3 === 0; const ta = (i / 140) * Math.PI * 2; return { sx: 270 + Math.cos(a) * r, sy: 470 + Math.sin(a) * r, tx: 270 + Math.cos(ta) * (ring ? 46 : hash(i + 3) * 70), ty: 470 + Math.sin(ta) * (ring ? 46 : hash(i + 3) * 70), d: hash(i + 11) * .5 }; });
