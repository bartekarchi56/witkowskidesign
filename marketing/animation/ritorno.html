<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giulia torna al bancone</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* "Giulia came in every morning": a regular stops coming, and the card's own reminder (after 21 days
   without a visit, CONFIG.messages.remind) brings her back to the counter. A month on a calendar, eight
   morning coffees, three empty weeks counting up, then the phone: the reminder on the lock screen, the
   real card (UI.renderPass) taking the 9th and 10th stamps, the "one to go" and "reward ready" messages,
   and "How many Giulias did you lose this year?". The texts on the phone are the product's defaults.
   Vertical 540 x 960 (1080 x 1920 at 2x). ?lang=it|en. make.js calls window.renderAt(t). */
html,body{margin:0;background:#000}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:radial-gradient(90% 60% at 50% 55%,#171a3a 0%,#0b0c16 60%,#06070d 100%)}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.top{top:84px;text-align:center;padding:0 30px;z-index:5}
.cap{font-size:37px;line-height:1.13;font-weight:800;font-stretch:112%;letter-spacing:-.015em;color:#fff;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.cap span{display:inline-block;opacity:0;transform:translateY(12px);margin:0 .12em}
.cap span.k{color:#fff;background:var(--pop);padding:0 8px;border-radius:9px;text-shadow:none}
.cap span.y{color:#16152b;background:#FFC24B;padding:0 8px;border-radius:9px;text-shadow:none}
.cap span.r{color:#fff;background:#FF4D5E;padding:0 8px;border-radius:9px;text-shadow:none}
.band{top:0;height:290px;background:linear-gradient(rgba(6,7,13,.92),rgba(6,7,13,0));z-index:4}

/* the month */
#cal{position:absolute;left:35px;top:318px;width:470px;transform-origin:50% 0;color:#fff}
.who{display:flex;justify-content:space-between;align-items:center;height:40px;margin-bottom:12px}
.who .me{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.who .av{width:36px;height:36px;border-radius:50%;background:#FFC24B;color:#16152b;display:grid;place-items:center;font-weight:800;font-size:17px}
.who .cnt{font:600 14px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.who .cnt.red{background:#FF4D5E}
.dn{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font:600 12px/1 var(--mono);letter-spacing:.1em;color:rgba(255,255,255,.45);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,62px);gap:6px}
.cell{position:relative;height:62px;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cell b{position:absolute;left:8px;top:7px;font:600 11px/1 var(--mono);color:rgba(255,255,255,.45)}
.cell .f{position:absolute;inset:0;border-radius:14px;opacity:0}
.cell .ic{position:absolute;left:50%;top:56%;width:28px;height:28px;transform:translate(-50%,-50%) scale(0);color:#fff}
.cell .ic svg{width:100%;height:100%}
.cell.v .f{background:var(--pop)}
.cell.g .f{background:#FFC24B}.cell.g .ic{color:#16152b}
.cell.e .f{background:rgba(255,77,94,.13);box-shadow:inset 0 0 0 1px rgba(255,77,94,.35)}
.cell.e .ic{width:14px;height:3px;border-radius:2px;background:rgba(255,120,130,.55)}
.cell.n .f{box-shadow:inset 0 0 0 2.5px #7B80FF;background:rgba(43,50,255,.2)}

/* the phone */
#phone{position:absolute;left:115px;top:0;width:310px;height:640px;border-radius:50px;padding:11px;background:linear-gradient(145deg,#3a3a3f 0%,#121214 38%,#1d1d20 100%);
  box-shadow:inset 0 0 0 1.5px #5a5a60,inset 0 0 0 4px #0b0b0c,0 0 0 1px rgba(255,255,255,.06),0 50px 120px -30px rgba(43,50,255,.65);z-index:3}
#phone .scr{position:relative;height:100%;border-radius:40px;overflow:hidden;background:#F2F2F7}
#phone .island{position:absolute;top:10px;left:50%;width:96px;height:28px;border-radius:18px;background:#000;transform:translateX(-50%);z-index:9}
.lockv{position:absolute;inset:0;background:linear-gradient(165deg,#3B41FF 0%,#1B1F8A 50%,#0B0B0C 100%);color:#fff;padding:56px 14px 0}
.lockv .ld{font:600 15px/1 -apple-system,"SF Pro Text",var(--font);text-align:center;opacity:.85}
.lockv .lt{font:300 72px/1 -apple-system,"SF Pro Display",var(--font);text-align:center;letter-spacing:-.02em;margin:6px 0 26px}
.cardv{position:absolute;inset:0;padding:56px 12px 0;opacity:0}
.cardv .pass{max-width:none}
.notif{background:rgba(255,255,255,.9);color:#0B0B0C;border-radius:18px;padding:11px 12px;display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;align-items:start;font:13.5px/1.3 -apple-system,"SF Pro Text",var(--font);box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.notif .ni{grid-row:1/3;width:36px;height:36px;border-radius:9px;background:#0B0B0C;display:grid;align-content:center;gap:2px;padding:0 6px}
.notif .ni i{display:block;height:4px;border-radius:2px}
.notif b{font-weight:600}
.notif small{color:#6B6B70;font-size:12px}
.notif p{grid-column:2/4;margin:0}
.banner{position:absolute;left:10px;right:10px;top:46px;z-index:8;opacity:0}

/* how many Giulias */
#ppl{position:absolute;left:50px;top:330px;width:440px;display:grid;grid-template-columns:repeat(8,1fr);gap:12px 10px}
#ppl i{display:block;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1);position:relative;opacity:0}
#ppl i::after{content:"";position:absolute;left:32%;top:22%;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.35)}
#ppl i.on{background:var(--pop)}#ppl i.on::after{background:#fff}
#ppl i u{position:absolute;inset:-6px;border-radius:50%;border:2px solid #7B80FF;opacity:0}

canvas{position:absolute;inset:0;width:540px;height:960px;display:block;pointer-events:none;z-index:6}
.end{bottom:150px;text-align:center;opacity:0;z-index:7}
.end span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#16152b;font-size:20px;font-weight:700;padding:14px 20px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.end span i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 5px var(--pop),inset 0 0 0 7px #fff;flex:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="cal"><div class="who"><span class="me"><span class="av">G</span>Giulia</span><span class="cnt" id="cnt"></span></div><div class="dn" id="dn"></div><div class="grid" id="grid"></div></div>
  <div id="ppl"></div>
  <div id="phone"><div class="scr"><div class="island"></div>
    <div class="lockv" id="lockv"><div class="ld" id="ld"></div><div class="lt">10:30</div><div id="remind"></div></div>
    <div class="cardv" id="cardv"><div id="pass"></div></div>
    <div class="banner" id="bClose"></div><div class="banner" id="bReady"></div></div></div>
  <div class="ov band"></div>
  <div class="ov top"><div class="cap" id="cap"></div></div>
  <canvas id="o"></canvas>
  <div class="ov end" id="end"><span><i></i><b id="endT"></b></span></div>
</div>
<script src="../../assets/vendor/qrcode.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/stamps.js"></script>
<script>
(async () => {
const q = new URLSearchParams(location.search);
const lang = q.get('lang') === 'en' ? 'en' : 'it';
I18N.lang = lang; document.documentElement.lang = lang;
const RJ = await (await fetch('ritorno.json')).json(), B = RJ.beats, DURATION = RJ.duration;
// Captions: [start, text]; *word* is marked blue, _word_ gold, ~word~ red
const T = {
  it: {
    caps: [[.2, 'Giulia veniva *ogni mattina.*'], [B.gone, 'Poi, per *3 settimane,* ~niente.~'], [B.nobody, 'Al bar nessuno se n’è *accorto.*'], [B.card, 'La sua carta *sì.*'],
      [B.msg, 'Dopo *21 giorni,* le scrive da sola.'], [B.back, 'Il giorno dopo, Giulia è di nuovo *al bancone.*'], [B.close, 'Le manca *un timbro.*'],
      [B.ten, 'Al decimo, il caffè è _offerto._'], [B.you, 'Quante *Giulia* hai perso quest’anno?'], [B.them, 'Timbro *le avvisa* per te.'], [B.cta, 'Commenta *TIMBRO* 👇']],
    end: 'e ti disegniamo la tua carta ☕', days: 'LMMGVSD', stamps: n => `${n}/10 timbri`, gone: n => `${n} ${n === 1 ? 'giorno' : 'giorni'} senza visite`, day: 'mercoledì'
  },
  en: {
    caps: [[.2, 'Giulia came in *every morning.*'], [B.gone, 'Then for *3 weeks,* ~nothing.~'], [B.nobody, 'Nobody at the café *noticed.*'], [B.card, 'Her card *did.*'],
      [B.msg, 'After *21 days,* it reminds her by itself.'], [B.back, 'The next day, Giulia is back *at the counter.*'], [B.close, 'One stamp *to go.*'],
      [B.ten, 'The tenth coffee is _on the house._'], [B.you, 'How many *Giulias* did you lose this year?'], [B.them, 'Timbro *reminds them* for you.'], [B.cta, 'Comment *TIMBRO* 👇']],
    end: 'to get your own card designed ☕', days: 'MTWTFSS', stamps: n => `${n}/10 stamps`, gone: n => `${n} ${n === 1 ? 'day' : 'days'} without a visit`, day: 'Wednesday'
  }
}[lang];
const $ = id => document.getElementById(id);
$('endT').textContent = T.end;
await Promise.all(['800 40px Archivo', '700 40px Archivo', '600 40px Archivo', '500 40px Archivo', '500 20px "Spline Sans Mono"', '600 20px "Spline Sans Mono"'].map(f => document.fonts.load(f)));

const W = 540, H = 960, DPR = +(q.get('dpr') || 2), BLUE = '#2B32FF', GOLD = '#FFC24B';
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const backOut = x => { x = clamp01(x); const c = 1.7; return Math.max(0, 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2)); };
const hash = i => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const lerp = (a, b, x) => a + (b - a) * x;

// ---------------- the month: 5 weeks from a Monday the 3rd; Giulia's 8 visits, 21 days without one ----------------
const CARD = { business: lang === 'it' ? 'Il tuo bar' : 'Your café', title: lang === 'it' ? 'Carta caffè' : 'Coffee card', reward: lang === 'it' ? 'un caffè gratis' : 'a free coffee',
  stampsNeeded: 10, color: '#FFFFFF', ink: BLUE, stamp: 'sole', font: 'sans', strip: '' };
const VISITS = [0, 1, 2, 3, 4, 7, 8, 9], LAST = 9, NUDGE = LAST + 21, BACK = [NUDGE + 1, NUDGE + 2];
const visitAt = k => .6 + k * .38;
$('dn').innerHTML = [...T.days].map(d => `<span>${d}</span>`).join('');
const cup = UI.icon('cup');
const bell = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>';
const cells = [...Array(35)].map((_, i) => {
  const kind = VISITS.includes(i) ? 'v' : BACK.includes(i) ? 'g' : i === NUDGE ? 'n' : i > LAST && i < NUDGE ? 'e' : '';
  const c = document.createElement('div'); c.className = 'cell ' + kind;
  c.innerHTML = `<b>${(i + 3 - 1) % 30 + 1}</b><div class="f"></div><div class="ic">${kind === 'v' || kind === 'g' ? cup : kind === 'n' ? bell : ''}</div>`;
  $('grid').appendChild(c);
  const on = kind === 'v' ? visitAt(VISITS.indexOf(i)) : kind === 'e' ? B.gone + .2 + (i - LAST - 1) * .14 : kind === 'n' ? B.msg + .5 : kind === 'g' ? (i === BACK[0] ? B.back + .3 : B.ten + .2) : 99;
  return { c, f: c.children[1], ic: c.children[2], kind, on, i };
});
$('ld').textContent = `${T.day} ${(NUDGE + 3 - 1) % 30 + 1}`;

// ---------------- the phone: lock screen with the reminder, then the real card ----------------
const WALLET = '<span class="ni"><i style="background:#39B54A"></i><i style="background:#F7B500"></i><i style="background:#F2552C"></i><i style="background:#2B8EF0"></i></span>';
const notif = (text, when) => `<div class="notif">${WALLET}<b>Wallet · ${UI.esc(CARD.business)}</b><small>${when}</small><p>${UI.esc(text)}</p></div>`;
const now = lang === 'it' ? 'ora' : 'now';
$('remind').innerHTML = notif(UI.fillMessage(CONFIG.messages.remind[lang], CARD, { name: 'Giulia', left: 2, lang }), now);
$('bClose').innerHTML = notif(UI.fillMessage(CONFIG.messages.close[lang], CARD, { left: 1, lang }), now);
$('bReady').innerHTML = notif(UI.fillMessage(CONFIG.messages.ready[lang], CARD, { name: 'Giulia', lang }), now);
let passKey = -1;
function setPass(n, age) {
  if (n !== passKey) { $('pass').innerHTML = UI.renderPass(CARD, null, { stamps: n, platform: 'apple', compact: false }); passKey = n; }
  const dot = $('pass').querySelectorAll('.wp-dot.on')[n - 1];
  if (!dot) return;
  if (age < .4) { const p = age / .4; dot.style.transform = `scale(${(1 + .9 * (1 - backOut(p))).toFixed(3)})`; dot.style.opacity = Math.min(1, p / .55); }
  else { dot.style.transform = ''; dot.style.opacity = ''; }
}

// ---------------- the others: how many Giulias ----------------
const PPL = [...Array(40)].map((_, i) => { const e = document.createElement('i'); e.innerHTML = '<u></u>'; $('ppl').appendChild(e); return { e, u: e.firstChild, pick: hash(i + 5) < .32, d: hash(i + 1) * .5 }; });
const picks = PPL.filter(p => p.pick);

// ---------------- 2D overlay: confetti, the end ----------------
const oc = $('o'); oc.width = W * DPR; oc.height = H * DPR; const og = oc.getContext('2d');
const DOTS = [...Array(160)].map((_, i) => { const a = hash(i) * Math.PI * 2, r = 230 + hash(i + 7) * 260, ring = i % 3 === 0, ta = (i / 160) * Math.PI * 2; return { sx: 270 + Math.cos(a) * r, sy: 470 + Math.sin(a) * r, tx: 270 + Math.cos(ta) * (ring ? 46 : hash(i + 3) * 70), ty: 470 + Math.sin(ta) * (ring ? 46 : hash(i + 3) * 70), d: hash(i + 11) * .5 }; });
const CONF = [...Array(60)].map((_, i) => ({ a: -Math.PI / 2 + (hash(i + 21) - .5) * 2.4, v: 260 + hash(i + 33) * 320, c: [BLUE, GOLD, '#fff', '#7B80FF'][i % 4], s: 5 + hash(i + 2) * 6, r: hash(i + 9) * 6 }));

function caption(t) {
  const ci = T.caps.findLastIndex(([s]) => t >= s), cap = T.caps[ci];
  if (renderAt.ci !== ci) {
    renderAt.ci = ci;
    const html = cap ? cap[1].replace(/([*_~])([^*_~]+)\1/g, (_, k, x) => `\u0001${k}${x.replace(/ /g, '\u0002')}\u0001`) : '';
    $('cap').innerHTML = html.split(' ').filter(Boolean).map(w => { const mk = w.match(/\u0001([*_~])(.+)\u0001(.*)/); if (mk) return `<span class="${{ '*': 'k', '_': 'y', '~': 'r' }[mk[1]]}">${mk[2].replace(/\u0002/g, ' ')}</span>${mk[3] ? `<span>${mk[3]}</span>` : ''}`; return `<span>${w}</span>`; }).join('');
  }
  if (!cap) return;
  const next = T.caps[ci + 1], out = next ? clamp01((t - next[0] + .12) / .12) : 0;
  [...$('cap').children].forEach((s, i) => { const k = backOut((t - cap[0] - i * .09) / .32); s.style.opacity = clamp01((t - cap[0] - i * .09) / .12) * (1 - out); s.style.transform = `translateY(${(1 - k) * 14}px) scale(${.9 + .1 * k})`; });
}

function renderAt(t) {
  caption(t);
  // the month: in, then up and smaller for the phone, then away
  const shrink = ease((t - B.card + .2) / .8), away = ease((t - B.you + .3) / .6);
  $('cal').style.transform = `translateY(${(lerp(0, -74, shrink) + (1 - easeOut(t / .6)) * 40).toFixed(1)}px) scale(${lerp(1, .5, shrink).toFixed(3)})`;
  $('cal').style.opacity = clamp01(t / .4) * (1 - away);
  cells.forEach(({ c, f, ic, kind, on, i }) => {
    c.style.opacity = clamp01((t - i * .012) / .3);
    const p = backOut((t - on) / .35), lit = clamp01((t - on) / .15);
    f.style.opacity = lit * (kind === 'e' ? 1 - .5 * ease((t - B.card) / .6) : 1);
    ic.style.transform = `translate(-50%,-50%) scale(${(kind ? p : 0).toFixed(3)})`;
    c.style.transform = kind === 'n' && t > on ? `scale(${(1 + .12 * Math.sin(Math.PI * clamp01((t - on) / .5))).toFixed(3)})` : '';
  });
  const nv = VISITS.filter(i => t >= visitAt(VISITS.indexOf(i))).length, ng = clamp01((t - B.gone - .2) / (21 * .14) + 1 / 21) * 21 | 0;   // the 21 days up to the reminder
  const st = t >= B.ten + .2 ? 10 : t >= B.back + .3 ? 9 : nv;
  const cnt = $('cnt');
  if (ng && t < B.card + .4) { cnt.textContent = T.gone(ng); cnt.className = 'cnt red'; cnt.style.transform = `scale(${(1 + (t > B.nobody && t < B.nobody + .6 ? .1 * Math.sin(Math.PI * (t - B.nobody) / .6) : 0)).toFixed(3)})`; }
  else { cnt.textContent = T.stamps(Math.max(st, 0)); cnt.className = 'cnt'; cnt.style.transform = ''; }
  cnt.style.opacity = t > .5 ? 1 : 0;

  // the phone
  const rise = backOut((t - B.card) / .9), sink = ease((t - B.you) / .7);
  const ph = $('phone');
  ph.style.visibility = t > B.card - .1 && sink < 1 ? 'visible' : 'hidden';
  ph.style.transform = `translateY(${(lerp(1000, 478, rise) + sink * 620 + Math.sin(t * 1.2) * 3).toFixed(1)}px) rotate(${(lerp(8, 0, easeOut((t - B.card) / .9)) + Math.sin(t * .7) * .6).toFixed(2)}deg)`;
  const rv = easeOut((t - B.msg - .4) / .45);
  $('remind').style.opacity = rv; $('remind').style.transform = `translateY(${((1 - rv) * -24).toFixed(1)}px) scale(${(.94 + .06 * rv).toFixed(3)})`;
  const toCard = ease((t - B.back) / .45);
  $('lockv').style.opacity = 1 - toCard; $('cardv').style.opacity = toCard;
  if (toCard > 0) {
    const s9 = B.back + .6, s10 = B.ten + .4;
    setPass(t >= s10 ? 10 : t >= s9 ? 9 : 8, t >= s10 ? t - s10 : t >= s9 ? t - s9 : 9);
    const pr = $('pass').querySelector('.pass'); if (pr) pr.style.transform = `scale(${(1 + .03 * Math.sin(Math.PI * clamp01((t - s10) / .3))).toFixed(3)})`;
  }
  const banner = (el, a, b) => { const k = easeOut((t - a) / .4) * (1 - ease((t - b) / .3)); el.style.opacity = k; el.style.transform = `translateY(${((1 - easeOut((t - a) / .4)) * -40).toFixed(1)}px)`; };
  banner($('bClose'), B.close + .2, B.ten + .1); banner($('bReady'), B.ten + 1.1, B.you);

  // how many Giulias
  const pv = t > B.you ? 1 - ease((t - B.F + .2) / .3) : 0;
  $('ppl').style.opacity = pv;
  PPL.forEach((p, i) => {
    const a = backOut((t - B.you - .5 - p.d) / .4); p.e.style.opacity = clamp01(a * 2); p.e.style.transform = `scale(${a.toFixed(3)})`;
    const on = p.pick && t > B.them + .3 + picks.indexOf(p) * .12;
    p.e.classList.toggle('on', on);
    const u = (t - B.them - .3 - picks.indexOf(p) * .12) / .8; p.u.style.opacity = p.pick && u > 0 && u < 1 ? 1 - u : 0; p.u.style.transform = `scale(${(1 + easeOut(u) * .6).toFixed(3)})`;
  });

  // overlay: confetti at the tenth stamp, then the end
  og.setTransform(DPR, 0, 0, DPR, 0, 0); og.clearRect(0, 0, W, H);
  const cu = (t - B.ten - .45) / 1.6;
  if (cu > 0 && cu < 1) CONF.forEach((c, i) => {
    const x = 270 + Math.cos(c.a) * c.v * cu, y = 640 + Math.sin(c.a) * c.v * cu + 420 * cu * cu;
    og.save(); og.globalAlpha = 1 - cu; og.translate(x, y); og.rotate(c.r + cu * 8); og.fillStyle = c.c; og.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); og.restore();
  });
  if (t >= B.F - .1) {
    const k = clamp01((t - B.F + .1) / .35), lt = t - B.F;
    og.globalAlpha = k;
    const bg = og.createRadialGradient(270, 470, 20, 270, 470, 620); bg.addColorStop(0, '#1c1f6e'); bg.addColorStop(.5, '#0d0c2b'); bg.addColorStop(1, '#05050f'); og.fillStyle = bg; og.fillRect(0, 0, W, H);
    DOTS.forEach((d, i) => { const u = ease((lt - d.d) / 1.0); og.globalAlpha = k * (1 - ease((lt - 1.3) / .4)) * clamp01(lt * 3); og.fillStyle = i % 4 ? 'rgba(140,150,255,.9)' : '#fff'; og.beginPath(); og.arc(lerp(d.sx, d.tx, u), lerp(d.sy, d.ty, u), 2.2, 0, 7); og.fill(); });
    og.globalAlpha = k;
    const m = backOut((lt - 1.1) / .6);
    if (m > 0) {
      og.save(); og.translate(270, 470); og.scale(m, m); og.shadowColor = '#6f76ff'; og.shadowBlur = 40 + 20 * Math.sin(lt * 2.5); og.fillStyle = BLUE; og.beginPath(); og.arc(0, 0, 70, 0, 7); og.fill(); og.shadowBlur = 0;
