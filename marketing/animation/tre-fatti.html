<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tre fatti sui clienti</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* "3 facts about regulars": a 37-second reel in 3D (three.js) set in a cut-away café on a warm
   paper background. Each fact comes from a published study, named on screen:
   1. Endowed progress (Nunes & Drèze 2006, car wash cards): 8 stamps to go, but the card that
      starts with 2 stamps already in is finished by 34% of customers against 19%.
   2. Goal gradient (Kivetz, Urminsky & Zheng 2006, a Columbia University café): the closer to the
      free coffee, the more often they come. A walker on stepping stones that get closer together.
   3. A new customer costs 5 to 25 times more than keeping one (Harvard Business Review, 2014):
      coins on a balance.
   Then the Wallet card and "Comment TIMBRO". Vertical 540 x 960 (1080 x 1920 at 2x). ?lang=it|en.
   make.js calls window.renderAt(t). */
html,body{margin:0;background:#111}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:radial-gradient(120% 75% at 50% 52%,#fbf4e8 0%,#f3e5d0 50%,#e3cdb0 100%)}
canvas{position:absolute;inset:0;width:540px;height:960px;display:block}
#c{transition:none}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.top{top:78px;text-align:center;padding:0 26px}
.chip{display:inline-flex;align-items:center;gap:9px;font:500 12.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#16152b;padding:8px 13px 7px;border-radius:99px;margin-bottom:14px;box-shadow:0 6px 16px rgba(40,25,10,.18)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 2px #fff}
.cap{font-size:35px;line-height:1.12;font-weight:800;font-stretch:112%;letter-spacing:-.015em;color:#16152b;text-wrap:balance}
.cap mark{background:var(--pop);color:#fff;padding:0 9px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap mark.y{background:#FFC24B;color:#16152b}
.src{margin:14px auto 0;display:inline-flex;align-items:center;gap:8px;font:500 11px/1.35 var(--mono);color:#6d5c49;letter-spacing:.02em;background:rgba(255,255,255,.6);padding:6px 11px;border-radius:8px}
.src svg{flex:none}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;opacity:0;will-change:transform}
.lab .pill{display:inline-block;background:#fff;color:#16152b;border-radius:14px;padding:9px 15px 10px;box-shadow:0 12px 26px rgba(60,35,10,.22);position:relative}
.lab .pill::after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.lab b{display:block;font-size:36px;line-height:1;font-weight:800;font-stretch:110%;letter-spacing:-.02em}
.lab span{display:block;font:500 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#7a6a58;margin-top:5px}
.lab.blue .pill{background:var(--pop);color:#fff}
.lab.blue span{color:rgba(255,255,255,.82)}
.lab.dark .pill{background:#16152b;color:#fff}
.lab.dark span{color:rgba(255,255,255,.7)}
.notif{top:262px;padding:0 22px;opacity:0}
.nb{display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.95);border-radius:24px;padding:15px 17px 16px;box-shadow:0 20px 44px rgba(50,30,10,.3);text-align:left}
.nb .app{width:46px;height:46px;border-radius:12px;background:var(--pop);flex:none;display:grid;place-items:center}
.nb .app i{width:22px;height:22px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 4px #fff}
.nb .tt{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:700;color:#111}
.nb .tt span{font-size:13px;font-weight:500;color:#8a8a8f}
.nb p{margin:3px 0 0;font-size:16px;line-height:1.32;color:#2a2a2e;font-weight:500}
.end{bottom:205px;text-align:center;opacity:0}
.end span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#16152b;font-size:19px;font-weight:700;padding:13px 18px;border-radius:16px;box-shadow:0 14px 30px rgba(60,35,10,.25)}
.end span i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 5px var(--pop),inset 0 0 0 7px #fff;flex:none}
.band{top:0;height:330px;background:linear-gradient(#f8efe2 0%,rgba(248,239,226,.92) 45%,rgba(248,239,226,0) 100%)}
.vig{inset:0;background:radial-gradient(140% 90% at 50% 45%,transparent 55%,rgba(90,55,20,.22) 100%)}
.grain{inset:0;opacity:.09;mix-blend-mode:multiply}
.flash{inset:0;background:#fff8ee;opacity:0}
</style>
</head>

<script type="module">

      [25.2, 'Fact 3 / 3', '<mark>5 to 25 times more</mark> than keeping one.', 'Harvard Business Review, 2014'],
      [END + .2, '', 'The easiest customer? <mark>The one you already have.</mark>', ''],
      [32.6, '', 'Comment <mark>TIMBRO</mark> 👇', '']
    ],
    card: 'CARD', reward: 'REWARD', rewardV: '1 FREE', reach: 'reach the reward', newC: 'new customer', oldC: 'regular',
    menu: ['Espresso', '1.30', 'Cappuccino', '1.80', 'Croissant', '1.50', 'Matcha latte', '3.50', 'Orange juice', '3.00'],
    qr: ['Scan', 'for your loyalty card'], end: 'We’ll send you your card’s design ☕',
    bar: 'Bar Aurora', stamps: 'STAMPS', rewardW: 'a free coffee', customer: 'MEMBER', ready: 'Reward ready: show it at the till',
    notif: 'Just 1 stamp to go for a free coffee! See you at Bar Aurora.', now: 'now', date: 'Thursday 23 October'
  }

const $ = id => document.getElementById(id);
$('endT').textContent = T.end; $('nbT').textContent = T.bar; $('nbW').textContent = T.now; $('nbP').textContent = T.notif;
await Promise.all(['800 40px Archivo', '700 40px Archivo', '600 40px Archivo', '500 40px Archivo', 'italic 600 40px "EB Garamond"', '500 20px "Spline Sans Mono"'].map(f => document.fonts.load(f)));

const BLUE = '#2B32FF', INK = '#16152b';
const W = 540, H = 960, DPR = +(q.get('dpr') || 2);
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(DPR); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);

// ---------------- people ----------------
const barista = person({ i: 6, apron: '#2f4a3a', shirt: '#f3efe6', hair: 1 });
barista.g.position.set(.5, 0, -2.55);
const counterGuest = person({ i: 2, phone: true, hair: 2, capColor: BLUE });
counterGuest.g.position.set(2.45, 0, -1.38); counterGuest.g.rotation.y = Math.PI + .1;
const seated = [
  [person({ i: 0, cup: true, hair: 3 }), TABLES[0][0] + .55, TABLES[0][1] + .05, -Math.PI / 2],
  [person({ i: 4, glasses: true, hair: 0 }), TABLES[0][0] - .55, TABLES[0][1] - .05, Math.PI / 2],
  [person({ i: 5, cup: true, hair: 4 }), TABLES[1][0] + .55, TABLES[1][1] + .05, -Math.PI / 2]
];
seated.forEach(([p, x, z, ry]) => { p.sit(); p.g.position.set(x, .07, z); p.g.rotation.y = ry; });

// ---------------- fact 1: two cards, two glasses ----------------
const fact1 = new THREE.Group(); scene.add(fact1);
const CARD_W = .98, CARD_H = .62, CTW = 1024, CTH = 650;

  const c = document.createElement('canvas'); c.width = CTW; c.height = CTH;
  const draw = n => {
    const g = c.getContext('2d'), w = CTW, h = CTH;
    g.fillStyle = '#fffdf8'; g.fillRect(0, 0, w, h);
    g.fillStyle = which === 'B' ? BLUE : INK; g.fillRect(0, 0, w, 150);
    g.fillStyle = '#fff'; g.font = '800 64px Archivo'; g.textAlign = 'left'; g.fillText(`${T.card} ${which}`, 60, 100);
    g.textAlign = 'right'; g.font = '500 44px "Spline Sans Mono"'; g.fillText(`${n}/${which === 'A' ? 8 : 10}`, w - 60, 98);
    slotsOf(which).forEach(([x, y, r], i) => {
      if (i < n) { g.fillStyle = BLUE; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - r * .38, y + 2); g.lineTo(x - r * .08, y + r * .3); g.lineTo(x + r * .42, y - r * .3); g.stroke(); }
      else { g.setLineDash([14, 10]); g.strokeStyle = '#a99c88'; g.lineWidth = 7; g.beginPath(); g.arc(x, y, r - 3, 0, 7); g.stroke(); g.setLineDash([]); }
    });
    g.fillStyle = '#8a7a66'; g.textAlign = 'left'; g.font = '500 34px "Spline Sans Mono"'; g.fillText(T.reward, 60, 600);
    g.textAlign = 'right'; g.fillStyle = INK; g.font = '800 40px Archivo'; g.fillText(T.rewardV, w - 60, 602);
    if (c.tex) c.tex.needsUpdate = true;
  };
  c.draw = draw; return c;
}
function makeCard(which, n) {
  const g = new THREE.Group();
  const body = rbox(CARD_W + .02, CARD_H + .02, .025, .05, mat('#ffffff', .4)); add(body, g);
  const cv = cardCanvas(which); cv.draw(n); cv.tex = tex(cv);
  const f = face(CARD_W, CARD_H, .045, cv.tex); f.material = new THREE.MeshBasicMaterial({ map: cv.tex, toneMapped: false }); f.position.z = .014; g.add(f);
  g.userData = { which, cv, n }; fact1.add(g); return g;
}
const cardA = makeCard('A', 0), cardB = makeCard('B', 0);
const CARD_POS = { A: V(.02, 1.74, .45), B: V(1.24, 1.74, .45) };
function makeGlass(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); fact1.add(g);
  const gl = lathe([[0, 0], [.27, 0], [.28, .03], [.29, 1.2], [.275, 1.2], [.265, .04], [0, .04]], GLASS, 48); g.add(gl);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(.283, .006, 8, 48), mat('#ffffff', .1, { transparent: true, opacity: .6 })); rim.rotation.x = Math.PI / 2; rim.position.y = 1.2; g.add(rim);
  const base = cyl(.3, .3, .04, mat('#f6efe4', .3), 0, .02, 0, g, 48);
  const liquid = cyl(.258, .258, 1, mat('#4a2a16', .25), 0, .5, 0, g, 48); liquid.castShadow = false;
  const crema = cyl(.259, .259, .03, mat('#c78d55', .4), 0, 0, 0, g, 48); crema.castShadow = false;
  for (let k = 1; k < 10; k++) { const tick = new THREE.Mesh(new THREE.PlaneGeometry(k % 5 ? .05 : .09, .006), new THREE.MeshBasicMaterial({ color: '#8a7a66', transparent: true, opacity: .5 })); tick.position.set(-.21, .05 + k * .115, .26); g.add(tick); }
  g.userData = { liquid, crema }; return g;
}
const glassA = makeGlass(.02, 1.05), glassB = makeGlass(1.24, 1.05);
const setLevel = (gl, lv) => { const h = Math.max(.001, lv * 1.15), { liquid, crema } = gl.userData; liquid.scale.y = h; liquid.position.y = .04 + h / 2; crema.position.y = .04 + h + .012; crema.visible = lv > .005; liquid.visible = lv > .002; };
// a rubber stamp that presses card B's first two stamps
const rubber = new THREE.Group(); fact1.add(rubber);
const TILT = new THREE.Quaternion().setFromEuler(new THREE.Euler(-.75, .55, 0));
{ const k = new THREE.Group(); rubber.add(k); k.rotation.x = Math.PI / 2;   // its own axis points along +z (the stamp's face looks at -z)
  const base = rbox(.24, .16, .07, .02, mat(BLUE, .4)); base.rotation.x = -Math.PI / 2; base.position.y = -.0; add(base, k);
  cyl(.1, .1, .02, mat('#1c1b20', .8), 0, -.045, 0, k, 24);
  cyl(.035, .045, .16, mat('#8a5a33', .5), 0, .11, 0, k, 16);
  sph(.07, mat('#8a5a33', .45), 0, .22, 0, k); }

// ---------------- fact 2: stepping stones to the free coffee ----------------
const fact2 = new THREE.Group(); scene.add(fact2);
const PS = V(-1.25, 0, -.8), PE = V(1.85, 0, 1.55), PDIR = PE.clone().sub(PS), PLEN = PDIR.length(); PDIR.normalize();
const GAPS = [.5, .62, .58, .54, .5, .46, .42, .38, .34, .3], GSUM = GAPS.reduce((a, b) => a + b);

const stoneMats = STONES.map(() => mat('#efe4d3', .5));
const stones = STONES.map((p, i) => { const s = cyl(.12, .13, .04, stoneMats[i], p.x, .02, p.z, fact2, 32); const ring = new THREE.Mesh(new THREE.TorusGeometry(.125, .008, 6, 32), mat('#c9bfb0', .6)); ring.rotation.x = Math.PI / 2; ring.position.set(p.x, .042, p.z); fact2.add(ring); return s; });
const bursts = STONES.map(p => { const b = new THREE.Mesh(new THREE.RingGeometry(.13, .16, 40), new THREE.MeshBasicMaterial({ color: BLUE, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })); b.rotation.x = -Math.PI / 2; b.position.set(p.x, .05, p.z); fact2.add(b); return b; });
const PED = PE.clone().addScaledVector(PDIR, .5);
const pedestal = new THREE.Group(); pedestal.position.set(PED.x, 0, PED.z); fact2.add(pedestal);
cyl(.26, .3, .42, mat('#fbf7f0', .3), 0, .21, 0, pedestal, 40);
cyl(.31, .31, .03, BRASS, 0, .43, 0, pedestal, 40); cyl(.31, .31, .03, BRASS, 0, .015, 0, pedestal, 40);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, color: '#ffd57a', transparent: true, opacity: 0, depthWrite: false })); halo.scale.setScalar(1.1); halo.position.y = .7; pedestal.add(halo);
const walker = person({ i: 7, phone: true, hair: 3, shirt: '#FF8C42' }); walker.g.parent.remove(walker.g); fact2.add(walker.g);
const CONF = [BLUE, '#FFC24B', '#FF5C7A', '#2EC4B6', '#ffffff'];
const confetti = [...Array(70)].map((_, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(.05, .085), new THREE.MeshBasicMaterial({ color: CONF[i % 5], side: THREE.DoubleSide })); m.visible = false; fact2.add(m); return m; });
// stone k (1..10) reached at ARR[k-1]; gaps shrink as the free coffee gets close
const ARR = [14.6, 15.55, 16.37, 17.09, 17.71, 18.25, 18.72, 19.14, 19.51, 21.0];

// ---------------- fact 3: a balance with coins ----------------
const fact3 = new THREE.Group(); fact3.position.set(.75, 0, .55); scene.add(fact3);
const POLE = 1.3, ARM = .6, HANG = .52;
cyl(.36, .4, .07, mat('#1f1e24', .4), 0, .035, 0, fact3, 40);
cyl(.33, .33, .012, BRASS, 0, .075, 0, fact3, 40);
cyl(.035, .045, POLE, BRASS, 0, POLE / 2 + .07, 0, fact3, 16);
sph(.065, BRASS, 0, POLE + .1, 0, fact3);
const beam = new THREE.Group(); beam.position.y = POLE + .1; fact3.add(beam);
{ const b = box(ARM * 2 + .08, .04, .045, BRASS, 0, 0, 0, beam); for (const x of [-ARM, ARM]) sph(.035, BRASS, x, 0, 0, beam); const needle = box(.018, .26, .018, BRASS, 0, .13, 0, beam); }
const pans = [-1, 1].map(sd => {
  const g = new THREE.Group(); fact3.add(g);
  const pan = lathe([[0, 0], [.15, 0], [.25, .06], [.26, .075], [.245, .075], [.14, .013], [0, .013]], BRASS, 40); add(pan, g);
  const chains = [0, 1, 2].map(k => { const c = new THREE.Mesh(new THREE.CylinderGeometry(.005, .005, 1, 6), BRASS); fact3.add(c); return c; });

pans.forEach(p => p.g.add(p.coins));
const COIN = new THREE.CylinderGeometry(.068, .068, .018, 28), COINM = new THREE.MeshStandardMaterial({ color: '#f2c14e', roughness: .28, metalness: 1 });
const STACKS = [[0, 0, 5], [.11, 0, 4], [-.11, 0, 4], [.055, .095, 3], [-.055, .095, 3], [.055, -.095, 3], [-.055, -.095, 3]];
const coinSpots = []; STACKS.forEach(([x, z, n]) => { for (let k = 0; k < n; k++) coinSpots.push([x + (hash(coinSpots.length) - .5) * .015, .025 + k * .019, z + (hash(coinSpots.length + 9) - .5) * .02]); });

  $('end').style.transform = `translateY(${(1 - backOut((t - 33.4) / .5)) * 20}px)`;
}
window.renderAt = renderAt;
window.DURATION = DURATION;
renderAt(0);
window.READY = true;
if (!q.has('capture')) {
  const t0 = performance.now() - (+(q.get('t') || 0)) * 1000;
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % (DURATION + .5)); requestAnimationFrame(loop); };
  loop();
}
</script>
