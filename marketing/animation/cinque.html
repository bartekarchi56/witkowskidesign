<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five customers</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* "Every café has these 5 customers. Which one are you?": a quiz reel in English, timed to an
   ElevenLabs voice-over (beats in cinque.json), in the isometric café (cafe-iso.js). The five,
   numbered from the first frame: 1 forgets the card, 2 never claims the free coffee, 3 carries
   twelve paper cards, 4 "the usual", 5 one stamp away and suddenly in every day. Small tags show
   what the card on the phone changes, with the product's own messages ("…your reward is ready",
   "Just 1 stamp to go…"). Ends on the five in a row: "Which one are you? Comment the number."
   Built for comments (a one-character answer) and sends (tag the friend who's number 3).
   Vertical 540 x 960 (1080 x 1920 at 2x). make.js calls window.renderAt(t). */
html,body{margin:0;background:#111}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 50%,#f3efe9 0%,#ece7df 70%,#e2dbd0 100%)}
canvas{position:absolute;inset:0;width:540px;height:960px;display:block}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.top{top:78px;text-align:center;padding:0 24px;z-index:5}
.chip{display:inline-flex;align-items:center;gap:9px;font:500 12.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#16152b;padding:8px 13px 7px;border-radius:99px;margin-bottom:14px;box-shadow:0 6px 16px rgba(40,25,10,.18)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 2px #fff}
.cap{font-size:36px;line-height:1.12;font-weight:800;font-stretch:112%;letter-spacing:-.015em;color:#16152b;text-wrap:balance}
.cap mark{background:var(--pop);color:#fff;padding:0 9px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap mark.y{background:#FFC24B;color:#16152b}
.cap .n{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#16152b;color:#fff;font-size:28px;vertical-align:4px;margin-right:6px}
.band{top:0;height:330px;background:linear-gradient(#f1ede7 0%,rgba(241,237,231,.92) 45%,rgba(241,237,231,0) 100%);z-index:4}
.vig{inset:0;background:radial-gradient(140% 90% at 50% 45%,transparent 60%,rgba(80,60,40,.12) 100%)}
.grain{inset:0;opacity:.09;mix-blend-mode:multiply;z-index:9}
.pin{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;will-change:transform;z-index:3}
.num{width:42px;height:42px;border-radius:50%;background:#16152b;color:#fff;display:grid;place-items:center;font:800 24px/1 var(--font);font-stretch:112%;box-shadow:0 0 0 3px #fff,0 10px 20px rgba(40,25,10,.3)}
.num.on{background:var(--pop)}
.bub .pill{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#16152b;border-radius:14px;padding:9px 13px;box-shadow:0 10px 22px rgba(60,35,10,.22);position:relative;font-size:16px;font-weight:700}
.bub .pill::after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bub.dark .pill{background:#16152b;color:#fff}
.hint .pill{display:inline-flex;align-items:center;gap:8px;background:var(--pop);color:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;box-shadow:0 10px 22px rgba(43,50,255,.3)}
.hint .pill i{width:14px;height:14px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 3px #fff;flex:none}
.mini{display:inline-flex;flex-direction:column;gap:6px;background:#fff;border-radius:12px;padding:9px 11px;box-shadow:0 10px 22px rgba(60,35,10,.22);font:600 11px/1 var(--font);color:#16152b}
.mini .row{display:flex;justify-content:space-between;gap:16px;letter-spacing:.14em}
.mini .dots{display:grid;grid-template-columns:repeat(5,13px);gap:4px}
.mini .dots u{width:13px;height:13px;border-radius:50%;background:#e2ddd5;text-decoration:none}
.mini .dots u.on{background:var(--pop)}
.mini .ready{background:var(--pop);color:#fff;border-radius:7px;padding:5px 7px;text-align:center;font-size:10.5px;letter-spacing:0}
.fan{position:relative;width:150px;height:96px}
.fan b{position:absolute;left:55px;bottom:0;width:44px;height:64px;border-radius:5px;transform-origin:50% 100%;box-shadow:0 3px 8px rgba(40,25,10,.25);border:1.5px solid rgba(0,0,0,.08)}
.fan b::before{content:'';position:absolute;left:6px;right:6px;top:8px;height:5px;border-radius:3px;background:rgba(255,255,255,.75)}
.fan b::after{content:'';position:absolute;left:7px;right:7px;top:20px;height:30px;background:radial-gradient(circle,rgba(0,0,0,.3) 2.5px,transparent 3px) 0 0/10px 10px}
.day{font:500 12px/1 var(--mono);letter-spacing:.14em;color:#fff;background:#16152b;padding:7px 10px;border-radius:99px}
.nb{position:absolute;left:0;top:0;width:350px;opacity:0;z-index:6}
.nb .box{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.97);border-radius:22px;padding:13px 15px 14px;box-shadow:0 20px 44px rgba(50,30,10,.3);text-align:left}
.nb .app{width:40px;height:40px;border-radius:10px;background:var(--pop);flex:none;display:grid;place-items:center}
.nb .app i{width:18px;height:18px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 4px #fff}
.nb .tt{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;font-weight:700;color:#111}
.nb .tt span{font-size:12px;font-weight:500;color:#8a8a8f}
.nb p{margin:3px 0 0;font-size:14.5px;line-height:1.3;color:#2a2a2e;font-weight:500}
.end{bottom:205px;text-align:center;opacity:0;z-index:5}
.end span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#16152b;font-size:19px;font-weight:700;padding:13px 18px;border-radius:16px;box-shadow:0 14px 30px rgba(60,35,10,.25)}
.end span i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 5px var(--pop),inset 0 0 0 7px #fff;flex:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="ov vig"></div>
  <div class="ov band"></div>
  <div id="pins"></div>
  <div class="ov top"><div class="chip" id="chip"><i></i><span id="chipT"></span></div><div class="cap" id="cap"></div></div>
  <div class="ov end" id="end"><span><i></i><b>We’ll send you your card’s design ☕</b></span></div>
  <div class="ov grain" id="grain"></div>
</div>
<script type="module">
import * as THREE from '../../assets/vendor/three.module.min.js';
import { buildIsoCafe } from './cafe-iso.js';

const q = new URLSearchParams(location.search);
const TIMING = await (await fetch('cinque.json')).json();
const [B0, B1, B2, B3, B4, B5, B6, B7] = TIMING.beats, DURATION = TIMING.duration;
const T = {
  qr: ['Scan', 'for your loyalty card'],
  caps: [
    [0, '', 'Every café has these <mark>5 customers.</mark> Which one are you?'],
    [B1, 'Nº 1 · The forgetter', '<span class="n">1</span>Forgets the loyalty card. <mark>Every. Single. Time.</mark>'],
    [B2, 'Nº 2 · The saver', '<span class="n">2</span>Nine stamps, and <mark>never claims</mark> the free coffee.'],
    [B3, 'Nº 3 · The collector', '<span class="n">3</span>Carries <mark>12 paper cards</mark> from 12 different cafés.'],
    [B4, 'Nº 4 · The regular', '<span class="n">4</span>“The usual.” <mark>The barista already knows.</mark>'],
    [B5, 'Nº 5 · The sprinter', '<span class="n">5</span>One stamp away, and suddenly <mark class="y">here every day.</mark>'],
    [B6, '', 'Which one are you? <mark>Comment the number</mark> 👇'],
    [B7, 'Café owners', 'Comment <mark>TIMBRO</mark> for your card’s design ☕']
  ]
};
const $ = id => document.getElementById(id);
await Promise.all(['800 40px Archivo', '700 40px Archivo', '600 40px Archivo', '500 40px Archivo', '500 20px "Spline Sans Mono"'].map(f => document.fonts.load(f)));

const W = 540, H = 960, DPR = +(q.get('dpr') || 2);
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(DPR); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

const K = buildIsoCafe(THREE, renderer, T);
const { BLUE, clamp01, ease, easeOut, backOut, hash, lerp, V, canvas, scene, person, SPOTS, makeCup, TOP } = K;

// ---------------- the five, and the barista ----------------
const barista = person({ i: 6, apron: '#3b2a24', shirt: '#efe7da', hair: 1 });
const P = [
  person({ i: 2, hair: 2, capColor: '#c96f4a', shirt: '#4f6d7a' }),      // 1 forgets the card, at the till
  person({ i: 0, cup: true, hair: 3, shirt: '#e8dccb' }),                 // 2 never claims, on the banquette
  person({ i: 4, glasses: true, hair: 0, shirt: '#d9a441' }),             // 3 twelve paper cards
  person({ i: 1, hair: 1, shirt: '#7d5a8c', cup: true }),                 // 4 the usual, at the end of the counter
  person({ i: 7, phone: true, hair: 4, shirt: '#c96f4a' })                // 5 one stamp away, in every day
];
P[1].sit();
const SPOT3 = [.45, 0, .5, Math.PI - .5], RUN_TO = [2.75, 0, -.25];
const place3 = (p, sp, dy = 0) => { p.g.position.set(sp[0], sp[1] + dy, sp[2]); p.g.rotation.y = sp[3]; };
const cup4 = makeCup(1.6); scene.add(cup4);
// the line-up at the end: 1 to 5 from left to right, facing the camera; the way each one gets there
const LINEUP = [[-.6, -.5], [.2, -.5], [1.0, -.5], [1.8, -.5], [2.6, -.5]];
const FROM = [[SPOTS.till[0], SPOTS.till[2]], [SPOTS.benchL[0][0], SPOTS.benchL[0][2]], [SPOT3[0], SPOT3[2]], [SPOTS.counterEnd[0], SPOTS.counterEnd[2]], [RUN_TO[0], RUN_TO[2]]];
const VIA = [[], [[-3.0, 0], [-1.6, -.1]], [], [], []];
const walkAlong = (pts, u) => { const segs = []; let L = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); L += d; } let s = clamp01(u) * L; for (let i = 0; i < segs.length; i++) { if (s <= segs[i] || i === segs.length - 1) { const k = segs[i] ? clamp01(s / segs[i]) : 1; const a = pts[i], b = pts[i + 1]; return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), Math.atan2(b[0] - a[0], b[1] - a[1])]; } s -= segs[i]; } };

// ---------------- pins: numbers, bubbles, the little cards, hints ----------------
function pinEl(cls, html) { const e = document.createElement('div'); e.className = 'pin ' + cls; e.innerHTML = html; $('pins').appendChild(e); return e; }
const nums = P.map((_, i) => pinEl('', `<div class="num">${i + 1}</div>`));
const mini = (n, ready) => `<div class="mini"><div class="row"><span>BAR AURORA</span><span>${n}/10</span></div><div class="dots">${[...Array(10)].map((_, k) => `<u class="${k < n ? 'on' : ''}"></u>`).join('')}</div>${ready ? '<div class="ready">Reward ready</div>' : ''}</div>`;
const say1 = pinEl('bub', '<div class="pill">My card? …it’s at home 🙈</div>');
const hint1 = pinEl('hint', '<div class="pill"><i></i>On the phone, it can’t stay at home</div>');
const card2 = pinEl('', mini(9)), hint2 = pinEl('hint', '<div class="pill"><i></i>The card reminds them</div>');
const fan = pinEl('', `<div class="fan">${['#c96f4a', '#2f4a6b', '#d9a441', '#6b7f5a', '#8a3b33', '#4f6d7a', '#e8dccb', '#b7895f', '#7d5a8c', '#1f2c42', '#a8574a', '#efe9df'].map(c => `<b style="background:${c}"></b>`).join('')}</div>`);
const hint3 = pinEl('hint', '<div class="pill"><i></i>One phone, every card</div>');
const usual = pinEl('bub dark', '<div class="pill">“The usual, Elena?” ☕</div>');
const card5 = pinEl('', mini(9)), day5 = pinEl('', '<div class="day">MON</div>');
const nbHtml = text => `<div class="box"><div class="app"><i></i></div><div style="flex:1"><div class="tt"><b>Bar Aurora</b><span>now</span></div><p>${text}</p></div></div>`;
const nb2 = document.createElement('div'); nb2.className = 'nb'; nb2.innerHTML = nbHtml('Luca, your reward is ready: a free coffee. Show your card at the till.'); $('pins').appendChild(nb2);
const nb5 = document.createElement('div'); nb5.className = 'nb'; nb5.innerHTML = nbHtml('Just 1 stamp to go for a free coffee! See you at Bar Aurora.'); $('pins').appendChild(nb5);

const camera = new THREE.OrthographicCamera(-4.5, 4.5, 8, -8, .1, 100);
const head = new THREE.Vector3();
const headOf = (p, lift = 0) => { p.g.updateMatrixWorld(); head.set(0, 1.15 + lift, 0); return p.g.localToWorld(head.clone()); };
function pinAt(e, world, vis, dx = 0, dy = 0) {
  if (vis <= .001) { e.style.opacity = 0; return; }
  const v = world.clone().project(camera), hw = (e.offsetWidth || 160) / 2 + 10;
  const x = Math.min(W - hw, Math.max(hw, (v.x * .5 + .5) * W + dx)), y = (-v.y * .5 + .5) * H + dy;
  e.style.opacity = clamp01(vis * 2.5); e.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%) scale(${.6 + .4 * backOut(vis)})`;
}
const win = (t, a, b, fi = .3, fo = .3) => ease((t - a) / fi) * (1 - ease((t - b) / fo));

// ---------------- camera ----------------
const ISO = new THREE.Vector3(1, 1.05, 1).normalize();
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, a] = keys[i - 1], [t1, b] = keys[i]; const x = ease((t - t0) / (t1 - t0)); return a.map((v, k) => lerp(v, b[k], x)); }
  return keys[keys.length - 1][1];
}
const WIDE = [0, .55, .15, .9];
const CAM = [
  [0, [0, .55, .15, 1.0]], [B1 - .5, WIDE],
  [B1 + .5, [2.0, .85, -.75, 2.6]], [B2 - .4, [2.0, .85, -.75, 2.7]],
  [B2 + .5, [-2.6, .75, -.35, 2.5]], [B3 - .4, [-2.6, .75, -.35, 2.6]],
  [B3 + .5, [.45, .85, .45, 2.6]], [B4 - .4, [.45, .85, .45, 2.7]],
  [B4 + .5, [1.35, .9, -1.1, 2.6]], [B5 - .4, [1.35, .9, -1.1, 2.7]],
  [B5 + .5, [2.5, .75, 1.2, 1.7]], [B6 - .4, [2.5, .75, 1.2, 1.75]],
  [B6 + .7, [1.0, .75, -.5, 2.1]], [B7, [1.0, .75, -.5, 2.15]], [DURATION, [1.0, .7, -.45, 1.9]]
];

{ const c = canvas(256, 256, (g, w, h) => { const d = g.createImageData(w, h); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * .13) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }); $('grain').style.backgroundImage = `url(${c.toDataURL()})`; }

function renderAt(t) {
  const c = track(CAM, t), tgt = V(c[0] + Math.sin(t * .37) * .03, c[1], c[2] + Math.sin(t * .29) * .03);
  camera.position.copy(tgt).addScaledVector(ISO, 30); camera.lookAt(tgt); camera.zoom = c[3]; camera.updateProjectionMatrix(); camera.updateMatrixWorld();

  // captions (the first is there from the very first frame: the hook)
  const ci = T.caps.findLastIndex(([s]) => t >= s), cap = T.caps[ci];
  if (renderAt.ci !== ci) { $('cap').innerHTML = cap ? cap[2] : ''; if (cap) $('chipT').textContent = cap[1]; renderAt.ci = ci; }
  const st = cap ? cap[0] : 0, k = st === 0 ? 1 : backOut((t - st) / .35);
  $('cap').style.transform = `translateY(${(1 - k) * 14}px)`; $('cap').style.opacity = st === 0 ? 1 : clamp01((t - st) / .18);
  $('chip').style.display = cap && cap[1] ? '' : 'none';

  // people
  place3(barista, SPOTS.barista); barista.g.position.x = 1.9 + Math.sin(t * .5) * .3; barista.g.rotation.y = Math.sin(t * .6) * .2;
  barista.arms[0].rotation.x = -.8 + Math.sin(t * 2.6) * .2; barista.arms[1].rotation.x = -.9 + Math.sin(t * 2.1 + 1) * .25;
  // 1: at the till, patting the pockets
  place3(P[0], SPOTS.till); P[0].walk(t, false);
  { const pat = win(t, B1 + .3, B2 - .3); P[0].arms.forEach((a, i) => { a.rotation.x = pat * (-.3 + Math.sin(t * 14 + i * Math.PI) * .25); a.rotation.z = (i ? 1 : -1) * (.12 + pat * .25); }); P[0].head.rotation.y = pat * Math.sin(t * 5) * .4; }
  // 2: on the banquette, a full card, looking the other way
  place3(P[1], SPOTS.benchL[0]); P[1].head.rotation.y = Math.sin(t * .9) * .3 + win(t, B2 + 1.4, B3) * .9; P[1].arms[0].rotation.x = -.9 + Math.max(0, Math.sin(t * .8)) * -.5;
  // 3: standing with the paper cards
  place3(P[2], SPOT3); P[2].arms[1].rotation.x = -1.2 * win(t, B3 + .1, B4 - .2); P[2].arms[0].rotation.x = -1.0 * win(t, B3 + .1, B4 - .2);
  // 4: at the end of the counter; the coffee arrives before the order
  place3(P[3], SPOTS.counterEnd);
  const cs = ease((t - B4 - 1.2) / .5); cup4.visible = t > B4 + 1.1 && t < B6 + .5; cup4.position.set(lerp(1.5, 1.2, cs), TOP, lerp(-1.55, -1.3, cs));
  // 5: in from the door to the till, again and again, faster each day
  { const runs = [B5 + .1, B5 + 1.2, B5 + 2.1, B5 + 2.85], len = [.95, .8, .65, .6]; let pos = [RUN_TO[0], 0, RUN_TO[2]], moving = false, day = -1;
    runs.forEach((s0, i) => { if (t >= s0) { day = i; const u = (t - s0) / len[i]; const a = [SPOTS.door[0], SPOTS.door[2]], b = [RUN_TO[0], RUN_TO[2]]; if (u < 1) { pos = [lerp(a[0], b[0], easeOut(u)), Math.abs(Math.sin(u * 22)) * .05, lerp(a[1], b[1], easeOut(u))]; moving = true; } else pos = [b[0], 0, b[1]]; } });
    P[4].g.position.set(...pos); P[4].g.rotation.y = moving ? Math.atan2(RUN_TO[0] - SPOTS.door[0], RUN_TO[2] - SPOTS.door[2]) : Math.PI + .35; P[4].walk(t, moving, 16);
    day5._d !== day && (day5.querySelector('.day').textContent = ['MON', 'TUE', 'WED', 'THU'][Math.max(0, day)], day5._d = day); renderAt.day = day; }
  // the line-up: from where they are to a row, 1 to 5
  P.forEach((p, i) => { const u = (t - B6 + .35 - i * .08) / 1.0; if (u <= 0) return;
    if (u < 1) { const [x, z, a] = walkAlong([FROM[i], ...VIA[i], LINEUP[i]], ease(u)); p.g.position.set(x, Math.abs(Math.sin(t * 9)) * .03, z); p.g.rotation.y = a; p.walk(t, true); }
    else { p.walk(t, false); p.g.position.set(LINEUP[i][0], 0, LINEUP[i][1]); p.g.rotation.y = Math.PI / 4 + Math.sin(t * 1.3 + i) * .08; }
  });
  // everyone pops up at the start
  P.forEach((p, i) => { const s = backOut((t - .05 - i * .08) / .35); p.g.scale.setScalar(1.15 * Math.max(.001, s)); });
  K.drift(t);
  renderer.render(scene, camera);

  // numbers over the five: all of them at the start and at the end, the one being described in between
  const active = t >= B1 && t < B6 ? [B1, B2, B3, B4, B5].findLastIndex(s => t >= s) : -1;
  nums.forEach((e, i) => {
    const all = (t < B1 - .25 ? ease((t - .2 - i * .1) / .3) : 0) + (t >= B6 - .2 ? ease((t - B6 + .2 - i * .1) / .3) : 0);
    const vis = Math.max(all, i === active ? ease((t - [B1, B2, B3, B4, B5][i]) / .3) : 0);
    e.firstChild.className = 'num' + (i === active ? ' on' : '');
    pinAt(e, headOf(P[i], i === 1 ? -.2 : .05), Math.min(1, vis));
  });
  // 1
  pinAt(say1, headOf(P[0], .35), win(t, B1 + .5, B1 + 2.6)); pinAt(hint1, headOf(P[0], -.95), win(t, B1 + 2.4, B2 - .1), 0, 0);
  // 2
  const full = t >= B2 + 1.0; if (card2._f !== full) { card2.innerHTML = mini(full ? 10 : 9, full); card2._f = full; }
  pinAt(card2, headOf(P[1], .2), win(t, B2 + .3, B3 - .1));
  { const v = win(t, B2 + 1.6, B3 - .1); nb2.style.opacity = v; nb2.style.transform = `translate(95px, ${640 - (1 - backOut((t - B2 - 1.6) / .5)) * 30}px)`; }
  // 3
  { const v = win(t, B3 + .2, B4 - .1); pinAt(fan, headOf(P[2], .25), v); const spread = easeOut((t - B3 - .3) / .9); fan.querySelectorAll('b').forEach((b, i) => { b.style.transform = `rotate(${(i - 5.5) * 9 * spread + Math.sin(t * 6 + i) * 2}deg) translateY(${-Math.abs(i - 5.5) * 1.5 * spread}px)`; }); }
  pinAt(hint3, headOf(P[2], -.95), win(t, B3 + 1.6, B4 - .1));
