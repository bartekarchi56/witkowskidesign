<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three kinds of customers</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* "Your café has 3 kinds of customers. You only see one.": a reel in English, timed to an
   ElevenLabs voice-over (the beats are in tre-clienti.json). In the isometric café (cafe-iso.js) a scan
   picks out the regulars (blue), the ones almost at their reward (yellow, their cards above their
   heads) and the ones who slipped away (ghosts, "last visit 34 days ago"). The dashboard shows the
   three groups, the card tells Giulia she is 1 stamp away, the reminder brings the ghosts back in.
   The groups and messages are the product's own: "Customers who come back" (2 or more visits),
   "Almost at the reward" (1 or 2 stamps away), "Not back for 30 days"; the close-to-reward message
   and the reminder after 21 days. Vertical 540 x 960 (1080 x 1920 at 2x). make.js calls renderAt(t). */
html,body{margin:0;background:#111}
body{display:grid;place-items:center;min-height:100vh;font-family:var(--font)}
.stage{width:540px;height:960px;position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 50%,#f3efe9 0%,#ece7df 70%,#e2dbd0 100%)}
canvas{position:absolute;inset:0;width:540px;height:960px;display:block}
.ov{position:absolute;left:0;right:0;pointer-events:none}
.top{top:78px;text-align:center;padding:0 26px}
.chip{display:inline-flex;align-items:center;gap:9px;font:500 12.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#16152b;padding:8px 13px 7px;border-radius:99px;margin-bottom:14px;box-shadow:0 6px 16px rgba(40,25,10,.18)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--pop));box-shadow:0 0 0 2px #fff}
.cap{font-size:35px;line-height:1.12;font-weight:800;font-stretch:112%;letter-spacing:-.015em;color:#16152b;text-wrap:balance}
.cap mark{background:var(--pop);color:#fff;padding:0 9px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap mark.y{background:#FFC24B;color:#16152b}
.cap mark.g{background:#8d93a8;color:#fff}
.band{top:0;height:330px;background:linear-gradient(#f1ede7 0%,rgba(241,237,231,.92) 45%,rgba(241,237,231,0) 100%)}
.tag{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;will-change:transform}
.tag .pill{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#16152b;border-radius:12px;padding:7px 11px 7px 9px;box-shadow:0 10px 22px rgba(60,35,10,.22);position:relative;font-size:14px}
.tag .pill::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tag .pill > i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tag b{font-weight:800}
.tag span{font:500 11px/1 var(--mono);color:#6d5c49;letter-spacing:.02em}
.tag .dots{display:inline-flex;gap:2.5px}
.tag .dots u{width:7px;height:7px;border-radius:50%;background:#d9d4cc;text-decoration:none}
.tag .dots u.on{background:var(--pop)}
.tag.ghost .pill{background:rgba(255,255,255,.82)}
.tag.ghost b{color:#6b7088}
.tag.say .pill{background:#16152b;color:#fff;font-weight:700}
.nb{position:absolute;left:0;top:0;width:360px;opacity:0;will-change:transform}
.nb .box{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.96);border-radius:22px;padding:14px 16px 15px;box-shadow:0 20px 44px rgba(50,30,10,.3);text-align:left}
.nb .app{width:42px;height:42px;border-radius:11px;background:var(--pop);flex:none;display:grid;place-items:center}
.nb .app i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 4px #fff}
.nb .tt{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:#111}
.nb .tt span{font-size:12.5px;font-weight:500;color:#8a8a8f}
.nb p{margin:3px 0 0;font-size:15px;line-height:1.32;color:#2a2a2e;font-weight:500}
.end{bottom:205px;text-align:center;opacity:0}
.end span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#16152b;font-size:19px;font-weight:700;padding:13px 18px;border-radius:16px;box-shadow:0 14px 30px rgba(60,35,10,.25)}
.end span i{width:20px;height:20px;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 5px var(--pop),inset 0 0 0 7px #fff;flex:none}
.vig{inset:0;background:radial-gradient(140% 90% at 50% 45%,transparent 60%,rgba(80,60,40,.12) 100%)}
.grain{inset:0;opacity:.09;mix-blend-mode:multiply}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="ov vig"></div>
  <div class="ov band"></div>
  <div id="pins"></div>
  <canvas id="p"></canvas>
  <div class="ov top"><div class="chip" id="chip"><i id="chipDot"></i><span id="chipT"></span></div><div class="cap" id="cap"></div></div>
  <div class="ov end" id="end"><span><i></i><b>We’ll send you your card’s design ☕</b></span></div>
  <div class="ov grain" id="grain"></div>
</div>
<script type="module">
import * as THREE from '../../assets/vendor/three.module.min.js';
import { buildIsoCafe } from './cafe-iso.js';

const q = new URLSearchParams(location.search);
const TIMING = await (await fetch('tre-clienti.json')).json();
const [B0, B1, B2, B3, B4, B5, B6, B7, B8] = TIMING.beats, DURATION = TIMING.duration;
const T = {
  menu: ['Espresso', '1.30', 'Cappuccino', '1.80', 'Croissant', '1.50', 'Matcha latte', '3.50', 'Orange juice', '3.00'],
  qr: ['Scan', 'for your loyalty card'],
  bar: 'Bar Aurora',
  // [start, chip, chip colour, caption]
  caps: [
    [B0, '', '', 'Your café has <mark>3 kinds</mark> of customers.'],
    [B1, '', '', 'You only <mark>see one.</mark>'],
    [B2, 'Regulars · 2+ visits', '#2B32FF', 'The regulars. They come back, and <mark>you know their order.</mark>'],
    [B3, 'Almost at the reward', '#FFC24B', 'Then the almost-there ones: <mark class="y">1 or 2 stamps</mark> from a free coffee.'],
    [B4, 'Not back for 30 days', '#8d93a8', 'And the ones who <mark class="g">slipped away.</mark> Nobody noticed.'],
    [B5, 'Your dashboard', '#2B32FF', 'Timbro shows you <mark>all three.</mark>'],
    [B6, 'Automatic message', '#FFC24B', 'It tells them when they’re <mark class="y">1 stamp away.</mark>'],
    [B7, 'Automatic reminder', '#8d93a8', 'After 3 weeks, it reminds the ones who <mark class="g">drifted off.</mark>'],
    [B8, '', '', 'Comment <mark>TIMBRO</mark> 👇']
  ],
  close: 'Just 1 stamp to go for a free coffee! See you at Bar Aurora.',
  remind: 'Hi Luca! Just 2 stamps to go for a free coffee. Come and see us at Bar Aurora.'
};
const $ = id => document.getElementById(id);
await Promise.all(['800 40px Archivo', '700 40px Archivo', '600 40px Archivo', '500 40px Archivo', 'italic 600 40px "EB Garamond"', '500 20px "Spline Sans Mono"'].map(f => document.fonts.load(f)));

const W = 540, H = 960, DPR = +(q.get('dpr') || 2);
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(DPR); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

const K = buildIsoCafe(THREE, renderer, T);
const { BLUE, INK, clamp01, ease, easeOut, backOut, hash, lerp, V, tex, canvas, rr, scene, person, SPOTS } = K;
const YELLOW = '#FFC24B', GREY = '#8d93a8';

// ---------------- the people ----------------
const barista = person({ i: 6, apron: '#3b2a24', shirt: '#efe7da', hair: 1 });
// regulars
const marco = person({ i: 2, phone: true, hair: 2, capColor: '#2f4a6b', shirt: '#4f6d7a' });
const tom = person({ i: 4, glasses: true, hair: 0, cup: true, shirt: '#b7895f' });
const sara = person({ i: 0, cup: true, hair: 3, shirt: '#e8dccb' });
// almost at the reward
const giulia = person({ i: 7, phone: true, hair: 3, shirt: '#c96f4a' });
const ahmed = person({ i: 3, hair: 4, cup: true, shirt: '#6b7f5a' });
// slipped away: ghosts where they used to sit, and the same people walking back in at the end
const GHOSTS = [
  { name: 'Luca', days: 34, o: { i: 5, hair: 0, shirt: '#8a3b33' }, at: SPOTS.benchL[2], near: [-1.95, 1.08] },
  { name: 'Elena', days: 41, o: { i: 1, hair: 1, shirt: '#7d5a8c' }, at: SPOTS.chairL[1], near: [-1.3, .12] },
  { name: 'Paolo', days: 52, o: { i: 8, hair: 2, capColor: '#d9a441', shirt: '#2f4a6b' }, at: SPOTS.benchF[1], near: [.2, 1.3] }
];
GHOSTS.forEach(G => {
  G.sit = true; G.ghost = person(G.o); G.back = person(G.o); G.ghost.sit();
  G.ghost.g.traverse(m => { if (m.isMesh) { m.material = m.material.clone(); m.material.transparent = true; m.material.depthWrite = false; m.material.color.lerp(new THREE.Color('#8f9cc8'), .75); if (m.material.isMeshStandardMaterial) { m.material.emissive = new THREE.Color('#9aa3c4'); m.material.emissiveIntensity = .25; } m.castShadow = false; } });
});
const seated = [[sara, SPOTS.benchL[0]], [ahmed, SPOTS.stool[0]]];
seated.forEach(([p]) => p.sit());
const place3 = (p, sp, dy = 0) => { p.g.position.set(sp[0], sp[1] + dy, sp[2]); p.g.rotation.y = sp[3]; };

// a coloured ring under each one in a group
function ring(color) { const r = new THREE.Mesh(new THREE.RingGeometry(.22, .29, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false })); r.rotation.x = -Math.PI / 2; scene.add(r); return r; }
const RINGS = [
  ...[marco, sara, tom].map(p => ({ p, r: ring(BLUE), from: B2 + .35 })),
  ...[giulia, ahmed].map(p => ({ p, r: ring(YELLOW), from: B3 + .35 })),
  ...GHOSTS.map(G => ({ p: G.ghost, r: ring(GREY), from: B4 + .35, G }))
];
// the ones who came back: a blue ring once they're in
GHOSTS.forEach((G, i) => { G.ring = ring(BLUE); G.home = B7 + 1.0 + i * .35 + 2.4; });
// the scan: a wall of light sweeping across the café in the group's colour, a glow on the floor behind it
const scanTex = (horizontal) => tex(canvas(256, 256, (g, w, h) => { const gr = horizontal ? g.createLinearGradient(0, 0, w, 0) : g.createLinearGradient(0, h, 0, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(horizontal ? .85 : .0, horizontal ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,1)'); gr.addColorStop(1, horizontal ? 'rgba(255,255,255,1)' : 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }));
const glowMat = map => new THREE.MeshBasicMaterial({ map, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false });
const scan = new THREE.Group(); scene.add(scan);
const scanWall = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 3.0), glowMat(scanTex(false))); scanWall.rotation.y = Math.PI / 2; scanWall.position.y = 1.5; scan.add(scanWall);
const scanFloor = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 5.6), glowMat(scanTex(true))); scanFloor.rotation.x = -Math.PI / 2; scanFloor.position.set(-.9, .015, 0); scan.add(scanFloor);
const SCANS = [[B2, BLUE], [B3, YELLOW], [B4, '#aab3d6']];

// ---------------- labels over heads, a speech bubble, notifications ----------------
function pinEl(cls, html) { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; $('pins').appendChild(e); return e; }
const dots = n => `<span class="dots">${[...Array(10)].map((_, i) => `<u class="${i < n ? 'on' : ''}"></u>`).join('')}</span>`;
const TAGS = [
  { p: marco, el: pinEl('tag', `<div class="pill" style="--c:${BLUE}"><i></i><b>Marco</b><span>14 visits</span></div>`), from: B2 + .45, to: B3 },
  { p: sara, el: pinEl('tag', `<div class="pill" style="--c:${BLUE}"><i></i><b>Sara</b><span>9 visits</span></div>`), from: B2 + .6, to: B3 },
  { p: tom, el: pinEl('tag', `<div class="pill" style="--c:${BLUE}"><i></i><b>Tom</b><span>6 visits</span></div>`), from: B2 + .75, to: B3 },
  { p: giulia, el: pinEl('tag', `<div class="pill" style="--c:${YELLOW}"><i></i><b>Giulia</b>${dots(9)}<span>9/10</span></div>`), from: B3 + .45, to: B4 },
  { p: ahmed, el: pinEl('tag', `<div class="pill" style="--c:${YELLOW}"><i></i><b>Ahmed</b>${dots(8)}<span>8/10</span></div>`), from: B3 + .6, to: B4 },
  ...GHOSTS.map((G, k) => ({ p: G.ghost, G, el: pinEl('tag ghost', `<div class="pill" style="--c:${GREY}"><i></i><b>${G.name}</b><span>${G.days} days ago</span></div>`), from: B4 + .45 + k * .15, to: B5, again: [B7 + .95, B8 - .2] }))
];
const usual = { p: barista, el: pinEl('tag say', `<div class="pill">“The usual, Marco?” ☕</div>`), from: B2 + 1.6, to: B3 - .2, lift: .5 };
const nbHtml = (title, text) => `<div class="box"><div class="app"><i></i></div><div style="flex:1"><div class="tt"><b>${title}</b><span>now</span></div><p>${text}</p></div></div>`;
const nbClose = pinEl('nb', nbHtml(T.bar, T.close)), nbRemind = pinEl('nb', nbHtml(T.bar, T.remind));

// an isometric camera (orthographic, looking down the diagonal); shots pan and zoom
const ISO = new THREE.Vector3(1, 1.05, 1).normalize();
const camera = new THREE.OrthographicCamera(-4.5, 4.5, 8, -8, .1, 100);
const head = new THREE.Vector3();
function project(p) { const v = p.clone().project(camera); return [(v.x * .5 + .5) * W, (-v.y * .5 + .5) * H]; }
function place(e, p, vis, lift = 0) {
  if (vis <= .001) { e.style.opacity = 0; return; }
  p.g.updateMatrixWorld(); head.set(0, 1.12 + lift, 0); p.g.localToWorld(head);
  const [x, y] = project(head);
  e.style.opacity = clamp01(vis * 2.5);
  const hw = (e.offsetWidth || 160) / 2 + 10;
  e.style.transform = `translate(${Math.min(W - hw, Math.max(hw, x))}px, ${y}px) translate(-50%, -100%) scale(${.65 + .35 * backOut(vis)})`;
}

// ---------------- the phone with the dashboard ----------------
const pr = new THREE.WebGLRenderer({ canvas: $('p'), antialias: true, alpha: true, preserveDrawingBuffer: true });
pr.setPixelRatio(DPR); pr.setSize(W, H, false); pr.setClearColor(0x000000, 0); pr.outputColorSpace = THREE.SRGBColorSpace;
const phoneScene = new THREE.Scene();
phoneScene.add(new THREE.HemisphereLight('#ffffff', '#6b5a4a', 1.5));
{ const k = new THREE.DirectionalLight('#ffffff', 1.8); k.position.set(2, 3, 5); phoneScene.add(k); }
const phone = new THREE.Group();
{ const b = new THREE.Mesh(new THREE.ExtrudeGeometry(K.roundedShape(1, 2.05, .14), { depth: .08, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 3 }), new THREE.MeshStandardMaterial({ color: '#1d1d1f', roughness: .35, metalness: .4 })); b.position.z = -.04; phone.add(b); }
const scr = document.createElement('canvas'); scr.width = 540; scr.height = Math.round(540 * 1.98 / .93);
const scrTex = tex(scr), sg = scr.getContext('2d');
{ const s = new THREE.Mesh(new THREE.ShapeGeometry(K.roundedShape(.93, 1.98, .11)), new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false })); const uv = s.geometry.attributes.uv, pos = s.geometry.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / .93 + .5, pos.getY(i) / 1.98 + .5); s.position.z = .065; phone.add(s); }
phoneScene.add(phone);
const phoneCam = new THREE.PerspectiveCamera(30, W / H, .1, 50); phoneCam.position.set(0, 0, 6.2); phoneCam.lookAt(0, 0, 0);
// The Results page as the owner sees it, with the people of this café
function drawDash(u) {
  const g = sg, w = scr.width, h = scr.height, x = 26, cw = w - 52;
  g.fillStyle = '#F6F4F0'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#111'; g.font = '600 26px Archivo'; g.textAlign = 'left'; g.fillText('9:41', 44, 52); g.fillStyle = '#000'; rr(g, w / 2 - 80, 22, 160, 44, 22); g.fill();
  g.fillStyle = '#111'; g.font = '800 54px Archivo'; g.fillText('Results', x + 4, 152);
  g.fillStyle = '#7a6a58'; g.font = '500 21px "Spline Sans Mono"'; g.fillText('BAR AURORA · EXAMPLE · 30 DAYS', x + 4, 190);
  const card = (k, y, ht, draw) => { const a = easeOut((u - k * .35) / .5); if (a <= 0) return; g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 40); g.fillStyle = '#fff'; g.shadowColor = 'rgba(60,40,20,.12)'; g.shadowBlur = 24; g.shadowOffsetY = 6; rr(g, x, y, cw, ht, 24); g.fill(); g.shadowColor = 'transparent'; draw(y); g.restore(); };
  const head2 = (y, col, label) => { g.fillStyle = col; g.beginPath(); g.arc(x + 32, y + 42, 11, 0, 7); g.fill(); g.fillStyle = '#5d4c39'; g.font = '500 22px "Spline Sans Mono"'; g.textAlign = 'left'; g.fillText(label, x + 54, y + 50); };
  card(0, 222, 232, y => {
    head2(y, BLUE, 'COME BACK · 2+ VISITS');
    g.fillStyle = '#111'; g.font = '800 104px Archivo'; g.fillText('64%', x + 24, y + 168);
    g.fillStyle = '#ECEDFF'; rr(g, x + 26, y + 194, cw - 52, 16, 8); g.fill(); g.fillStyle = BLUE; rr(g, x + 26, y + 194, (cw - 52) * .64 * clamp01((u - .1) / .6), 16, 8); g.fill();
  });
  card(1, 474, 262, y => {
    head2(y, YELLOW, 'ALMOST AT THE REWARD · 2');
    [['Giulia', 9], ['Ahmed', 8]].forEach(([n, st], i) => { const yy = y + 124 + i * 80; g.fillStyle = '#111'; g.font = '700 34px Archivo'; g.fillText(n, x + 26, yy); for (let k = 0; k < 10; k++) { g.fillStyle = k < st ? BLUE : '#DEDAD3'; g.beginPath(); g.arc(x + 186 + k * 26, yy - 11, 10, 0, 7); g.fill(); } g.fillStyle = '#5d4c39'; g.font = '500 22px "Spline Sans Mono"'; g.textAlign = 'right'; g.fillText(`${st}/10`, x + cw - 20, yy - 3); g.textAlign = 'left'; });
  });
  card(2, 756, 318, y => {
    head2(y, GREY, 'NOT BACK FOR 30 DAYS · 3');
    GHOSTS.forEach((G, i) => { const yy = y + 124 + i * 70; g.fillStyle = '#111'; g.font = '700 34px Archivo'; g.fillText(G.name, x + 26, yy); g.fillStyle = '#5d4c39'; g.font = '500 22px "Spline Sans Mono"'; g.textAlign = 'right'; g.fillText(`${G.days} days ago`, x + cw - 20, yy - 3); g.textAlign = 'left'; });
  });
  scrTex.needsUpdate = true;
}

// ---------------- camera ----------------
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, a] = keys[i - 1], [t1, b] = keys[i]; const x = ease((t - t0) / (t1 - t0)); return a.map((v, k) => lerp(v, b[k], x)); }
  return keys[keys.length - 1][1];
}
// [time, [target x, y, z, zoom]]
const CAM = [
  [0, [0, .5, .1, .8]], [B1 - .1, [0, .5, .1, .86]],
  [B1 + 1.0, [.3, .7, 0, 1.25]], [B2 + .2, [.3, .7, 0, 1.28]],
  [B2 + 1.3, [0, .75, -.2, 1.6]], [B3 - .1, [-.05, .75, -.2, 1.65]],
  [B3 + 1.1, [1.6, .8, .15, 2.0]], [B4 - .1, [1.6, .8, .15, 2.05]],
  [B4 + 1.1, [-2.2, .6, 1.3, 1.9]], [B5, [-2.2, .6, 1.3, 1.95]],
  [B6 - .2, [-2.2, .6, 1.3, 1.95]], [B6 + .9, [2.75, .95, -.25, 2.9]], [B7 - .2, [2.75, .95, -.25, 3.0]],
  [B7 + 1.0, [-.2, .7, .7, 1.1]], [B8 - .1, [-.2, .7, .7, 1.12]],
  [B8 + 1.4, [0, .5, .1, .86]], [DURATION, [0, .5, .1, .82]]
];

// grain, still
{ const c = canvas(256, 256, (g, w, h) => { const d = g.createImageData(w, h); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * .13) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }); $('grain').style.backgroundImage = `url(${c.toDataURL()})`; }

const walkAlong = (pts, u) => { const segs = []; let L = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); L += d; } let s = clamp01(u) * L; for (let i = 0; i < segs.length; i++) { if (s <= segs[i] || i === segs.length - 1) { const k = segs[i] ? clamp01(s / segs[i]) : 1; const a = pts[i], b = pts[i + 1]; return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), Math.atan2(b[0] - a[0], b[1] - a[1])]; } s -= segs[i]; } };

function renderAt(t) {
  const c = track(CAM, t), tgt = V(c[0] + Math.sin(t * .37) * .04, c[1] + Math.sin(t * .29) * .03, c[2]);
  camera.position.copy(tgt).addScaledVector(ISO, 30); camera.lookAt(tgt); camera.zoom = c[3]; camera.updateProjectionMatrix(); camera.updateMatrixWorld();

  // captions
  const ci = T.caps.findLastIndex(([s]) => t >= s), cap = T.caps[ci];
  if (renderAt.ci !== ci) { $('cap').innerHTML = cap ? cap[3] : ''; if (cap) { $('chipT').textContent = cap[1]; $('chip').style.setProperty('--c', cap[2] || BLUE); } renderAt.ci = ci; }
  const st = cap ? cap[0] : 0, k = backOut((t - st) / .35);
  $('cap').style.transform = `translateY(${(1 - k) * 14}px)`; $('cap').style.opacity = cap ? clamp01((t - st) / .18) : 0;
  $('chip').style.display = cap && cap[1] ? '' : 'none'; $('chip').style.transform = `scale(${.7 + .3 * backOut((t - st) / .4)})`;

  // the café's life
  place3(barista, SPOTS.barista); barista.g.position.x += Math.sin(t * .45) * .3; barista.g.rotation.y = Math.sin(t * .7) * .35;
  barista.arms[0].rotation.x = -.9 + Math.sin(t * 3.1) * .25; barista.arms[1].rotation.x = -1.1 + Math.sin(t * 2.3 + 1) * .3;
  place3(marco, SPOTS.till, Math.abs(Math.sin(t * 1.6)) * .01);
  place3(tom, SPOTS.counterEnd); tom.g.rotation.y += Math.sin(t * .6) * .1;
  place3(giulia, SPOTS.queue);
  seated.forEach(([p, sp], i) => { place3(p, sp); p.head.rotation.y = Math.sin(t * .9 + i * 2) * .3; p.arms[0].rotation.x = -.9 + Math.max(0, Math.sin(t * .8 + i * 3)) * -.5; });
  // Giulia's card tells her she's 1 stamp away: she lifts her phone and hops
  const gj = t - B6 - .7;
  if (gj > 0 && gj < 1.2) giulia.g.position.y = Math.abs(Math.sin(gj * Math.PI * 2.5)) * .12 * (1 - gj / 1.2);
  K.drift(t);

  // ghosts: fade in at B4; the real people walk back in after the reminder
  GHOSTS.forEach((G, i) => {
    const [x, y, z, ry] = G.at, back0 = B7 + 1.0 + i * .35, u = (t - back0) / 2.4;
    const gv = ease((t - B4 - .3 - i * .15) / .6) * (1 - ease((u - .9) / .12));
    G.ghost.g.visible = gv > .01; G.ghost.g.position.set(x, y, z); G.ghost.g.rotation.y = ry;
    G.ghost.g.traverse(m => { if (m.isMesh) m.material.opacity = .62 * gv * (.85 + .15 * Math.sin(t * 3 + i)); });
    G.back.g.visible = u > 0;
    if (u > 0 && u < 1) {
      // in through the door to the table, then into the seat
      const [px, pz, a] = walkAlong([[SPOTS.door[0], SPOTS.door[2]], [2.65, 2.25], G.near], ease(u));
      G.back.g.position.set(px, Math.abs(Math.sin(t * 9)) * .03, pz); G.back.g.rotation.y = a; G.back.g.scale.setScalar(1.15); G.back.walk(t, true);
    } else if (u >= 1) {
      const pop = backOut((u - 1) * 2.4 / .35);
      G.back.walk(t, false); G.back.sit(); G.back.g.position.set(x, y, z); G.back.g.rotation.y = ry; G.back.g.scale.setScalar(1.15 * (.8 + .2 * pop));
    }
  });

  // rings and the scan
  RINGS.forEach(({ p, r, from, G }) => {
    const gone = G ? 1 - ease((t - B7 - 3.6) / .4) : 1;
    const vis = ease((t - from) / .4) * (1 - ease((t - B5 + .2) / .3)) + (t > B8 - .3 ? ease((t - B8 + .3) / .4) : 0) * (G ? 0 : 1);
    const o = clamp01(vis) * gone; r.visible = o > .01;
    if (r.visible) { r.position.set(p.g.position.x, .012, p.g.position.z); r.material.opacity = o * .85; r.scale.setScalar(1 + Math.sin(t * 4) * .06); }
  });
  GHOSTS.forEach(G => { const o = ease((t - G.home) / .4); G.ring.visible = o > .01; if (G.ring.visible) { G.ring.position.set(G.back.g.position.x, .012, G.back.g.position.z); G.ring.material.opacity = o * .85; G.ring.scale.setScalar(1 + Math.sin(t * 4) * .06); } });
  { let on = false; SCANS.forEach(([s0, col]) => { const u = (t - s0) / 1.1; if (u > 0 && u < 1) { on = true; [scanWall, scanFloor].forEach(m => { m.material.color.set(col); m.material.opacity = Math.sin(u * Math.PI) * .75; }); scan.position.set(lerp(-3.6, 3.8, ease(u)), 0, 0); } }); scan.visible = on; }

  // drop-in at the start (after every person's position for this frame is set)
  K.dropIn(t, [barista, marco, giulia, sara, tom, ahmed]);
  renderer.render(scene, camera);

  // labels over heads and the bubbles
  TAGS.forEach(({ p, el, from, to, again, G }) => {
    let vis = ease((t - from) / .35) * (1 - ease((t - to + .15) / .25));
    if (again) {
      const [a, b] = again, returned = t > B7 + 1.0 + GHOSTS.indexOf(G) * .35 + 2.3;
      vis = Math.max(vis, ease((t - a) / .35) * (1 - ease((t - b) / .3)));
      if (returned !== el._ret) { el._ret = returned; el.className = returned ? 'tag' : 'tag ghost'; el.innerHTML = returned ? `<div class="pill" style="--c:${BLUE}"><i></i><b>${G.name}</b><span>back today ☕</span></div>` : `<div class="pill" style="--c:${GREY}"><i></i><b>${G.name}</b><span>${G.days} days ago</span></div>`; }
      place(el, returned ? G.back : p, vis, G.name === 'Elena' ? .2 : -.25);
    } else place(el, p, vis, p === sara || p === ahmed ? -.25 : p === tom ? .35 : 0);
  });
  place(usual.el, usual.p, ease((t - usual.from) / .3) * (1 - ease((t - usual.to) / .3)), usual.lift);
  // Giulia's notification, then Luca's reminder
  { const v = ease((t - B6 - .35) / .35) * (1 - ease((t - B7 + .1) / .3)); nbClose.style.opacity = v; if (v > .001) { giulia.g.updateMatrixWorld(); head.set(0, 1.25, 0); giulia.g.localToWorld(head); const [x, y] = project(head); nbClose.style.transform = `translate(${Math.min(W - 372, Math.max(12, x - 180))}px, ${y - 150 - (1 - backOut((t - B6 - .35) / .5)) * 30}px)`; } }
  { const v = ease((t - B7 + .05) / .35) * (1 - ease((t - B7 - 2.6) / .3)); nbRemind.style.opacity = v; nbRemind.style.transform = `translate(90px, ${618 - (1 - backOut((t - B7 + .05) / .5)) * 30}px)`; }

  // the dashboard on the phone, the café blurred behind
  const pv = ease((t - B5 - .05) / .45) * (1 - ease((t - B6 + .25) / .35));
  $('c').style.filter = pv > .02 ? `blur(${(pv * 7).toFixed(2)}px)` : 'none';
  $('pins').style.filter = pv > .02 ? `blur(${(pv * 7).toFixed(2)}px)` : 'none';
  pr.clear();
  if (pv > .001) {
    drawDash((t - B5 - .2) / 1.3);
    const u = t - B5;
    phone.position.set(0, -.36 - (1 - backOut(u / .7)) * 2.4 - (1 - pv) * (t > B6 - .5 ? 2.4 : 0), 0); phone.rotation.set(-.06 + Math.sin(u * .9) * .03, Math.sin(u * .7) * .12, 0); phone.scale.setScalar(1.12);
    pr.render(phoneScene, phoneCam);
  }
  $('end').style.opacity = ease((t - B8 - .9) / .4);
  $('end').style.transform = `translateY(${(1 - backOut((t - B8 - .9) / .5)) * 20}px)`;
}
window.renderAt = renderAt;
window.DURATION = DURATION;
renderAt(0);
window.READY = true;
if (!q.has('capture')) {
  const t0 = performance.now() - (+(q.get('t') || 0)) * 1000;
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % (DURATION + .5)); requestAnimationFrame(loop); };
  loop();
}
</script>
