<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Timbro · Black Friday 2026</title>
<link rel="stylesheet" href="../../../assets/css/base.css">
<style>
/* Black Friday 2026 for Timbro's Instagram: ?lang=pl|en|it&f=post|story. make.js renders PNG and the reel. */
:root{--blue:#2B32FF;--yellow:#FFD23F}
html,body{margin:0;background:#0B0B0C}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 55%,#1B1E4A 0%,#0B0B0C 60%);color:#fff;font-family:var(--font)}
.story .post{height:1920px}
.tick{position:absolute;left:0;right:0;height:64px;background:var(--yellow);color:#0B0B0C;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tick.t{top:0}.tick.b{bottom:0}
.tick .run{display:inline-flex}
.tick span{font:800 26px/1 var(--font);letter-spacing:.14em;padding:0 26px}
.tick i{font-style:normal}
.logo{position:absolute;left:70px;top:110px;display:flex;align-items:center;gap:14px;font:800 40px/1 var(--font);letter-spacing:-.02em}
.logo b{width:40px;height:40px;border-radius:50%;background:var(--blue);box-shadow:inset 0 0 0 6px #0B0B0C,0 0 0 3px var(--blue)}
.kick{position:absolute;left:70px;top:200px;font:800 92px/1 var(--font);letter-spacing:-.02em}
.big{position:absolute;left:62px;top:310px;font:800 232px/0.9 var(--font);letter-spacing:-.06em;color:var(--blue);text-shadow:0 0 80px rgba(43,50,255,.45)}
.life{position:absolute;left:72px;top:570px;font:700 56px/1 var(--font);color:var(--yellow)}
.lede{position:absolute;left:72px;top:660px;width:520px;margin:0;font:500 30px/1.4 var(--font);color:#D9DAE6}
.prices{position:absolute;left:72px;top:880px;width:520px;display:grid;gap:14px}
.pr{display:flex;align-items:baseline;justify-content:space-between;padding:16px 24px;border-radius:20px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12)}
.pr b{font:800 30px/1 var(--font)}
.pr s{font:600 24px/1 var(--font);color:#8A8CA3;margin-right:14px}
.pr em{font:800 38px/1 var(--font);font-style:normal;color:#fff}
.pr small{font:500 20px/1 var(--font);color:#8A8CA3;margin-left:6px}
.cta{position:absolute;left:72px;top:1140px;display:flex;align-items:center;gap:18px}
.cta .btn2{background:var(--blue);color:#fff;border-radius:999px;padding:20px 34px;font:800 28px/1 var(--font)}
.cta span{font:600 24px/1.3 var(--mono);color:#D9DAE6}
.fine{position:absolute;left:72px;right:72px;top:1232px;margin:0;font:500 16px/1.4 var(--font);color:#6F7187}
.phone{position:absolute;right:40px;top:360px;width:340px;height:700px;border-radius:66px;padding:12px;box-sizing:border-box;background:#2A2A2C;transform:rotate(6deg);
  box-shadow:0 0 0 1.5px #8E8E93 inset,0 0 0 3px #1C1C1E inset,0 50px 90px -30px rgba(43,50,255,.55)}
.bezel{width:100%;height:100%;border-radius:55px;background:#050505;padding:7px;box-sizing:border-box}
.scr{position:relative;width:100%;height:100%;border-radius:48px;background:#F2F2F7;overflow:hidden}
.isl{position:absolute;top:13px;left:50%;width:110px;height:32px;margin-left:-55px;border-radius:18px;background:#000;z-index:3}
.wal{padding:70px 14px 0}
.wal .pass{max-width:none;width:100%;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.tag{position:absolute;right:30px;top:280px;width:170px;height:170px;border-radius:50%;background:var(--yellow);color:#0B0B0C;display:grid;place-items:center;text-align:center;font:800 40px/1 var(--font);transform:rotate(-12deg);z-index:2}
.tag small{display:block;font:700 18px/1.1 var(--font);margin-top:4px}
/* story: the same blocks, moved down to fill 1920 px */
.story .logo{top:250px}.story .kick{top:350px}.story .big{top:460px}.story .life{top:750px}.story .lede{top:850px}
.story .prices{top:1100px}.story .cta{top:1420px}.story .fine{top:1515px}.story .phone{top:640px}.story .tag{top:550px}
</style>
</head>
<body>
<div class="post" id="post"></div>
<script src="../../../assets/vendor/qrcode.js"></script>
<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/i18n.js"></script>
<script src="../../../assets/js/stamps.js"></script>
<script src="../../../assets/js/ui.js"></script>
<script>
window.WAIT_READY = true;
(async () => {
  const q = new URLSearchParams(location.search);
  const lang = ['pl', 'en', 'it'].includes(q.get('lang')) ? q.get('lang') : 'pl';
  if (q.get('f') === 'story') document.body.classList.add('story');
  document.documentElement.lang = lang; I18N.lang = lang;
  const T = {
    pl: { life: 'na zawsze', lede: 'Karta lojalnościowa w telefonie Twoich klientów. Zapisz się do 30 listopada i płać połowę, tak długo, jak jesteś z nami.',
      per: '/ mies.', cta: '30 dni za darmo', fine: 'Ceny netto (bez VAT). Najniższa cena z 30 dni przed obniżką: Start 19 €, Plus 39 €, Pro 79 € miesięcznie.',
      tag: 'do 30.11', card: ['Twoja kawiarnia', 'Karta kawowa', 'kawa gratis'], money: v => v.toFixed(2).replace('.', ',').replace(',00', '') + ' €' },
    en: { life: 'for life', lede: 'A loyalty card in your customers\' phones. Subscribe by 30 November and pay half, for as long as you stay.',
      per: '/ month', cta: '30 days free', fine: 'Prices exclude VAT. Lowest price in the 30 days before the discount: Start €19, Plus €39, Pro €79 a month.',
      tag: 'until 30 Nov', card: ['Your café', 'Coffee card', 'a free coffee'], money: v => '€' + (v % 1 ? v.toFixed(2) : v) },
    it: { life: 'per sempre', lede: 'La carta fedeltà nel telefono dei tuoi clienti. Abbonati entro il 30 novembre e paghi la metà, finché resti con noi.',
      per: '/ mese', cta: '30 giorni gratis', fine: 'Prezzi IVA esclusa. Prezzo più basso degli ultimi 30 giorni prima dello sconto: Start 19 €, Plus 39 €, Pro 79 € al mese.',
      tag: 'fino al 30.11', card: ['Il tuo bar', 'Carta caffè', 'un caffè gratis'], money: v => v.toFixed(2).replace('.', ',').replace(',00', '') + ' €' }
  }[lang];
  const plans = [['Start', 19], ['Plus', 39], ['Pro', 79]];
  const card = { business: T.card[0], title: T.card[1], reward: T.card[2], stampsNeeded: 8, color: '#FFFFFF', ink: '#2B32FF', stamp: 'sole', font: 'sans', strip: '', lang };
  const tick = '<div class="run">' + '<span>BLACK FRIDAY 50%</span><i>✦</i>'.repeat(16) + '</div>';
  const site = CONFIG.siteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  document.getElementById('post').innerHTML = `
    <div class="tick t">${tick}</div>
    <div class="logo"><b></b>Timbro</div>
    <div class="kick">BLACK FRIDAY</div>
    <div class="big">−50%</div>
    <div class="life">${T.life}</div>
    <p class="lede">${T.lede}</p>
    <div class="prices">${plans.map(([n, p]) => `<div class="pr"><b>${n}</b><span><s>${T.money(p)}</s><em>${T.money(p / 2)}</em><small>${T.per}</small></span></div>`).join('')}</div>
    <div class="cta"><div class="btn2">${T.cta}</div><span>${site}</span></div>
    <p class="fine">${T.fine}</p>
    <div class="tag">−50%<small>${T.tag}</small></div>
    <div class="phone"><div class="bezel"><div class="scr"><div class="isl"></div><div class="wal">${UI.renderPass(card, { id: 'K7M2QX', name: 'Ola K.', stamps: 5 }, { stamps: 5, platform: 'apple' })}</div></div></div></div>
    <div class="tick b">${tick}</div>`;
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
