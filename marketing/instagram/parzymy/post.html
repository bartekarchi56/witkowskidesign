<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Parzymy Tutaj · post Instagram</title>
<link rel="stylesheet" href="../../../assets/css/base.css">
<style>
/* Instagram post 4:5 (1080 x 1350) for Parzymy Tutaj. parzymy/make.js saves parzymy/post.png. */
:root{--dark:#2F4A2B;--green:#528E36;--brick:#BB4F35;--cream:#F7F5EF}
html,body{margin:0;background:var(--green)}
.post{width:1080px;height:1350px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--green) url(../../../print/kit-parzymy/tlo-wir-A4.png) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--dark)}
.panel{background:var(--cream);border-radius:44px;padding:64px 80px 56px;width:820px;box-sizing:border-box;box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
.logo{width:460px;display:block;margin:0 auto 34px}
h1{font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:86px;line-height:1.08;margin:0 0 26px}
.lede{font:500 38px/1.35 var(--font);margin:0}
.qr{margin:54px auto 0;width:400px;height:400px;background:#fff;border-radius:36px;padding:28px;box-sizing:border-box;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.qr svg{width:100%;height:100%;display:block}
.cta{margin:40px 0 0;font:700 40px/1.2 var(--font);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="post" id="post"></div>
<script src="../../../assets/vendor/qrcode.js"></script>
<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/i18n.js"></script>
<script src="../../../assets/js/stamps.js"></script>
<script src="../../../assets/js/ui.js"></script>
<script>
window.WAIT_READY = true;
(async () => {
  I18N.lang = 'pl';
  const url = UI.publicJoinUrl('parzymy-pokaz') + '&lang=pl';
  document.getElementById('post').innerHTML = `
    <div class="panel">
      <img class="logo" src="../../../print/kit-parzymy/logo-parzymy-black.png" alt="Parzymy Tutaj">
      <h1>Nowa karta<br>w telefonie.</h1>
      <p class="lede">Zbieraj pieczątki w Wallet. Po 8 wizytach kawa gratis.</p>
      <div class="qr">${UI.qrSvg(url)}</div>
    </div>
    <p class="cta">Zeskanuj i dołącz</p>`;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
