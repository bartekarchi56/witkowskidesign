<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Parzymy Tutaj · post: karta w telefonie</title>
<link rel="stylesheet" href="../../../assets/css/base.css">
<style>
/* Instagram post 4:5 (1080 x 1350): headline, the real card on a phone, three steps.
   node marketing/instagram/parzymy/make.js saves post-karta.png */
:root{--dark:#2F4A2B;--green:#528E36;--brick:#BB4F35;--cream:#F7F5EF;--sand:#EDE8DC}
html,body{margin:0;background:var(--cream)}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--cream);color:var(--dark);font-family:var(--font)}
.blob{position:absolute;right:-250px;top:180px;width:760px;height:760px;border-radius:50%;background:url(../../../print/kit-parzymy/tlo-wir-A4.png) center/cover;opacity:.95}
.blob2{position:absolute;left:-140px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:var(--sand)}
.logo{position:absolute;left:72px;top:64px;width:330px}
h1{position:absolute;left:72px;top:200px;margin:0;font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:94px;line-height:1.02;letter-spacing:-.02em;width:560px}
h1 em{font-style:normal;color:var(--green)}
.lede{position:absolute;left:72px;top:440px;width:470px;margin:0;font-size:28px;line-height:1.45;color:#3B4A38}
.prize{position:absolute;left:72px;top:680px;width:470px;margin:0;font-family:"EB Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:46px;line-height:1.15;color:var(--brick)}







.phone{position:absolute;right:78px;top:205px;width:372px;height:766px;border-radius:66px;padding:12px;box-sizing:border-box;transform:rotate(5deg);
  background:#2A2A2C;
  box-shadow:0 0 0 1.5px #8E8E93 inset,0 0 0 3px #1C1C1E inset,0 2px 6px rgba(0,0,0,.25),0 50px 70px -30px rgba(25,35,20,.55),0 90px 120px -60px rgba(25,35,20,.35)}
.phone .sb{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#3a3936,#9c9a95)}
.phone .b1{left:-4px;top:150px;height:34px}.phone .b2{left:-4px;top:205px;height:62px}.phone .b3{left:-4px;top:280px;height:62px}.phone .b4{right:-4px;top:230px;height:96px;background:linear-gradient(270deg,#3a3936,#9c9a95)}
.bezel{width:100%;height:100%;border-radius:55px;background:#050505;padding:7px;box-sizing:border-box}
.scr{position:relative;width:100%;height:100%;border-radius:48px;background:#F2F2F7;overflow:hidden}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 35%)}
.isl{position:absolute;top:13px;left:50%;width:110px;height:32px;margin-left:-55px;border-radius:18px;background:#000;z-index:3}
.bar{display:flex;justify-content:space-between;padding:20px 30px 0;font:600 17px/1 -apple-system,Archivo,sans-serif;color:#000}
.wal{padding:34px 14px 0}
.wal b{display:flex;justify-content:space-between;align-items:center;font:800 32px/1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 6px 16px}
.wal b i{width:30px;height:30px;border-radius:50%;background:#1A1A1A;color:#fff;font:700 22px/30px Archivo;text-align:center;font-style:normal}
.wal .pass{max-width:none;width:100%;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.bank{margin-top:14px;height:96px;border-radius:14px;background:linear-gradient(135deg,#3B3F4A,#15161A);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.shade{position:absolute;right:90px;top:985px;width:380px;height:34px;border-radius:50%;background:rgba(25,35,20,.28);filter:blur(16px)}
.steps{position:absolute;left:56px;right:56px;bottom:150px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border-radius:34px;padding:30px 20px;box-shadow:0 20px 40px -24px rgba(30,40,25,.35)}
.step{display:flex;align-items:center;gap:18px;padding:0 14px;font-size:26px;line-height:1.25;font-weight:600}
.step + .step{border-left:2px dashed #E3DED2}
.step b{flex:0 0 58px;height:58px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;font-size:28px}
.join{position:absolute;left:72px;top:850px;display:flex;align-items:center;gap:26px}
.join .qr{width:190px;height:190px;background:#fff;border-radius:24px;padding:16px;box-sizing:border-box;box-shadow:0 16px 30px -18px rgba(30,40,25,.4)}
.join .qr svg{width:100%;height:100%;display:block}
.join p{margin:0;font-size:27px;line-height:1.3;font-weight:600;width:220px}
.foot{position:absolute;left:0;right:0;bottom:62px;text-align:center;font:600 24px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
</style>
</head>
<body>
<div class="post" id="post"></div>
<script src="../../../assets/vendor/qrcode.js"></script>
<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/i18n.js"></script>
<script src="../../../assets/js/stamps.js"></script>
<script src="../../../assets/js/ui.js"></script>
<script>
window.WAIT_READY = true;
(async () => {
  I18N.lang = 'pl';
  const K = '../../../print/kit-parzymy/';
  const card = { id: 'parzymy-pokaz', business: 'Parzymy Tutaj', title: 'Karta kawowa', reward: 'kawa gratis', stampsNeeded: 8, lang: 'pl', font: 'sans',
    color: '#FFFFFF', ink: '#1A1A1A', strip: '#528E36', hideReward: true, hideCount: true, noShift: true,
    logo: K + 'logo-parzymy-black-wide.png', stampImage: K + 'pieczatka-parzymy.png', emptyImage: K + 'pusta-pieczatka-parzymy.png', stripImage: K + 'karta-pasek-parzymy.png' };
  const who = { id: 'P4RZ7Y', name: 'Ola K.', stamps: 5 };
  document.getElementById('post').innerHTML = `
    <div class="blob"></div><div class="blob2"></div>
    <img class="logo" src="${K}logo-parzymy-black-wide.png" alt="Parzymy Tutaj">
    <h1>Karta kawowa<br><em>w telefonie.</em></h1>
    <p class="lede">Koniec z kartonikami, które giną w kieszeni. Twoja karta Parzymy Tutaj jest teraz w Apple i Google Wallet, a pieczątkę dostajesz przy kasie.</p>
    <p class="prize">Po 8 pieczątkach kawa gratis.</p>
    <div class="join"><div class="qr">${UI.qrSvg(UI.publicJoinUrl('parzymy-pokaz') + '&lang=pl')}</div><p>Zeskanuj i załóż kartę</p></div>
    <div class="shade"></div><div class="phone"><i class="sb b1"></i><i class="sb b2"></i><i class="sb b3"></i><i class="sb b4"></i><div class="bezel"><div class="scr"><div class="isl"></div><div class="bar"><span>9:41</span><span>●●● ▮</span></div><div class="wal"><b>Portfel <i>+</i></b>${UI.renderPass(card, who, { platform: 'apple' })}<div class="bank"></div></div></div></div></div>
    <div class="steps">
      <div class="step"><b>1</b>Zeskanuj kod przy kasie</div>
      <div class="step"><b>2</b>Zapisz kartę w Wallet</div>
      <div class="step"><b>3</b>Zbieraj pieczątki</div>
    </div>
    <div class="foot">Parzymy Tutaj · Długa 61 · Bydgoszcz</div>`;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
