<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timbro Instagram studio</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
/* Every asset is drawn at half size (540 px wide) and captured at 2x. */
html,body{margin:0;background:#CFCFCF}
#stage{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font)}
.feed{width:540px;height:675px}
.story{width:540px;height:960px}
.square{width:540px;height:540px}
.abs{position:absolute}
.disp{font-stretch:125%;font-weight:800;letter-spacing:-.035em;line-height:1}
.lbl{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.body{font-size:19px;line-height:1.45;color:var(--ink-2)}
.brandline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.url{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--muted)}
.blue{color:var(--pop)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--pop);color:#fff;font-weight:700;font-size:17px;white-space:nowrap}
.foot{position:absolute;left:36px;right:36px;bottom:30px;display:flex;justify-content:space-between;align-items:center}
.dark{background:var(--ink);color:#fff}
.dark .url,.dark .lbl{color:#A9A9AE}

/* phone and card */
.phone.p320{width:320px}
.phone.p320 .phone-screen{min-height:0;padding:42px 12px 18px}
.phone.p360{width:360px}
.phone.p360 .phone-screen{min-height:0;padding:46px 14px 20px}
.phone .pass{max-width:none}
.card-solo .pass{max-width:none}

/* a paper loyalty card, the old way */
.paper{width:250px;padding:16px 18px 18px;background:linear-gradient(135deg,#F7F2E8 0%,#EFE7D7 55%,#F5EFE3 100%);border-radius:6px;box-shadow:0 2px 3px rgba(0,0,0,.12),0 14px 30px -12px rgba(0,0,0,.35);position:relative;overflow:hidden;font-family:"EB Garamond",Georgia,serif;color:#3A2A20}
.paper::before{content:"";position:absolute;left:0;right:0;top:46%;height:1px;background:rgba(0,0,0,.08);box-shadow:0 1px 0 rgba(255,255,255,.6)}
.paper::after{content:"";position:absolute;width:120px;height:120px;right:-30px;bottom:-34px;border-radius:50%;border:9px solid rgba(120,72,34,.13);filter:blur(.6px)}
.paper .pp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.paper .pp-top b{font-size:22px;font-style:italic;font-weight:600}
.paper .pp-top span{font:500 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.paper .pp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.paper .pp-dot{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(58,42,32,.35);display:grid;place-items:center}
.paper .pp-dot svg{width:118%;height:118%;color:#4B3FA8;opacity:.82}
.paper .pp-small{margin-top:12px;font:italic 13px/1.2 "EB Garamond",serif;opacity:.75}

/* slides */
.num{font:800 92px/1 var(--font);font-stretch:125%;letter-spacing:-.04em;color:var(--pop)}
.swipe{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px}
.tile .t-l{font-size:14px;color:var(--muted);margin-bottom:8px}
.tile .t-v{font:800 54px/1 var(--font);font-stretch:118%;letter-spacing:-.03em}
.chip{display:inline-flex;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;font-size:19px;font-weight:600}
.dotrow{display:flex;gap:7px;align-items:center}
.dotrow i{width:24px;height:24px;border-radius:50%;background:#E3E3E1;display:block}
.dotrow i.on{background:var(--pop)}
.mark{width:84px;height:84px;--t:#0B0B0C}
.bubble{background:var(--pop);color:#fff;border-radius:20px 20px 20px 6px;padding:16px 18px;font-size:18px;line-height:1.35;font-weight:500;box-shadow:0 14px 30px -16px rgba(43,50,255,.6)}

/* prices */
.plan{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;padding:16px 20px;border:1.5px solid var(--line);border-radius:18px;background:#fff}
.plan.hl{border-color:var(--pop);box-shadow:0 0 0 1.5px var(--pop)}
.plan .p-n{font:800 26px/1 var(--font);font-stretch:118%;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.plan .p-f{font-size:15px;color:var(--muted);grid-column:1}
.plan .p-p{grid-row:1/3;grid-column:2;text-align:right;font:800 40px/1 var(--font);font-stretch:118%;letter-spacing:-.03em}
.plan .p-p small{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.tag{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--pop);color:#fff;padding:5px 8px;border-radius:999px}

/* reels */
.hook{position:absolute;left:36px;right:36px;top:130px;font:800 44px/1.02 var(--font);font-stretch:125%;letter-spacing:-.035em}
.daypill{font:500 13px/1 var(--mono);letter-spacing:.06em;background:var(--ink);color:#fff;padding:8px 12px;border-radius:999px}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--pop);box-shadow:0 0 18px 4px rgba(43,50,255,.55)}
.frame{position:absolute;border:3px solid var(--pop);border-radius:14px}
.end{position:absolute;inset:0;background:var(--ink);color:#fff;display:grid;align-content:center;justify-items:center;text-align:center;gap:18px;padding:0 40px}
.end .bm{width:116px;height:116px;border-radius:50%;background:var(--pop);position:relative}
.end .bm::after{content:"";position:absolute;inset:18px;border-radius:50%;border:5px solid rgba(255,255,255,.85)}
.end h2{font:800 66px/1 var(--font);font-stretch:125%;letter-spacing:-.04em}
.end p{font-size:22px;line-height:1.35;color:#C9C9CD;max-width:15em}
.end .url{color:#A9A9AE;font-size:14px}
.ticks{display:grid;gap:14px}
.ticks div{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:600}
.ticks b{width:30px;height:30px;border-radius:50%;background:var(--pop);color:#fff;display:grid;place-items:center;font-size:17px;flex:0 0 30px}
.poster{width:200px;background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 4px rgba(0,0,0,.1),0 20px 40px -18px rgba(0,0,0,.4);display:grid;gap:10px}
.poster h4{margin:0;font:800 22px/1 var(--font);font-stretch:125%;letter-spacing:-.03em}
.poster .q{width:120px;justify-self:center}
.poster small{font:500 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.stylechip{font:600 18px/1 var(--font);padding:11px 18px;border-radius:999px;background:#fff;border:1.5px solid var(--ink);white-space:nowrap}
.biz{font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}

/* highlights and profile */
.hl-ic{width:300px;height:300px;border-radius:50%;background:var(--pop);display:grid;place-items:center;color:#fff}
.hl-ic svg{width:150px;height:150px}
.hl-ic b{font:800 150px/1 var(--font);font-stretch:118%}

/* ad: realistic iPhone, tilted */
.iph{position:absolute;width:330px;height:690px;border-radius:58px;padding:12px;background:linear-gradient(145deg,#3a3a3f 0%,#121214 38%,#1d1d20 100%);
  box-shadow:inset 0 0 0 1.5px #5a5a60,inset 0 0 0 4px #0b0b0c,0 70px 90px -40px rgba(20,26,110,.55),0 30px 50px -25px rgba(0,0,0,.45);transform-origin:center}
.iph i{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2a2a2e,#141416)}
.iph .b1{left:-3px;top:118px;height:30px}.iph .b2{left:-3px;top:172px;height:58px}.iph .b3{left:-3px;top:242px;height:58px}.iph .b4{right:-3px;top:196px;height:92px}
.iph .scr{position:relative;height:100%;border-radius:47px;overflow:hidden;background:#F2F2F7}
.iph .scr::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 32%);pointer-events:none}
.iph .island{position:absolute;top:11px;left:50%;width:104px;height:31px;border-radius:20px;background:#000;transform:translateX(-50%)}
.iph .sbar{display:flex;justify-content:space-between;align-items:center;height:50px;padding:6px 30px 0 36px;font:600 15px/1 -apple-system,"SF Pro Text",var(--font);color:#000}
.iph .sbar span{display:flex;gap:6px;align-items:center}
.iph .pp{padding:18px 14px 0}
.iph .pp .pass{max-width:none}
.iph .msg{margin:12px 14px 0;background:#fff;border-radius:16px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start;font:500 14px/1.35 -apple-system,"SF Pro Text",var(--font);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.iph .msg::before{content:"";flex:0 0 9px;height:9px;margin-top:5px;border-radius:50%;background:var(--pop)}
.iph .code{margin:12px 14px 0;background:#fff;border-radius:16px;padding:14px;display:grid;justify-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.iph .code .qr{width:104px}
.iph .code small{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ring{position:absolute;border-radius:50%;border:28px solid var(--pop-wash)}
.feat{display:grid;gap:14px}
.feat > div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.feat .ic{width:40px;height:40px;border-radius:50%;background:var(--pop-wash);color:var(--pop);display:grid;place-items:center}
.feat .ic svg{width:21px;height:21px}
.feat b{display:block;font-size:16px;line-height:1.2;letter-spacing:-.01em}
.feat span{display:block;font-size:13px;line-height:1.3;color:var(--muted);margin-top:2px}
.badge{position:absolute;border-radius:50%;background:var(--pop);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 18px 34px -14px rgba(43,50,255,.7)}
.badge::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.badge small{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.badge b{font:800 38px/1 var(--font);font-stretch:118%;letter-spacing:-.04em;margin:3px 0}
.cta{position:absolute;display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 14px 14px 20px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -18px rgba(11,11,12,.35)}
.cta b{display:block;font-size:19px;letter-spacing:-.01em}
.cta span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.cta .go{flex:0 0 auto;background:var(--pop);color:#fff;font-weight:700;font-size:15px;padding:13px 18px;border-radius:999px;white-space:nowrap}
.byline{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* showcase: 3D phone on a dark stage */
.cam{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
.cam .iph{left:0;top:0;transform-style:preserve-3d;box-shadow:inset 0 0 0 1.5px #6a6a72,inset 0 0 0 4px #0b0b0c,0 0 0 1px rgba(255,255,255,.08),0 50px 120px -30px rgba(43,50,255,.6)}
.pop3d{position:absolute;background:#fff;border-radius:16px;box-shadow:0 30px 50px -18px rgba(0,0,0,.55);backface-visibility:hidden}
.conf{position:absolute;width:38px;height:38px;border-radius:50%;background:var(--pop);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -8px rgba(43,50,255,.8)}
.conf svg{width:20px;height:20px}
.topfade{position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(#0B0B0C 0%,rgba(11,11,12,.92) 45%,rgba(11,11,12,0) 100%)}
.hook.w{color:#fff}
.hook.w em{font-style:normal;color:#7B80FF}
</style>
</head>
<body>
<div id="stage"></div>

<script src="../../assets/vendor/qrcode.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/analytics.js"></script>
<script>
/*
 * Timbro's Instagram assets, drawn with the real card renderer.
 *   studio.html?id=post-intro&lang=it          a feed post (1080x1350)
 *   studio.html?id=carousel-mistakes&s=3&lang=en           slide 3 of a carousel
 *   studio.html?id=reel-stamps&lang=it          a reel: window.seek(t) draws the frame at t seconds
 * make.js captures them; window.ASSETS lists what exists.
 */
const Q = new URLSearchParams(location.search);
const lang = Q.get('lang') === 'en' ? 'en' : 'it';
I18N.lang = lang;
document.documentElement.lang = lang;
const L = (it, en) => lang === 'en' ? en : it;
const stage = document.getElementById('stage');
const esc = UI.esc;

// ---------- timing helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function show(el, p, dy = 26) { el.style.opacity = p; el.style.transform = `translateY(${((1 - p) * dy).toFixed(2)}px)`; }
function el(html, css = '') { const d = document.createElement('div'); d.innerHTML = html; const n = d.firstElementChild; if (css) n.style.cssText += css; stage.appendChild(n); return n; }

// ---------- shared pieces ----------
const money = n => new Intl.NumberFormat(lang === 'it' ? 'it-IT' : 'en-IE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
const plan = id => CONFIG.plans.find(p => p.id === id);
const URL_TXT = CONFIG.siteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
const brand = (dark) => `<span class="brandline"${dark ? ' style="color:#fff"' : ''}><span class="brand-mark"></span>Timbro</span>`;
const foot = (right) => el(`<div class="foot">${brand(stage.classList.contains('dark'))}<span class="${right ? 'swipe' : 'url'}">${right || esc(URL_TXT)}</span></div>`);

// The example card is "your café": the viewer pictures their own place.
const YOUR = {
  business: L('Il tuo bar', 'Your café'), title: L('Carta caffè', 'Coffee card'), reward: L('un caffè gratis', 'a free coffee'),
  stampsNeeded: 10, icon: 'cup', color: '#FFFFFF', ink: '#2B32FF', shape: 'dot', mark: 'icon', empty: 'soft', font: 'sans', strip: ''
};
const look = id => CONFIG.styles.find(s => s.id === id).look;
const CUP_ART = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#2B32FF"/><path d="M27 40h36v13a17 17 0 0 1-17 17h-2a17 17 0 0 1-17-17z" fill="#fff"/><path d="M63 44h5a8 8 0 0 1 0 16h-5" fill="none" stroke="#fff" stroke-width="5"/><path d="M37 22c-3 4 3 7 0 11M47 22c-3 4 3 7 0 11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>');

const TPL = [
  { id: 'gelateria', biz: L('La tua gelateria', 'Your gelato shop'), color: '#FFF3EC', ink: '#E5577F', shape: 'dot', empty: 'soft' },
  { id: 'aperitivo', biz: L('Il tuo cocktail bar', 'Your cocktail bar'), color: '#0B0B0C', ink: '#F07A2E', shape: 'ring', empty: 'outline' },
  { id: 'pasticceria', biz: L('La tua pasticceria', 'Your bakery'), color: '#F3EEE4', ink: '#4A2E21', shape: 'square', empty: 'dashed', font: 'serif' },
  { id: 'parrucchiere', biz: L('Il tuo salone', 'Your salon'), color: '#0B0B0C', ink: '#C9A24A', shape: 'ring', empty: 'outline', font: 'wide' }
].map(x => {
  const t = CONFIG.templates.find(tp => tp.id === x.id);
  return { label: I18N.pick(t).type, card: { business: x.biz, title: I18N.pick(t).title, reward: I18N.pick(t).reward, stampsNeeded: t.stamps, icon: t.icon,
    color: x.color, ink: x.ink, shape: x.shape, mark: 'icon', empty: x.empty, font: x.font || 'sans', strip: '' } };
});

// A card that can be re-drawn with n stamps; the newest stamp lands like a rubber stamp.
function cardHost(host, card, opts = {}) {
  let key = '';
  return {
    set(n, age = 9, extra) {
      const c = extra ? { ...card, ...extra } : card;
      const k = n + '|' + JSON.stringify(extra || {});
      if (k !== key) { host.innerHTML = UI.renderPass(c, null, { stamps: n, platform: opts.platform || 'apple', compact: !!opts.compact }); key = k; }
      const dot = host.querySelectorAll('.wp-dot.on')[n - 1];
      if (!dot) return;
      if (age < .4) {
        const p = age / .4, s = 1 + .9 * (1 - eBack(p));
        dot.style.transform = `scale(${s.toFixed(3)})` + (dot.classList.contains('s-hanko') ? ' rotate(var(--r))' : '');
        dot.style.opacity = Math.min(1, p / .55) * (dot.classList.contains('s-hanko') ? .92 : 1);
      } else { dot.style.transform = ''; dot.style.opacity = ''; }
    }
  };
}
// How many stamps are down at time t, and how long ago the last one landed.
function stampsAt(t, times, base = 0) { let n = 0; while (n < times.length && times[n] <= t) n++; return [base + n, n ? t - times[n - 1] : 9]; }

function phone(card, opts = {}) {
  const ph = el(`<div class="phone ${opts.big ? 'p360' : 'p320'} abs"><div class="phone-screen"></div></div>`, opts.css || '');
  return { el: ph, card: cardHost(ph.firstElementChild, card, opts) };
}
function solo(card, width, css, opts = {}) {
  const box = el(`<div class="card-solo abs" style="width:${width}px"></div>`, css);
  return { el: box, card: cardHost(box, card, opts) };
}
function paperCard(stamps = 7) {
  let dots = '';
  for (let i = 0; i < 10; i++) {
    const r = [-14, 9, -4, 16, -9, 6, -18, 11, -6, 13][i];
    dots += `<div class="pp-dot">${i < stamps ? `<div style="transform:rotate(${r}deg) translate(${(i % 3) - 1}px,${(i % 2) - .5}px)">${UI.inkStamp('CAFFÈ · BAR · CAFFÈ · BAR ·')}</div>` : ''}</div>`;
  }
  return `<div class="paper"><div class="pp-top"><b>${L('Bar', 'Café')}</b><span>${L('Carta fedeltà', 'Loyalty card')}</span></div><div class="pp-grid">${dots}</div><div class="pp-small">${L('10 timbri, un caffè gratis', '10 stamps, a free coffee')}</div></div>`;
}
function markDot(card, inner) {   // one stamp, on its own, for illustrations
  const lk = card;
  return `<div class="pass" style="--c:${lk.color};--t:${UI.textOn(lk.color)};--s:${lk.ink};--sb:${lk.strip || lk.color};width:84px;background:transparent;box-shadow:none;overflow:visible">
    <span class="wp-dot s-${lk.shape} on" style="--r:-6deg;width:84px">${inner}</span></div>`;
}

// The closing card of every reel, from `start` seconds.
function endCard(start, line) {
  const box = el(`<div class="end">
    <div class="bm"></div>
    <h2>Timbro</h2>
    <p>${esc(line || L('La carta fedeltà del tuo locale, sul telefono. Niente app.', 'Your loyalty card, on the phone. No app.'))}</p>
    <span class="pill">${esc(L(`${CONFIG.trialDays} giorni gratis`, `${CONFIG.trialDays} days free`))}</span>
    <span class="url">${esc(URL_TXT)}</span></div>`);
  const [bm, h2, p, pill, url] = box.children;
  return t => {
    const a = seg(t, start, start + .45);
    box.style.transform = `translateY(${((1 - eOut(a)) * 100).toFixed(2)}%)`;
    box.style.visibility = a > 0 ? 'visible' : 'hidden';
    const b = seg(t, start + .35, start + .75);
    bm.style.transform = `scale(${(1 + .9 * (1 - eBack(b))).toFixed(3)})`; bm.style.opacity = Math.min(1, b / .5);
    show(h2, eOut(seg(t, start + .55, start + .95)));
    show(p, eOut(seg(t, start + .7, start + 1.1)));
    show(pill, eOut(seg(t, start + .85, start + 1.25)));
    show(url, eOut(seg(t, start + 1, start + 1.4)));
  };
}
function crossText(node, texts, times, t) {   // swaps the text of a hook at the given times
  let i = 0; while (i + 1 < times.length && t >= times[i + 1]) i++;
  if (node.dataset.i !== String(i)) { node.innerHTML = texts[i]; node.dataset.i = i; }
  const into = seg(t, times[i], times[i] + .45), out = i + 1 < times.length ? seg(t, times[i + 1] - .3, times[i + 1]) : 0;
  node.style.opacity = eOut(into) * (1 - out);
  node.style.transform = `translateY(${((1 - eOut(into)) * 26 - out * 20).toFixed(2)}px)`;
}

// =====================================================================
const ASSETS = {};

// ---------- feed posts (1080x1350) ----------
ASSETS['post-intro'] = { size: 'feed', build() {
  el(`<div class="abs" style="left:36px;top:34px">${brand()}</div>`);
  el(`<div class="abs url" style="right:36px;top:40px">${esc(URL_TXT)}</div>`);

// Number, title and text; returns the y where the text ends.
function slideHead(n, total, title, body) {
  el(`<div class="abs lbl" style="right:36px;top:40px">${n} / ${total}</div>`);
  el(`<div class="abs num" style="left:30px;top:36px">${String(n - 1).padStart(2, '0')}</div>`);
  const h = el(`<h2 class="abs disp" style="left:36px;right:36px;top:146px;font-size:38px">${esc(title)}</h2>`);
  const b = el(`<p class="abs body" style="left:36px;right:60px;top:${146 + h.offsetHeight + 14}px">${esc(body)}</p>`);
  return b.offsetTop + b.offsetHeight;
}
// Scales a card box to fit between top and bottom, centred.
function fit(box, top, bottom, rot = 0) {
  const w = box.offsetWidth, h = box.offsetHeight, k = Math.min(1, (bottom - top) / h);
  box.style.left = ((540 - w * k) / 2).toFixed(1) + 'px'; box.style.top = top + 'px';
  box.style.transformOrigin = 'top left'; box.style.transform = `scale(${k.toFixed(3)}) rotate(${rot}deg)`;
  return top + h * k;
}
// Last slide of a carousel: headline, offer and the card on a phone, cut by the bottom edge.
function ctaSlide(title, card, stamps) {
  el(`<div class="abs" style="left:36px;top:34px">${brand()}</div>`);

  const p = phone(card, { css: `left:110px;top:${o.offsetTop + o.offsetHeight + 34}px` }); p.card.set(stamps);
}

    { t: 10.2, x: 270, y: 650, rx: 2, ry: 0, rz: 0, k: .74 },
    { t: 12.0, x: 270, y: 645, rx: 2, ry: -6, rz: 0, k: .75 },
    { t: 12.7, x: 290, y: 620, rx: 8, ry: -20, rz: 1.5, k: .86 },
    { t: 14.6, x: 288, y: 615, rx: 6, ry: -26, rz: 1.5, k: .88 }
  ];
  const side3 = (sign) => [
    { t: 0, x: 270 + sign * 500, y: 660, z: -300, rx: 2, ry: -sign * 40, rz: 0, k: .64 },
    { t: 9.9, x: 270 + sign * 500, y: 660, z: -300, rx: 2, ry: -sign * 40, rz: 0, k: .64 },
    { t: 10.6, x: 270 + sign * 175, y: 660, z: -180, rx: 2, ry: -sign * 26, rz: 0, k: .64 },
    { t: 12.0, x: 270 + sign * 168, y: 655, z: -180, rx: 2, ry: -sign * 30, rz: 0, k: .64 },
    { t: 12.6, x: 270 + sign * 520, y: 660, z: -300, rx: 2, ry: -sign * 40, rz: 0, k: .64 }
  ];
  const KL = side3(-1), KR = side3(1);
  const times = [3.3, 3.8, 4.3, 8.0];
  return t => {
    const gx = 50 + 18 * Math.sin(t * .45), gy = 55 + 10 * Math.cos(t * .37);
    glow.style.background = `radial-gradient(70% 45% at ${gx.toFixed(1)}% ${gy.toFixed(1)}%, rgba(43,50,255,.42) 0%, rgba(43,50,255,0) 70%)`;
    place(main.el, camAt(KM, t)); place(left.el, camAt(KL, t)); place(right.el, camAt(KR, t));
    let i = 0; while (i + 1 < H.length && t >= H[i + 1][1]) i++;
    crossText(hook, H.map(h => h[0].includes('<br>') ? h[0] : esc(h[0])), H.map(h => h[1]), t);
    const [n, age] = stampsAt(t, times, 6);
    main.card.set(n, age);
    const full = n >= 10;
    main.msg.textContent = full ? UI.fillMessage(CONFIG.messages.ready[lang], YOUR, { name: L('Giulia', 'Emma'), lang }) : m.textContent;
    main.msg.style.opacity = n >= 9 && !(t > 5.4 && t < 7.6) ? 1 : 0;
    const up = eOut(seg(t, 5.4, 6.0)), down = eInOut(seg(t, 7.2, 7.6));
    const z = 130 * up * (1 - down);
    flo.style.transform = `translateZ(${z.toFixed(1)}px) scale(${(1 + .1 * up * (1 - down)).toFixed(3)})`;
    flo.style.opacity = t > 5.4 && t < 7.6 ? 1 : 0;
    conf.forEach((o, j) => {
      const p = eOut(seg(t, 8.0 + j * .015, 9.2)), f = seg(t, 8.9, 9.6);
      o.c.style.transform = `translate3d(${(o.dx * p).toFixed(1)}px,${(o.dy * p + 60 * f * f).toFixed(1)}px,${(o.dz * p).toFixed(1)}px) rotate(${(o.rot * p).toFixed(1)}deg) scale(${(p ? .6 + .6 * p : 0).toFixed(3)})`;
      o.c.style.opacity = p > 0 ? 1 - f : 0;
    });
    const ta = eOut(seg(t, 12.7, 13.2)), tb = eOut(seg(t, 12.95, 13.45));
    tA.style.transform = `translateZ(${(200 * ta).toFixed(1)}px)`; tA.style.opacity = ta;
    tB.style.transform = `translateZ(${(260 * tb).toFixed(1)}px)`; tB.style.opacity = tb;
    line.setAttribute('stroke-dashoffset', (1 - eInOut(seg(t, 13.1, 14.3))).toFixed(4));
    bars.forEach((b, j) => { b.style.transform = `scaleY(${eOut(seg(t, 13.3 + j * .08, 13.8 + j * .08)).toFixed(3)})`; });
    fade.style.opacity = 1;
    end(t);
  };
} };

// ---------- run ----------
window.ASSETS = Object.fromEntries(Object.entries(ASSETS).map(([k, v]) => [k, { size: v.size, slides: v.slides || 0, duration: v.duration || 0, cover: v.cover || 0 }]));
const id = Q.get('id');
const FONTS = ['800 40px Archivo', '400 17px Archivo', '500 12px "Spline Sans Mono"', 'italic 500 20px "EB Garamond"', '700 20px "Noto Serif JP"'];
Promise.all(FONTS.map(f => document.fonts.load(f, 'Aa珈€'))).then(run);
function run() {
if (id && ASSETS[id]) {
  const a = ASSETS[id];
  stage.className = a.size;
  const at = a.build(+Q.get('s') || 1);
  window.seek = typeof at === 'function' ? t => at(t) : () => {};
  window.seek(+Q.get('t') || 0);
} else {
  stage.className = 'feed';
  stage.innerHTML = `<div style="padding:24px;font:15px/1.6 var(--mono)">${Object.keys(ASSETS).map(k => `<a href="?id=${k}&lang=${lang}">${k}</a>`).join('<br>')}</div>`;
}
document.fonts.ready.then(() => { window.READY = true; });
}
</script>
