<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timbro flyer</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style id="page-size">@page{size:A5;margin:0}</style>
<style>
/* A one-sheet A5 flyer to hand to café owners: front and back. ?lang=it|en.
   ?format=a4 puts both sides of two flyers on A4 landscape for a home printer (cut in half).
   print/make-pdfs.js saves them in print/stampa/. */
html,body{margin:0;background:#ccc}
body{font-family:var(--font);color:var(--ink)}
.side{width:148mm;height:210mm;box-sizing:border-box;padding:12mm 11mm 10mm;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.sheet{width:297mm;height:210mm;display:flex;background:#fff;page-break-after:always;break-after:page;margin:0 auto 20px}
.sheet .side{border-right:.2mm dashed #ccc}
.sheet .side:last-child{border-right:0}
.solo{page-break-after:always;break-after:page;margin:0 auto 20px}
@media print{html,body{background:none}.solo,.sheet{margin:0}}
.brand{display:flex;align-items:center;gap:2.2mm;font-size:15pt;font-weight:800;font-stretch:112%}
.brand i{width:5.6mm;height:5.6mm;border-radius:50%;background:var(--pop);box-shadow:inset 0 0 0 1.2mm var(--pop),inset 0 0 0 1.55mm #fff}
.kicker{font:500 7.5pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pop);margin:0 0 2.5mm}
h1{font-size:25pt;line-height:1.02;font-stretch:112%;font-weight:800;margin:6mm 0 3mm;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--pop)}
h2{font-size:15pt;line-height:1.1;font-stretch:110%;font-weight:800;margin:0 0 3mm}
p{font-size:9.5pt;line-height:1.45;margin:0 0 2.5mm;color:var(--ink-2)}
.front .lede{font-size:10.5pt;max-width:110mm}
.hero{flex:1;display:flex;align-items:center;justify-content:center;gap:5mm;min-height:0;margin-top:2mm}
.phone-shot{height:100%;max-height:112mm;aspect-ratio:1179/2556;border-radius:6mm;border:1.6mm solid #111;overflow:hidden;background:#000;box-sizing:content-box}
.phone-shot img{width:100%;height:100%;display:block;object-fit:cover}
.pts{display:flex;flex-direction:column;gap:3.5mm;max-width:52mm}
.pt b{display:block;font-size:10pt;margin-bottom:.6mm}
.pt span{font-size:8.5pt;line-height:1.35;color:var(--ink-2);display:block}
.pt i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:50%;background:var(--pop);margin-right:1.6mm;vertical-align:.2mm}
.bar{margin-top:5mm;display:flex;justify-content:space-between;align-items:center;font:500 7.5pt/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;margin-bottom:5mm}
.step{background:var(--wash);border-radius:3mm;padding:3mm}
.step b{display:inline-grid;place-items:center;width:5.5mm;height:5.5mm;border-radius:50%;background:var(--pop);color:#fff;font-size:8pt;margin-bottom:1.6mm}
.step h3{font-size:8.8pt;margin:0 0 .8mm;line-height:1.2}
.step p{font-size:7.6pt;line-height:1.35;margin:0}
.plans{display:grid;gap:2mm;margin-bottom:3mm}
.plan{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 4mm;border:.3mm solid var(--line);border-radius:3mm;padding:2.6mm 3.5mm}
.plan.hl{border:.5mm solid var(--pop);background:var(--pop-wash)}
.plan h3{font-size:10.5pt;margin:0;display:flex;gap:2mm;align-items:center}
.plan .tag{font:600 6pt/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--pop);color:#fff;padding:1mm 1.8mm;border-radius:99px}
.plan p{font-size:7.6pt;margin:.6mm 0 0;line-height:1.3}
.plan .pr{grid-row:1/3;grid-column:2;text-align:right;font-size:15pt;font-weight:800;font-stretch:110%;line-height:1}
.plan .pr small{display:block;font:500 6.2pt/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.small{font-size:7.6pt;color:var(--muted);margin:0}
.it{display:block;font-size:.8em;font-weight:400;opacity:.72;margin-top:.4mm;line-height:1.3;font-stretch:100%;letter-spacing:0;text-transform:none}
h1 .it{font-size:12pt;font-weight:600;color:var(--ink-2);opacity:1;margin-top:1.5mm}
h1 .it em{color:var(--pop)}
h2 .it{font-size:9.5pt;font-weight:500;margin-top:.8mm}
.kicker .it{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:.9em}
.bi .front h1{font-size:22pt;margin-top:5mm}
.bi .steps{margin-bottom:4mm}
.bi .plan{padding:2.2mm 3.5mm}
.bi .pts{gap:2.6mm}
.bi .phone-shot{max-height:100mm}
.bi .pt b .it{font-weight:500}
.contact em .it{font:inherit;font-size:.88em;color:#C9CAFF;margin-top:.3mm}
.panel{display:block;width:100%;border-radius:2.5mm;border:.3mm solid var(--line);margin:0 0 4mm}
.contact{margin-top:auto;display:flex;gap:5mm;align-items:center;background:var(--ink);color:#fff;border-radius:4mm;padding:4.5mm}
.contact .qr{width:25mm;height:25mm;flex:0 0 25mm;background:#fff;padding:2mm;border-radius:2mm;box-sizing:border-box}
.contact .qr svg{width:100%;height:100%;display:block}
.contact b{font-size:11pt;display:block;margin-bottom:1mm}
.contact span{font:500 8pt/1.6 var(--mono);display:block;color:#E4E4EA}
.contact em{font-style:normal;font-size:8pt;color:#A9ABFF;display:block;margin-bottom:1.5mm}
</style>
</head>
<body>
<div id="doc"></div>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
window.WAIT_READY = true;
(async () => {
  const q = new URLSearchParams(location.search);
  // ?lang=bi: English, with the Italian in smaller type under each line.
  const lang = ['en', 'bi'].includes(q.get('lang')) ? q.get('lang') : 'it';
  document.documentElement.lang = lang === 'it' ? 'it' : 'en';
  const TEXTS = {
    it: {
      kicker: 'Carte fedeltà digitali per bar e caffetterie',
      h1: 'La carta fedeltà dei vostri clienti, <em>sul telefono.</em>',
      lede: 'I clienti raccolgono i timbri in Apple Wallet o Google Wallet. Niente app da scaricare, niente cartoncini da perdere.',
      pts: [['Nei vostri colori', 'Logo, colori e timbro disegnati per il vostro locale.'], ['Zero costi di stampa', 'Niente più cartoncini: la carta è sempre in tasca.'], ['Clienti che tornano', 'Promemoria sul telefono e premi che fanno tornare.'], ['Tutto sotto controllo', 'Vedete chi torna, quando e chi è vicino al premio.']],
      made: 'Fatto a Milano',
      how: 'Come funziona', howH: 'Tre passi, dieci secondi alla cassa.',
      steps: [['Inquadra il QR', 'Il cliente salva la carta nel Wallet, su iPhone e Android.'], ['Timbrate', 'Con il telefono che avete già, un tocco.'], ['Premio', 'Carta piena: il premio è pronto e si riparte.']],
      prices: 'Prezzi', month: 'al mese', from: 'da', perLoc: 'per sede al mese', rec: 'Il più scelto',
      plans: { start: 'Impostate voi logo, colori e timbro.', plus: 'Disegno io la carta e vi spedisco il kit stampato.', pro: 'Fino a 10 sedi, statistiche per ogni sede.', chain: 'Oltre 10 sedi, prezzo per sede e fattura.' },
      trial: n => `Primi ${n} giorni gratis. Disdite quando volete. Prezzi IVA esclusa.`,
      try: 'Inquadrate e provate una carta', also: 'anche WhatsApp'
    },
    en: {
      kicker: 'Digital loyalty cards for cafés',
      h1: 'Your customers’ loyalty card, <em>on their phone.</em>',
      lede: 'Customers collect stamps in Apple Wallet or Google Wallet. No app to download, no paper cards to lose.',
      pts: [['In your colours', 'Logo, colours and stamp designed for your café.'], ['No printing costs', 'No more paper cards: the card is always in their pocket.'], ['Customers come back', 'Reminders on their phone and rewards that bring them back.'], ['Everything in view', 'See who comes back, when, and who is close to a reward.']],
      made: 'Made in Milan',
      how: 'How it works', howH: 'Three steps, ten seconds at the till.',
      steps: [['Scan the QR', 'The customer saves the card in Wallet, on iPhone and Android.'], ['Stamp it', 'With the phone you already have, one tap.'], ['Reward', 'Card full: the reward is ready and it starts again.']],
      prices: 'Prices', month: 'a month', from: 'from', perLoc: 'per location a month', rec: 'Most popular',
      plans: { start: 'You set the logo, colours and stamp.', plus: 'I design the card and send you a printed kit.', pro: 'Up to 10 locations, stats for each one.', chain: 'Over 10 locations, price per location, invoiced.' },
      trial: n => `First ${n} days free. Cancel anytime. Prices exclude VAT.`,
      try: 'Scan and try a card', also: 'also WhatsApp'
    }
  };
  const INLINE = ['month', 'perLoc', 'rec', 'made', 'also'];
  const both = (en, it, key) => typeof en === 'function' ? n => both(en(n), it(n))
    : Array.isArray(en) ? en.map((x, i) => both(x, it[i]))
    : typeof en === 'object' ? Object.fromEntries(Object.keys(en).map(k => [k, both(en[k], it[k], k)]))
    : key === 'from' ? en : key === 'also' ? 'WhatsApp' : INLINE.includes(key) ? `${en} · ${it}` : `${en}<span class="it">${it}</span>`;
  TEXTS.bi = both(TEXTS.en, TEXTS.it);
  const esc = UI.esc, c = CONFIG.contact;
  const site = CONFIG.siteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  const plan = id => CONFIG.plans.find(p => p.id === id);
  // Both sides of one flyer in one language: [front, back].
  const sides = lang => {
  I18N.lang = lang === 'it' ? 'it' : 'en';
  const T = TEXTS[lang];
  const planRow = id => {
    const p = plan(id), name = esc(I18N.pick(p).name);
    const price = p.contact ? `${T.from} ${p.month} €<small>${T.perLoc}</small>` : `${p.month} €<small>${T.month}</small>`;
    return `<div class="plan${p.popular ? ' hl' : ''}"><h3>${name}${p.popular ? ` <span class="tag">${T.rec}</span>` : ''}</h3><p>${T.plans[id]}</p><div class="pr">${price}</div></div>`;
  };
  const front = `<section class="side front">
    <div class="brand"><i></i>Timbro</div>
    <h1>${T.h1}</h1>
    <p class="kicker">${T.kicker}</p>
    <p class="lede">${T.lede}</p>
    <div class="hero">
      <div class="phone-shot"><img src="img/wallet-it.png" alt=""></div>
      <div class="pts">${T.pts.map(([b, s]) => `<div class="pt"><b><i></i>${b}</b><span>${s}</span></div>`).join('')}</div>
    </div>
    <div class="bar"><span>${esc(site)}</span><span>${T.made}</span></div>
  </section>`;
  const back = `<section class="side back">
    <p class="kicker">${T.how}</p>
    <h2>${T.howH}</h2>
    <div class="steps">${T.steps.map(([h, s], i) => `<div class="step"><b>${i + 1}</b><h3>${h}</h3><p>${s}</p></div>`).join('')}</div>
    <p class="kicker">${T.prices}</p>
    <div class="plans">${['start', 'plus', 'pro', 'chain'].map(planRow).join('')}</div>
    <p class="small">${T.trial(CONFIG.trialDays)}</p>
    ${lang === 'it' ? '<p class="kicker" style="margin-top:4.5mm">Il vostro pannello</p><img class="panel" src="img/it-panel-kpi.png" alt="">' : ''}
    <div class="contact">
      <div class="qr">${UI.qrSvg(CONFIG.siteUrl + '?lang=' + (lang === 'it' ? 'it' : 'en'))}</div>
      <div><em>${T.try}</em><b>${esc(c.name)} · Witkowski Design</b><span>${esc(c.phone)} (${T.also})</span><span>${esc(CONFIG.legal.email)}</span><span>${esc(site)}</span></div>
    </div>
  </section>`;
  return [front, back];
  };
  // A4: two flyers per sheet, front sheet then back sheet (double-sided, flip on short edge), cut in half.
  // ?mix=1: Italian on the left, English on the right. Flipping on the short edge mirrors the sheet,
  // so the backs swap sides: the Italian back must sit behind the Italian front, on the right.
  if (lang === 'bi') document.body.classList.add('bi');
  const a4 = q.get('format') === 'a4';
  const [front, back] = sides(lang);
  let html;
  if (a4 && q.get('mix')) {
    const [itF, itB] = sides('it'), [enF, enB] = sides('en');
    html = `<div class="sheet">${itF}${enF}</div><div class="sheet">${enB}${itB}</div>`;
  } else html = a4
    ? `<div class="sheet">${front}${front}</div><div class="sheet">${back}${back}</div>`
    : `<div class="solo">${front}</div><div class="solo">${back}</div>`;
  document.getElementById('doc').innerHTML = html;
  document.getElementById('page-size').textContent = `@page{size:${a4 ? 'A4 landscape' : 'A5'};margin:0}`;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
