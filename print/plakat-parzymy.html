<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parzymy Tutaj · plakat z kodem QR</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Poster for the counter in Parzymy Tutaj's colours. The size comes from ?size=A4 or A3
   (print/make-plakat-parzymy.js saves print/kit-parzymy/plakat-parzymy-A4.pdf and -A3.pdf). */
:root{--dark:#2F4A2B;--green:#528E36;--light:#C9E3A3;--brick:#BB4F35;--cream:#F7F5EF}
html,body{margin:0;background:var(--green)}
.poster{box-sizing:border-box;width:210mm;height:297mm;padding:16mm 18mm 13mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--cream);background:var(--green);position:relative;overflow:hidden}
body.A3 .poster{width:297mm;height:420mm;padding:24mm 26mm 20mm}
.logo{width:62%;max-width:130mm;height:auto;display:block;margin:0 auto 17mm}
body.A3 .logo{max-width:170mm}
.bar{display:none}
body.A3 .bar{width:60mm;height:3mm;margin:10mm 0 9mm}
h1{font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:34pt;line-height:1.3;margin:0 0 4mm;letter-spacing:-.01em}
body.A3 h1{font-size:54pt;line-height:1.3}
.lede{font:500 15pt/1.4 var(--font);margin:0;opacity:.85}
body.A3 .lede{font-size:21pt}
.qr{margin:9mm auto 7mm;width:96mm;height:96mm;background:#fff;padding:7mm;box-sizing:border-box;border-radius:8mm}
body.A3 .qr{width:150mm;height:150mm;padding:12mm;margin:12mm auto 10mm;border-radius:10mm}
.qr svg{width:100%;height:100%;display:block}
.cta{font:700 15pt/1.2 var(--font);color:var(--green);letter-spacing:.01em;margin:0}
body.A3 .cta{font-size:26pt}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;width:100%;margin-top:auto}
.step{background:#fff;border-radius:5mm;padding:5mm 4mm;font-size:11pt;line-height:1.35}
body.A3 .step{font-size:14pt;padding:6mm 5mm}
.step b{display:block;font:700 22pt/1 var(--font);color:var(--brick);margin-bottom:2mm}
body.A3 .step b{font-size:32pt}
.foot{margin-top:6mm;font:500 9.5pt/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
body.A3 .foot{font-size:12pt;margin-top:8mm}
.stamp{width:22mm;height:22mm;position:absolute;right:16mm;top:16mm;transform:rotate(-8deg)}
body.A3 .stamp{width:38mm;height:38mm;right:24mm;top:24mm}

/* ?bg=tlo: the card's own swirl as the background, with a cream panel for the logo and headline. */
body.tlo .poster{background-size:cover;background-position:center}
body.tlo.A4 .poster{background-image:url(kit-parzymy/tlo-wir-A4.png)}
body.tlo.A3 .poster{background-image:url(kit-parzymy/tlo-wir-A3.png)}
body.tlo.A5 .poster{background-image:url(kit-parzymy/tlo-wir-A4.png)}
/* A5 is the A4 layout scaled to 148 x 210 mm */
body.A5 .poster{zoom:.7048}
body.tlo .head{background:var(--cream);color:var(--dark);border-radius:8mm;padding:12mm 14mm 10mm;margin-bottom:10mm}
body.tlo .head .logo{margin-bottom:12mm}
body.tlo .head h1{margin:0}
@page{margin:0}
@media print{html,body{background:var(--green)}}
</style>
</head>
<body class="A4" id="body">
<div class="poster" id="poster"></div>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/stamps.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
window.WAIT_READY = true;
(async () => {
  const q = new URLSearchParams(location.search).get('size');
  const size = q === 'A3' || q === 'A5' ? q : 'A4';
  const tlo = new URLSearchParams(location.search).get('bg') === 'tlo';
  document.body.className = size + (tlo ? ' tlo' : '');
  const url = UI.publicJoinUrl('8dvur7') + '&lang=pl';
  document.getElementById('poster').innerHTML = `
    <div class="head">
    <img class="logo" src="${tlo ? 'kit-parzymy/logo-parzymy-black.png' : 'kit-parzymy/logo-parzymy-cream.png'}" alt="Parzymy Tutaj">
    <div class="bar"></div>
    <h1>Zbieraj pieczątki<br>w telefonie.</h1>
    </div>
    <div class="qr">${UI.qrSvg(url)}</div>
    `;
  window.READY = true;
})();
</script>
</body>
</html>
