<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example cards · Sowa and Orsonero</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Two designs per café, each on iPhone (Apple Wallet) and Android (Google Wallet).
   print/make-example-cards.js screenshots every .shot into print/kit-*/. */
body{background:#F2EFEA;padding:40px;margin:0}
h1{font-size:28px;margin:0 0 6px}
.set{margin:0 0 56px}
.set > p{color:#6B6B70;margin:0 0 22px}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 30px}
.shot{width:360px;padding:10px}
.shot h3{font:600 13px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#6B6B70;margin:0 0 10px}
.shot .pass{max-width:340px}
.shot .pass.apple{border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 18px 40px -20px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="out"></div>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/stamps.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(async () => {
  const svgUrl = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  const dataUrl = async src => { const b = await (await fetch(src)).blob(); return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); }); };
  const OWL = await dataUrl('kit-sowa/art/sowa-owl-brown.png');
  const BEAR = await dataUrl('kit-orsonero/art/orsonero-bear.svg');
  // A strip with a big, faint logo in the middle: the stamps sit on top of it.
  const watermark = (img, bg, opacity, w = 1020, h = 450, size = 400) => svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/><image href="${img}" xlink:href="${img}" x="${(w - size) / 2}" y="${(h - size) / 2}" width="${size}" height="${size}" opacity="${opacity}" preserveAspectRatio="xMidYMid meet"/></svg>`);
  // Sowa's fish-scale pattern (as on cukierniasowa.pl), in cream.
  const scales = svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450"><defs><pattern id="s" width="64" height="40" patternUnits="userSpaceOnUse"><path d="M-32 40a32 32 0 0 1 64 0M32 40a32 32 0 0 1 64 0M0 20a32 32 0 0 1 64 0" fill="none" stroke="#E6D9C6" stroke-width="2.4"/></pattern></defs><rect width="1020" height="450" fill="#FBF6EE"/><rect width="1020" height="450" fill="url(#s)"/></svg>`);
  // Light oak with a soft grain, for Orsonero's counters.
  let grain = '';
  for (let i = 0; i < 26; i++) { const y = 10 + i * 17 + (i % 3) * 3, a = 4 + (i * 7) % 9; grain += `<path d="M0 ${y}C170 ${y - a} 340 ${y + a} 510 ${y}S850 ${y - a} 1020 ${y + 2}" fill="none" stroke="${i % 4 ? '#DCCBAE' : '#D2BE9B'}" stroke-width="${i % 5 ? 1.6 : 2.6}"/>`; }
  const oak = svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450"><rect width="1020" height="450" fill="#E9DCC3"/>${grain}</svg>`);

  const SOWA = { id: 'sowa', business: 'Cukiernia Sowa', title: 'Lodowy Fanklub', reward: '1 gałka lodów gratis', titleEn: 'Ice cream fan club', rewardEn: 'a free scoop', stampsNeeded: 10, lang: 'pl', tagline: '80 lat tradycji' };
  const ORSO = { id: 'orsonero', business: 'Orsonero Coffee', title: 'Carta Orsonero', reward: 'un caffè a scelta', titleEn: 'Orsonero card', rewardEn: 'any coffee, on us', stampsNeeded: 8, tagline: 'Specialty coffee' };
  const SETS = [
    { id: 'sowa', lang: 'pl', title: 'Cukiernia Sowa', note: 'Lodowy Fanklub z papierowej karty do telefonu, i karta kawowa na 80 lat.', cards: [
      { name: 'sowa-simple', label: 'Prosta: logo w środku, brązowe kropki', stamps: 6,
        card: { ...SOWA, color: '#FFFFFF', ink: '#522D24', stamp: 'punto', font: 'serif', strip: '#FFFFFF', stripImage: watermark(OWL, '#FFFFFF', .16, 1020, 450, 430), logo: '' } },
      { name: 'sowa-80', label: 'Na 80 lat: kawa, tekstura, logo 80, sowa jako pieczątka', stamps: 5,
        card: { ...SOWA, title: 'Karta kawowa', reward: 'kawa gratis', titleEn: 'Coffee card', rewardEn: 'a free coffee', stampsNeeded: 8, color: '#FBF6EE', ink: '#522D24', stamp: 'punto', font: 'serif', strip: '#FBF6EE', stripImage: scales, logo: 'kit-sowa/art/sowa-80-logo.svg', stampImage: 'kit-sowa/art/sowa-owl-stamp.png' } }
    ] },
    { id: 'orsonero', lang: 'en', title: 'Orsonero Coffee', note: 'Two looks for the same card.', cards: [
      { name: 'orsonero-simple', label: 'Simple: bear in the middle, brown dots', stamps: 5,
        card: { ...ORSO, color: '#FFFFFF', ink: '#3B2A20', stamp: 'punto', font: 'wide', strip: '#FFFFFF', stripImage: watermark(BEAR, '#FFFFFF', .08, 1020, 450, 400) } },
      { name: 'orsonero-oak', label: 'Designed: black card, oak, bear stamps', stamps: 5,
        card: { ...ORSO, color: '#1A1A1A', ink: '#1A1A1A', stamp: 'punto', font: 'wide', strip: '#E9DCC3', stripImage: oak, stampImage: BEAR } }
    ] }
  ];
  const only = new URLSearchParams(location.search).get('set');
  let html = '';
  for (const set of SETS) {
    if (only && only !== set.id) continue;
    I18N.lang = set.lang;
    html += `<section class="set"><h1>${UI.esc(set.title)}</h1><p>${UI.esc(set.note)}</p>`;
    for (const c of set.cards) {
      html += `<div class="row">`;
      for (const platform of ['apple', 'google'])
        html += `<div class="shot" id="${c.name}-${platform === 'apple' ? 'iphone' : 'android'}"><h3>${UI.esc(c.label)} · ${platform === 'apple' ? 'iPhone' : 'Android'}</h3>${UI.renderPass(c.card, null, { stamps: c.stamps, platform })}</div>`;
      html += `</div>`;
    }
    html += `</section>`;
  }
  document.getElementById('out').innerHTML = html;
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
