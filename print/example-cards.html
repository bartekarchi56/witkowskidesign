<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example cards · Sowa and Orsonero</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Two designs per café, each on iPhone (Apple Wallet) and Android (Google Wallet).
   print/make-example-cards.js screenshots every .shot into print/kit-*/. */
body{background:#F2EFEA;padding:40px;margin:0}
h1{font-size:28px;margin:0 0 6px}
.set{margin:0 0 56px}
.set > p{color:#6B6B70;margin:0 0 22px}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 30px}
.shot{width:360px;padding:10px}
.shot h3{font:600 13px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#6B6B70;margin:0 0 10px}
.shot .pass{max-width:340px}
.shot .pass.apple{border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 18px 40px -20px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="out"></div>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/stamps.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="sisu-look.js"></script>
<script src="parzymy-look.js"></script>
<script src="younique-look.js"></script>
<script src="panfuwa-look.js"></script>
<script src="matchamo-look.js"></script>
<script src="nowhere-look.js"></script>
<script src="pan-look.js"></script>
<script src="labruma-look.js"></script>
<script>
(async () => {
  const svgUrl = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  const dataUrl = async src => { const b = await (await fetch(src)).blob(); return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); }); };
  const OWL = await dataUrl('kit-sowa/art/sowa-owl-brown.png');
  const ORSO_LOGO = await dataUrl('kit-orsonero/art/orsonero-logo.svg');
  const ORSO_STAMP = await dataUrl('kit-orsonero/art/orsonero-stamp.svg');
  // A strip with a big, faint logo in the middle: the stamps sit on top of it. `y` moves it.
  const watermark = (img, bg, opacity, w = 1020, h = 450, size = 400, y = (h - size) / 2) => svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/><image href="${img}" xlink:href="${img}" x="${(w - size) / 2}" y="${y}" width="${size}" height="${size}" opacity="${opacity}" preserveAspectRatio="xMidYMid meet"/></svg>`);
  // Sowa's feather pattern (as on cukierniasowa.pl): pointed scales in offset rows, in cream.
  const W = 78, H = 44, feather = (x, y) => `M${x} ${y}C${x} ${y + H * .55} ${x + W * .28} ${y + H * .9} ${x + W / 2} ${y + H}C${x + W * .72} ${y + H * .9} ${x + W} ${y + H * .55} ${x + W} ${y}`;
  const scales = svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450"><defs><pattern id="s" width="${W}" height="${H * 2}" patternUnits="userSpaceOnUse"><path d="${[feather(0, 0), feather(-W / 2, H), feather(W / 2, H), feather(0, H * 2), feather(-W / 2, -H), feather(W / 2, -H)].join('')}" fill="none" stroke="#E4D6C2" stroke-width="2.2" stroke-linecap="round"/></pattern></defs><rect width="1020" height="450" fill="#FBF6EE"/><rect width="1020" height="450" fill="url(#s)"/></svg>`);
  // Orsonero's awning: grey and white stripes with soft folds of light, drawn (not a photo).
  const folds = [[0, .00], [.12, .16], [.22, .02], [.34, .20], [.47, .04], [.58, .14], [.70, .00], [.83, .18], [1, .03]]
    .map(([o, a]) => `<stop offset="${o}" stop-color="#2E3440" stop-opacity="${a}"/>`).join('');
  const awning = svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1020 450">
    <defs>
      <pattern id="st" x="-6" width="68" height="900" patternUnits="userSpaceOnUse"><rect width="34" height="900" fill="#F5F5F3"/><rect x="34" width="34" height="900" fill="#C9CCD3"/></pattern>
      <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(14 .5 .5)">${folds}</linearGradient>
      <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#1E2430" stop-opacity=".12"/></linearGradient>
    </defs>
    <g transform="translate(-200 -225)"><rect width="1420" height="900" fill="url(#st)"/><rect width="1420" height="900" fill="url(#fold)"/><rect width="1420" height="900" fill="url(#sheen)"/></g>
</svg>`);

  // Kofeina: their black wordmark and storefront drawing; stamps are plain, flat dots (no ink texture).
  const dot = color => svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="${color}"/></svg>`);
  const STORE_W = await dataUrl('kit-kofeina/art/kofeina-storefront-white.png');
  const KOF = { id: 'kofeina', business: 'Kofeina', title: 'Karta kawowa', reward: 'kawa gratis', titleEn: 'Coffee card', rewardEn: 'a free coffee', lang: 'pl', city: 'Bydgoszcz', stamp: 'punto', font: 'wide' };
  const SOWA = { id: 'sowa', business: 'Cukiernia Sowa', title: 'Lodowy Fanklub', reward: '1 gałka lodów gratis', titleEn: 'Ice cream fan club', rewardEn: 'a free scoop', stampsNeeded: 10, lang: 'pl', tagline: '80 lat tradycji' };
  const ORSO = { id: 'orsonero', business: 'Orsonero Coffee', title: 'Carta Orsonero', reward: 'un caffè a scelta', titleEn: 'Orsonero card', rewardEn: 'any coffee, on us', stampsNeeded: 8, tagline: 'Specialty coffee' };
  const SETS = [
    { id: 'labruma', lang: 'it', title: 'La Bruma, Piazza Vetra', note: 'Semplice: bianca con punti neri.', cards: [
      { name: 'labruma', label: 'Bianca, punti neri', stamps: 4, card: BRUMA_LOOK.light }
    ] },
    { id: 'pan', lang: 'it', title: 'Pan Milano', note: 'Semplice: bianca con punti neri.', cards: [
      { name: 'pan', label: 'Bianca, punti neri', stamps: 4, card: PAN_LOOK.light }
    ] },
    { id: 'nowhere', lang: 'it', title: 'Nowhere Coffee & Community, Milano', note: 'Il rosa del locale, una tazza da asporto come timbro.', cards: [
      { name: 'nowhere-pink', label: 'Rosa: tazze rosa su timbri scuri', stamps: 4, card: NOWHERE_LOOK.pink },
      { name: 'nowhere-dark', label: 'Scuro: timbri rosa', stamps: 4, card: NOWHERE_LOOK.dark }
    ] },
    { id: 'matchamo', lang: 'it', title: 'MatchaMo, Milano', note: 'Il loro verde salvia, un frullino da matcha come timbro.', cards: [
      { name: 'matchamo-sage', label: 'Salvia: frullini chiari su timbri verde matcha', stamps: 4, card: MATCHAMO_LOOK.sage },
      { name: 'matchamo-matcha', label: 'Verde matcha: timbri salvia', stamps: 4, card: MATCHAMO_LOOK.matcha }
    ] },
    { id: 'panfuwa', lang: 'it', title: 'Panfuwa, 8+ sedi', note: 'Marrone e crema come il loro sito, un pancake soufflé come timbro.', cards: [
      { name: 'panfuwa-cream', label: 'Crema: pancake dorati su timbri marroni', stamps: 4, card: PANFUWA_LOOK.cream },
      { name: 'panfuwa-brown', label: 'Marrone: timbri crema', stamps: 4, card: PANFUWA_LOOK.brown }
    ] },
    { id: 'younique', lang: 'it', title: 'Younique Café Golden Goose, Milano', note: 'La listening room: nero e legno scuro, dettagli oro, un vinile come timbro.', cards: [
      { name: 'younique-black', label: 'Nero e oro: vinili come timbri', stamps: 4, card: YOUNIQUE_LOOK.black },
      { name: 'younique-wood', label: 'Legno scuro: vinili con etichetta crema', stamps: 4, card: YOUNIQUE_LOOK.wood }
    ] },
    { id: 'parzymy', lang: 'pl', title: 'Parzymy Tutaj, Bydgoszcz', note: 'Ich jasna zieleń i ich znak (łuk z trzema kroplami) jako pieczątka.', cards: [
      { name: 'parzymy-green', label: 'Jasnozielona: ciemne pieczątki z ich znakiem', stamps: 4, card: PARZYMY_LOOK.green },
      { name: 'parzymy-dark', label: 'Ciemnozielona: jasne pieczątki', stamps: 4, card: PARZYMY_LOOK.dark }
    ] },
    { id: 'sisu', lang: 'it', title: 'SISU., Milano', note: 'Il loro SISU. in verde salvia su crema, onde morbide dietro i timbri.', cards: [
      { name: 'sisu-waves', label: 'Onde: crema e salvia, timbri crema', stamps: 4, card: SISU_LOOK.cream },
      { name: 'sisu-sage', label: 'Salvia: carta verde, onde tono su tono, timbri crema', stamps: 4, card: SISU_LOOK.sage }
    ] },
    { id: 'sowa', lang: 'pl', title: 'Cukiernia Sowa', note: 'Lodowy Fanklub z papierowej karty do telefonu, i karta kawowa na 80 lat.', cards: [
      { name: 'sowa-simple', label: 'Prosta: logo w środku, brązowe kropki', stamps: 6,
        card: { ...SOWA, color: '#FFFFFF', ink: '#522D24', stamp: 'punto', font: 'serif', strip: '#FFFFFF', stripImage: watermark(OWL, '#FFFFFF', .16, 1020, 450, 430), logo: '' } },
      { name: 'sowa-80', label: 'Na 80 lat: kawa, tekstura, logo 80, sowa jako pieczątka', stamps: 5,
        card: { ...SOWA, title: 'Karta kawowa', reward: 'kawa gratis', titleEn: 'Coffee card', rewardEn: 'a free coffee', stampsNeeded: 8, color: '#FBF6EE', ink: '#522D24', stamp: 'punto', font: 'serif', strip: '#FBF6EE', stripImage: scales, logo: 'kit-sowa/art/sowa-80-logo.svg', stampImage: 'kit-sowa/art/sowa-owl-stamp.png' } }
    ] },
    { id: 'kofeina', lang: 'pl', title: 'Kofeina, Bydgoszcz', note: 'Czarno-białe jak ich logo: płaskie czarne kropki.', cards: [
      { name: 'kofeina-simple', label: 'Prosta: logo, czarne kropki', stamps: 6,
        card: { ...KOF, stampsNeeded: 10, color: '#FFFFFF', ink: '#0B0B0C', strip: '#FFFFFF', logo: 'kit-kofeina/art/kofeina-logo-black.png', stampImage: dot('#0B0B0C') } },
      { name: 'kofeina-dark', label: 'Czarna: ich kawiarnia w tle, białe kropki', stamps: 1,
        card: { ...KOF, stampsNeeded: 8, color: '#0B0B0C', ink: '#FFFFFF', strip: '#0B0B0C', logo: 'kit-kofeina/art/kofeina-logo-white.png', stripImage: watermark(STORE_W, '#0B0B0C', .22, 1020, 450, 430), stampImage: dot('#FFFFFF') } }
    ] },
    { id: 'orsonero', lang: 'en', title: 'Orsonero Coffee', note: 'Their logo at the top left, the grey and white awning behind the stamps; every stamp is the bear in a circle.', cards: [
      { name: 'orsonero-stripes', label: 'Their logo top left, awning stripes, bear stamps', stamps: 5,
        card: { ...ORSO, color: '#FFFFFF', ink: '#141414', font: 'wide', strip: '#F5F5F3', logo: ORSO_LOGO, stripImage: awning, stampImage: ORSO_STAMP } }
    ] }
  ];
  const only = new URLSearchParams(location.search).get('set');
  let html = '';
  for (const set of SETS) {
    if (only && only !== set.id) continue;
    I18N.lang = set.lang;
    html += `<section class="set"><h1>${UI.esc(set.title)}</h1><p>${UI.esc(set.note)}</p>`;
    for (const c of set.cards) {
      html += `<div class="row">`;
      for (const platform of ['apple', 'google'])
        html += `<div class="shot" id="${c.name}-${platform === 'apple' ? 'iphone' : 'android'}"><h3>${UI.esc(c.label)} · ${platform === 'apple' ? 'iPhone' : 'Android'}</h3>${UI.renderPass(c.card, null, { stamps: c.stamps, platform })}</div>`;
      html += `</div>`;
    }
    html += `</section>`;
  }
  document.getElementById('out').innerHTML = html;
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
