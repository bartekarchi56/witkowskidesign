<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Email art</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Pictures for the proposal e-mail (supabase/functions/leads/, action "proposal"), in the website's
   style: white, clean, the blue stamp colour, iPhones floating with real Wallet cards on screen.
   Rendered by print/make-email-art.js into assets/email/{hero,phones}-<lang>.png. */
body{margin:0;background:#fff}
.art{position:relative;overflow:hidden;width:600px}
.hero{height:460px;background:radial-gradient(ellipse at 50% 55%,#EEF0FF 0%,#F7F7FA 55%,#FFFFFF 100%)}
.phones{height:400px;background:linear-gradient(#FFFFFF,#F4F5FA)}
.ph{position:absolute;width:190px;height:390px;border-radius:38px;background:#111;padding:9px;box-sizing:border-box;
  box-shadow:0 0 0 1.5px #3A3A3E inset,0 2px 4px rgba(0,0,0,.18),0 40px 60px -24px rgba(20,24,80,.45)}
.ph .scr{position:relative;width:100%;height:100%;border-radius:30px;background:#F2F2F7;overflow:hidden}
.ph .isl{position:absolute;top:9px;left:50%;width:58px;height:17px;margin-left:-29px;border-radius:10px;background:#000;z-index:3}
.ph .bar{display:flex;justify-content:space-between;padding:11px 18px 0;font:600 10px/1 -apple-system,Archivo,sans-serif;color:#000}
.ph .wal{padding:20px 9px 0}
.ph .wal b{display:block;font:800 17px/1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 3px 9px}
.ph .pass{max-width:none;width:286px;zoom:.537;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ph .pass .wp-code{display:none}
.ring{position:absolute;border-radius:50%;border:3px solid #2B32FF}
.dot{position:absolute;border-radius:50%;background:#2B32FF}
.stk{height:440px;background:radial-gradient(ellipse at 50% 60%,#EEF0FF 0%,#F7F7FA 55%,#FFFFFF 100%)}
.big{width:236px;height:480px;border-radius:46px;padding:10px;left:182px;top:22px}
.big .scr{border-radius:37px}
.big .wal{padding:24px 11px 0}
.big .wal b{font-size:22px;margin:0 4px 12px;display:flex;justify-content:space-between;align-items:center}
.big .wal b i{width:22px;height:22px;border-radius:50%;background:#2B32FF;color:#fff;font:700 16px/22px Archivo;text-align:center;font-style:normal}
.slot{height:44px;overflow:hidden;border-radius:12px 12px 0 0;margin-bottom:0}
.slot.last{height:auto}
.slot .pass{zoom:.675 !important;width:286px !important}
.bank{height:150px;border-radius:12px;background:linear-gradient(135deg,#3B3F4A,#15161A);padding:12px;box-sizing:border-box;color:#fff;font:600 12px Archivo}
.shadow{position:absolute;height:22px;border-radius:50%;background:rgba(30,34,90,.22);filter:blur(12px)}
</style>
</head>
<body>
<div id="out"></div>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/stamps.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(async () => {
  const lang = new URLSearchParams(location.search).get('lang') || 'pl';
  I18N.lang = lang;
  const name = { pl: 'Twoja Kawiarnia', it: 'Il tuo Caffè', en: 'Your Café' }[lang];
  const wallet = { pl: 'Portfel', it: 'Wallet', en: 'Wallet' }[lang];
  const base = { business: name, title: 'Coffee', reward: '☕', stampsNeeded: 8, font: 'sans', hideCount: true, hideReward: true };
  const C = {
    green: { ...base, id: 'g', color: '#1F3B2D', ink: '#E9C894', strip: '#1F3B2D', stamp: 'ziarno' },
    white: { ...base, id: 'w', color: '#FFFFFF', ink: '#2B32FF', strip: '#FFFFFF', stamp: 'stella' },
    brick: { ...base, id: 'b', color: '#B5432C', ink: '#F7E7D3', strip: '#B5432C', stamp: 'ramo' },
    black: { ...base, id: 'k', color: '#0E0E10', ink: '#D9C6F2', strip: '#0E0E10', stamp: 'fiore' },
    blue: { ...base, id: 'u', color: '#2B32FF', ink: '#FFFFFF', strip: '#2B32FF', stamp: 'sole' }
  };
  // The three example cards from the website's gallery (index.html): The Coffee, Forno Bottega, Bar Brera.
  const style = id => CONFIG.styles.find(x => x.id === id).look;
  const O = Store.getCard('the-coffee');
  const S = { id: 'fb', business: 'Forno Bottega', title: 'Carta pane', reward: 'una focaccia gratis', titleEn: 'Bread card', rewardEn: 'a free focaccia', stampsNeeded: 8, icon: 'cake', ...style('bottega'), tagline: 'dal 1962' };
  const Z = { id: 'bb', business: 'Bar Brera', title: 'Carta aperitivo', reward: 'uno spritz gratis', titleEn: 'Aperitivo card', rewardEn: 'a free spritz', stampsNeeded: 8, icon: 'glass', ...style('milano') };
  const P = O;
  const phone = (card, n, css) => `<div class="ph" style="${css}"><div class="scr"><div class="isl"></div><div class="bar"><span>9:41</span><span>●●● ▮</span></div><div class="wal"><b>${wallet}</b>${UI.renderPass(card, { id: 'K7M2QX', name: 'Ola K.', stamps: n }, { platform: 'apple', compact: true })}</div></div></div>`;
  await document.fonts.load('800 17px Archivo');
  document.getElementById('out').innerHTML = `
  <div class="art hero" id="hero">
    <div class="ring" style="width:120px;height:120px;left:40px;top:40px;opacity:.12"></div>
    <div class="dot" style="width:14px;height:14px;right:70px;top:70px"></div>
    <div class="ring" style="width:26px;height:26px;right:90px;bottom:70px"></div>
    <div class="shadow" style="left:150px;bottom:20px;width:300px"></div>
    ${phone(S, 5, 'left:70px;top:58px;transform:rotate(-12deg) scale(.86)')}
    ${phone(Z, 5, 'right:70px;top:58px;transform:rotate(12deg) scale(.86)')}
    ${phone(O, 5, 'left:205px;top:28px;transform:rotate(-2deg)')}
  </div>
  <div class="art phones" id="phones">
    <div class="shadow" style="left:60px;bottom:22px;width:480px"></div>
    ${phone(Z, 3, 'left:22px;top:24px;transform:rotate(-6deg) scale(.92)')}
    ${phone(O, 7, 'left:205px;top:10px;transform:rotate(1deg) scale(.92)')}
    ${phone(S, 6, 'right:22px;top:24px;transform:rotate(7deg) scale(.92)')}
  </div>`;
  const pass = (card, n) => UI.renderPass(card, { id: 'K7M2QX', name: 'Ola K.', stamps: n }, { platform: 'apple', compact: true });
  const bankName = { pl: 'Karta płatnicza', it: 'Carta di pagamento', en: 'Debit card' }[lang];
  document.getElementById('out').insertAdjacentHTML('beforeend', `
  <div class="art stk" id="stack">
    <div class="ring" style="width:140px;height:140px;left:40px;top:60px;opacity:.12"></div>
    <div class="dot" style="width:14px;height:14px;right:80px;top:80px"></div>
    <div class="ring" style="width:26px;height:26px;right:110px;bottom:80px"></div>
    <div class="shadow" style="left:170px;bottom:6px;width:260px"></div>
    <div class="ph big"><div class="scr"><div class="isl"></div><div class="bar"><span>9:41</span><span>●●● ▮</span></div>
      <div class="wal"><b>${wallet}<i>+</i></b>
        <div class="slot"><div class="bank">${bankName}<br><span style="opacity:.6;font-weight:400">•••• 4821</span></div></div>
        <div class="slot">${pass(Z, 5)}</div>
        <div class="slot">${pass(S, 6)}</div>
        <div class="slot last">${pass(O, 7)}</div>
      </div></div></div>
  </div>`);
  await new Promise(r => setTimeout(r, 600));
  window.READY = true;
})();
</script>
</body>
</html>
