<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Parzymy Tutaj · instrukcja dla obsługi</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* One A4 page for the staff: how to stamp cards with app/stamper.html. make-instrukcja-parzymy.js saves the PDF. */
:root{--dark:#2F4A2B;--green:#528E36;--brick:#BB4F35;--cream:#F7F5EF;--line:#E3DED2}
@page{size:A4;margin:0}
html,body{margin:0;background:var(--cream)}
.page{width:210mm;height:297mm;box-sizing:border-box;padding:11mm 14mm 9mm;background:var(--cream);color:#24301F;font-family:var(--font);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--line);padding-bottom:4mm;margin-bottom:4.5mm}
header img{height:12mm}
header .k{font:600 8.5pt/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--green);text-align:right}
h1{font:600 22pt/1.1 "EB Garamond",Georgia,serif;margin:0 0 2mm;color:var(--dark)}
.lede{font-size:10pt;line-height:1.4;margin:0 0 4.5mm;color:#4a5546}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm}
.box{background:#fff;border-radius:4mm;padding:4mm 5mm}
.box.wide{grid-column:1/-1}
.box h2{display:flex;align-items:center;gap:3mm;font:700 12pt/1.2 var(--font);margin:0 0 2.2mm;color:var(--dark)}
.box h2 b{flex:0 0 7.5mm;height:7.5mm;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;font-size:10.5pt}
ol,ul{margin:0;padding-left:5mm;font-size:9.3pt;line-height:1.42}
li{margin-bottom:.8mm}
li b{color:var(--dark)}
.btn{display:inline-block;background:var(--dark);color:#fff;border-radius:2mm;padding:.2mm 2mm;font-weight:700;font-size:9pt;white-space:nowrap}
.btn.r{background:var(--brick)}
.url{font:600 9.5pt/1.4 var(--mono);color:var(--green);word-break:break-all}
.rule{margin-top:3.5mm;background:var(--green);color:#fff;border-radius:4mm;padding:3.5mm 6mm;display:flex;gap:6mm;align-items:center;font-size:10.5pt;line-height:1.4}
.rule strong{font:600 17pt/1.1 "EB Garamond",Georgia,serif;white-space:nowrap}
.faq{margin-top:3.5mm}
.faq table{width:100%;border-collapse:collapse;font-size:9.4pt;line-height:1.4}
.faq td{padding:1.4mm 2mm;border-top:1px solid var(--line);vertical-align:top}
.faq td:first-child{width:40%;font-weight:700;color:var(--dark)}
footer{margin-top:auto;padding-top:4mm;display:flex;justify-content:space-between;font:500 7.5pt/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.6}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script src="../assets/js/config.js"></script>
<script>
window.WAIT_READY = true;
(async () => {
  const site = CONFIG.siteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  document.getElementById('page').innerHTML = `
  <header><img src="kit-parzymy/logo-parzymy-black-wide.png" alt="Parzymy Tutaj"><div class="k">Instrukcja dla obsługi<br>Karta kawowa w telefonie</div></header>
  <h1>Jak dawać pieczątki</h1>
  <p class="lede">Klienci mają kartę Parzymy Tutaj w telefonie (Apple Wallet albo Google Wallet). Pieczątkę dajecie telefonem przy kasie: wystarczy zeskanować kod z karty klienta. Bez aplikacji do instalowania.</p>
  <div class="grid">
    <div class="box"><h2><b>1</b>Pierwsze uruchomienie (raz)</h2><ol>
      <li>Na telefonie przy kasie otwórz w przeglądarce:<br><span class="url">${site}/app/stamper.html</span></li>
      <li>Wpisz <b>kod połączenia</b> od właściciela i nazwę telefonu (np. „Kasa 1”), potem <span class="btn">Połącz</span>.</li>
      <li>Dodaj stronę do ekranu głównego (Udostępnij → Do ekranu początkowego), żeby otwierać ją jednym dotknięciem.</li>
    </ol></div>
    <div class="box"><h2><b>2</b>Nowy klient</h2><ol>
      <li>Pokaż plakat z kodem QR przy kasie.</li>
      <li>Klient skanuje kod aparatem, wpisuje imię i dotyka <b>„Odbierz kartę”</b>.</li>
      <li>Karta zapisuje się w Portfelu. Od razu możesz dać pierwszą pieczątkę.</li>
    </ol></div>
    <div class="box"><h2><b>3</b>Pieczątka przy zakupie</h2><ol>
      <li>Klient pokazuje kartę z Portfela (kod QR).</li>
      <li>Dotknij <span class="btn">Włącz aparat</span> i skieruj go na kod. Możesz też wpisać 6-znakowy kod spod QR.</li>
      <li>Dotknij <span class="btn">Dodaj pieczątkę</span>, potem <span class="btn">Następny klient</span>.</li>
      <li>Pomyłka? <span class="btn">Usuń pieczątkę</span> cofa ostatnią.</li>
    </ol></div>
    <div class="box"><h2><b>4</b>Nagroda: kawa gratis</h2><ol>
      <li>Po <b>8 pieczątkach</b> skaner pokazuje „Karta pełna. Wydaj nagrodę!”.</li>
      <li>Podaj kawę i dotknij <span class="btn r">Wydaj nagrodę: kawa gratis</span>.</li>
      <li>Karta zaczyna się od nowa, klient dostaje powiadomienie.</li>
    </ol></div>
    <div class="box wide"><h2><b>5</b>Samo się dzieje</h2><ul>
      <li><b>Urodziny:</b> gdy skaner pokaże 🎂, możesz wydać prezent urodzinowy przyciskiem „Wydaj prezent urodzinowy”.</li>
      <li><b>Polecenie znajomego:</b> przy pierwszej pieczątce osoby z zaproszenia obie osoby dostają pieczątkę więcej. Nic nie musisz robić.</li>
      <li><b>Powiadomienia:</b> klienci sami dostają przypomnienia na telefon, np. gdy brakuje im pieczątki do nagrody.</li>
    </ul></div>
  </div>
  <div class="rule"><strong>Zasada</strong><span>Jedna pieczątka za jedną wizytę z zakupem. Nagrodę wydajemy tylko po zeskanowaniu pełnej karty.</span></div>
  <div class="faq"><table>
    <tr><td>Aparat się nie włącza</td><td>Zezwól przeglądarce na dostęp do aparatu albo wpisz kod klienta ręcznie.</td></tr>
    <tr><td>„Nie ma karty z kodem…”</td><td>Sprawdź litery kodu (bez 0/O i 1/I) i spróbuj jeszcze raz.</td></tr>
    <tr><td>„Brak połączenia”</td><td>Sprawdź Wi-Fi albo internet w telefonie i spróbuj ponownie.</td></tr>
    <tr><td>Skaner prosi o kod połączenia</td><td>Telefon został odłączony: poproś właściciela o nowy kod.</td></tr>
  </table></div>
  <footer><span>Parzymy Tutaj · Długa 61 · Bydgoszcz</span><span>Pomoc: ${CONFIG.legal.email}</span></footer>`;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
