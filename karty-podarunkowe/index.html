<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift cards · Timbro</title>
<meta name="description" content="Sell gift cards for your café online: they go into Apple Wallet and Google Wallet and are spent at the till.">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Gift cards: what they are and how a café sets them up. The right side is an animation in four
   scenes (amounts, design, Stripe, selling) that follows the step on the left; it plays on its own. */
html,body{margin:0;background:#F6F6F8;color:var(--ink);font-family:var(--font)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;background:rgba(246,246,248,.9);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.hero{padding:70px 0 30px}
.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.02;letter-spacing:-.03em;margin:0 0 16px;font-stretch:112%}
.hero p{font-size:20px;color:var(--ink-2);max-width:34em;margin:0 0 26px}
.demo{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:start;padding:40px 0 80px}
.demo h2{font-size:clamp(28px,3.4vw,40px);line-height:1.08;margin:0 0 10px;letter-spacing:-.02em}
.demo .sub{color:var(--ink-2);margin:0 0 34px}
.steps{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--pop)}
.steps li{border-bottom:1px solid var(--line);padding:18px 0;cursor:pointer}
.steps li h3{margin:0;font-size:20px;font-weight:600;color:var(--muted);display:flex;gap:16px;transition:color .3s}
.steps li h3 b{color:var(--pop)}
.steps li p{margin:10px 0 0 34px;color:var(--ink-2);max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .4s}
.steps li.on h3{color:var(--ink)}
.steps li.on p{max-height:120px;opacity:1}
.bar{height:2px;background:var(--line);margin:12px 0 0 34px;overflow:hidden;display:none}
.steps li.on .bar{display:block}
.bar i{display:block;height:100%;width:0;background:var(--pop)}
.stage{position:relative;border-radius:28px;aspect-ratio:4/3.1;overflow:hidden;background:
  radial-gradient(60% 70% at 30% 20%,#C9D2FF 0,transparent 70%),radial-gradient(60% 60% at 80% 80%,#B8E6D9 0,transparent 70%),linear-gradient(135deg,#E6E9FF,#DDEFF1)}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.97);transition:opacity .5s,transform .5s;pointer-events:none}
.scene.on{opacity:1;transform:none}
.panel{background:#fff;border-radius:22px;box-shadow:0 30px 60px -30px rgba(20,22,60,.45);padding:22px 24px;width:min(78%,420px);font-size:14px}
.panel h4{margin:0;font-size:18px}.panel small{color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 14px;border-radius:12px;background:#F4F4F8;margin-top:8px;font-weight:700;transition:box-shadow .3s}
.row span:nth-child(2){color:var(--muted);font-weight:500}.row span:last-child{text-align:right;color:var(--pop)}
.row.sel{box-shadow:0 0 0 2px var(--pop) inset;background:#fff}
.seg{display:flex;background:#F4F4F8;border-radius:12px;padding:4px;margin-top:8px}
.seg span{flex:1;text-align:center;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:12px;transition:all .3s}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.gcard{width:230px;border-radius:20px;padding:18px;color:#fff;transition:background .6s;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.gcard .t{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.gcard b{display:block;font-size:30px;margin:6px 0 2px}
.gcard .big{font:900 28px/1 var(--font);letter-spacing:-.02em;margin:26px 0;text-align:center;font-stretch:118%}
.gcard .qr{width:90px;height:90px;margin:0 auto;background:#fff;border-radius:10px;padding:8px}
.gcard .qr svg{width:100%;height:100%}
.sw{display:flex;gap:10px;margin-top:14px;justify-content:center}
.sw i{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.2)}
.flow{display:flex;align-items:center;gap:0}
.node{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 20px 40px -24px rgba(20,22,60,.5);display:flex;gap:10px;align-items:center;font-size:13px;min-width:150px}
.node .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800}
.node b{display:block;font-size:14px}.node small{color:var(--muted)}
.link{width:90px;height:2px;background:#AFC0FF;position:relative}
.link em{position:absolute;left:50%;top:-16px;margin-left:-16px;width:32px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.12);font-style:normal}
.ok{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:var(--pop);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .4s;white-space:nowrap}
.toasts{position:absolute;top:12%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:220px}
.toast2{background:#fff;border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;font-size:12px;box-shadow:0 10px 24px -14px rgba(0,0,0,.5);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(-10px)}}
.share .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.share .btns div{border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;transition:all .3s}
.share .btns div.done{border-color:var(--pop);color:var(--pop)}
.share .url{display:flex;justify-content:space-between;background:#F4F4F8;border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--ink-2)}
.share .live{margin-top:14px;text-align:right}
.share .live span{border:1.5px solid var(--pop);color:var(--pop);border-radius:999px;padding:6px 14px;font-weight:700;transition:all .3s}
.share .live span.on{background:var(--pop);color:#fff}
.done-box{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .4s}
.done-box div{background:#fff;border-radius:22px;padding:30px 44px;text-align:center;box-shadow:0 30px 60px -30px rgba(20,22,60,.45)}
.done-box i{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--pop);color:#fff;font-size:30px;font-style:normal}
.cta{padding:0 0 90px;text-align:center}
@media (max-width:900px){.demo{grid-template-columns:1fr}.stage{aspect-ratio:4/4}.panel{width:86%}.link{width:40px}.node{min-width:0}}
@media (prefers-reduced-motion:reduce){.scene{transition:none}}

/* how customers buy: three phones */
.buy{padding:20px 0 90px}
.buy h2{font-size:clamp(28px,3.6vw,44px);letter-spacing:-.02em;margin:0 0 34px}
.buy .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.buy .shot{background:#fff;border-radius:26px;height:400px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding-top:34px;box-sizing:border-box}
.buy h3{margin:20px 0 8px;font-size:20px;display:flex;gap:10px}.buy h3 b{color:var(--pop)}
.buy p{margin:0 0 0 30px;color:var(--ink-2)}
.ph{width:210px;height:430px;border-radius:38px;background:#111;padding:8px;box-sizing:border-box;box-shadow:0 30px 50px -30px rgba(0,0,0,.6)}
.ph .sc{position:relative;height:100%;border-radius:31px;overflow:hidden;background:#fff;font-size:11px}
.ph .isl{position:absolute;left:50%;top:8px;width:66px;height:18px;margin-left:-33px;border-radius:10px;background:#000;z-index:3}
.cam{background:#222;height:100%;display:flex;align-items:center;justify-content:center}
.stand{width:120px;background:#2B32FF;border-radius:6px;padding:12px 10px 14px;color:#fff;text-align:center;transform:perspective(400px) rotateX(6deg);box-shadow:0 18px 0 -6px #C9A27A}
.stand b{display:block;font:900 13px/1.1 var(--font);margin-bottom:8px}
.stand .q{width:64px;height:64px;margin:0 auto;background:#fff;border-radius:6px;padding:5px}.stand .q svg{width:100%;height:100%}
.frame{position:absolute;inset:34% 22%;border:3px solid #FFD54A;border-radius:12px}
.pill{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#FFD54A;color:#111;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.shop{padding:40px 14px 0}.shop h5{margin:0 0 4px;font-size:14px}.shop small{color:#777}
.shop .a{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.shop .a span{border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center;font-weight:700}
.shop .a span.on{border-color:#2B32FF;box-shadow:0 0 0 1px #2B32FF inset}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);padding:12px}
.sheet .p{display:block;background:#111;color:#fff;border-radius:7px;padding:7px;text-align:center;font-weight:700;margin-top:6px}
.sheet .c{background:#2B32FF}
.gift{padding:42px 12px 0;text-align:center}
.gift .g{border-radius:14px;padding:12px;color:#fff;background:#1F6F4A;text-align:left}
.gift .g small{opacity:.8;letter-spacing:.1em;font-size:9px}.gift .g b{display:block;font-size:13px}.gift .g .v{font:800 26px/1 var(--font);margin:16px 0 4px}
.gift .q{width:80px;height:80px;margin:14px auto 4px;padding:6px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.gift .q svg{width:100%;height:100%}
@media (max-width:900px){.buy .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span>Timbro</a><div style="display:flex;gap:10px;align-items:center"><div class="lang"></div><a class="btn pop small" href="../app/dashboard.html#gift" data-i18n="k.start"></a></div></div></header>
<main>
  <section class="hero"><div class="wrap">
    <span class="label" data-i18n="k.label"></span>
    <h1 data-i18n="k.h1"></h1>
    <p data-i18n="k.lede"></p>
    <a class="btn pop" href="../app/dashboard.html#gift" data-i18n="k.start"></a>
  </div></section>

  <section class="demo wrap">
    <div>
      <h2 data-i18n="k.h2"></h2>
      <p class="sub" data-i18n="k.sub"></p>
      <ol class="steps" id="steps">
        <li data-s="0"><h3><b>1.</b><span data-i18n="k.s1"></span></h3><p data-i18n="k.s1p"></p><div class="bar"><i></i></div></li>
        <li data-s="1"><h3><b>2.</b><span data-i18n="k.s2"></span></h3><p data-i18n="k.s2p"></p><div class="bar"><i></i></div></li>
        <li data-s="2"><h3><b>3.</b><span data-i18n="k.s3"></span></h3><p data-i18n="k.s3p"></p><div class="bar"><i></i></div></li>
        <li data-s="3"><h3><b>4.</b><span data-i18n="k.s4"></span></h3><p data-i18n="k.s4p"></p><div class="bar"><i></i></div></li>
      </ol>
    </div>
    <div class="stage" id="stage" aria-hidden="true">
      <!-- 1: amounts -->
      <div class="scene" data-s="0"><div class="panel">
        <h4 data-i18n="k.amounts"></h4><small data-i18n="k.amountsP"></small>

        <div id="rows"></div>
        <div style="margin-top:16px;font-weight:700" data-i18n="k.exp"></div>
        <div class="seg" id="exp"><span>6</span><span>12</span><span>24</span><span data-i18n="k.custom"></span></div>
      </div></div>
      <!-- 2: design -->
      <div class="scene" data-s="1"><div style="display:flex;flex-direction:column;align-items:center">
        <div class="gcard" id="gcard"><div class="t"><span>Bar Brera</span><span data-i18n="k.balance"></span></div><b style="text-align:right">€50</b><div class="big" data-i18n="k.giftCard"></div><div class="qr" id="gqr"></div></div>
        <div class="sw" id="sw"></div>
      </div></div>
      <!-- 3: Stripe -->
      <div class="scene" data-s="2">
        <div class="toasts" id="toasts"></div>
        <div class="flow">
          <div class="node"><div class="ic" style="background:#2B32FF">☕</div><div><b data-i18n="k.you"></b><small>Bar Brera</small></div></div>
          <div class="link"><em>⇄</em><span class="ok" id="ok">✓ <span data-i18n="k.connected"></span></span></div>
          <div class="node"><div class="ic" style="background:#635BFF">S</div><div><small data-i18n="k.balance"></small><b id="bal">€0</b></div></div>
        </div>
      </div>
      <!-- 4: share -->
      <div class="scene" data-s="3">
        <div class="panel share"><h4 data-i18n="k.share"></h4><small data-i18n="k.shareP"></small>
          <div class="btns"><div id="b1" data-i18n="k.qr"></div><div id="b2" data-i18n="k.poster"></div></div>
          <div class="url"><span>timbro…/gift/?b=bar-brera</span><span id="cp">⧉</span></div>
          <div class="live"><span id="golive" data-i18n="k.golive"></span></div>
        </div>
        <div class="done-box" id="done"><div><i>✓</i><h4 style="margin:14px 0 4px;font-size:20px" data-i18n="k.live"></h4><small data-i18n="k.liveP"></small></div></div>
      </div>
    </div>
  </section>

  <section class="buy wrap">
    <h2 data-i18n="b.h"></h2>
    <div class="grid">
      <div><div class="shot"><div class="ph"><div class="sc"><div class="isl"></div><div class="cam"><div class="stand"><b data-i18n="b.stand"></b><div class="q" id="q1"></div></div></div><div class="frame"></div><span class="pill" data-i18n="b.open"></span></div></div></div>
        <h3><b>1.</b><span data-i18n="b.s1"></span></h3><p data-i18n="b.s1p"></p></div>
      <div><div class="shot"><div class="ph"><div class="sc"><div class="isl"></div><div class="shop"><h5>Bar Brera</h5><small data-i18n="b.choose"></small><div class="a"><span>€10</span><span>€25</span><span>€50</span><span class="on">€100</span></div></div>
        <div class="sheet"><b>€100.00</b><span class="p"> Pay</span><span class="p">G Pay</span><span class="p c" data-i18n="b.card"></span></div></div></div></div>
        <h3><b>2.</b><span data-i18n="b.s2"></span></h3><p data-i18n="b.s2p"></p></div>
      <div><div class="shot"><div class="ph"><div class="sc"><div class="isl"></div><div class="gift"><div class="g"><small data-i18n="b.gc"></small><b>Bar Brera</b><div class="v">€100</div><small data-i18n="b.valid"></small></div><div class="q" id="q2"></div><small style="color:#777">GK7M2QX9P</small></div></div></div></div>
        <h3><b>3.</b><span data-i18n="b.s3"></span></h3><p data-i18n="b.s3p"></p></div>
    </div>
  </section>

  <section class="cta wrap">
    <h2 style="font-size:clamp(28px,4vw,48px);margin:0 0 12px" data-i18n="k.ctaT"></h2>
    <p style="color:var(--ink-2);margin:0 0 22px" data-i18n="k.ctaP"></p>
    <a class="btn pop" href="../app/dashboard.html#gift" data-i18n="k.start"></a>
  </section>
</main>

(function () {
  const $ = id => document.getElementById(id), t = (k, v) => I18N.t(k, v), sleep = ms => new Promise(r => setTimeout(r, ms));
  $('gqr').innerHTML = UI.qrSvg('https://timbro.witkowskidesign.com/gift/');
  $('q1').innerHTML = $('q2').innerHTML = UI.qrSvg('https://timbro.witkowskidesign.com/gift/');
  const COLORS = ['#1F6F4A', '#2B32FF', '#B4483A', '#111111'];
  $('sw').innerHTML = COLORS.map(c => `<i style="background:${c}"></i>`).join('');
  const DUR = 7000;
  let cur = 0, run = 0;
  const amounts = [[10, 0], [25, 0], [50, 5], [100, 15]];
  // Each scene plays its own little story; a newer run stops an older one.
  const plays = [
    async id => {
      $('rows').innerHTML = amounts.map(([a, b]) => `<div class="row"><span>€${a}</span><span>+€${b}</span><span>€${a + b}</span></div>`).join('');
      const rows = [...$('rows').children], seg = [...$('exp').children];
      for (let i = 0; i < rows.length && id === run; i++) { rows.forEach(r => r.classList.remove('sel')); rows[i].classList.add('sel'); await sleep(900); }
      for (let i = 0; i < 3 && id === run; i++) { seg.forEach(s => s.classList.remove('on')); seg[i].classList.add('on'); await sleep(700); }
    },
    async id => { for (let i = 0; id === run; i = (i + 1) % COLORS.length) { $('gcard').style.background = COLORS[i]; await sleep(1500); } },
    async id => {
      $('ok').style.opacity = 0; $('toasts').innerHTML = ''; $('bal').textContent = '€0';
      await sleep(900); if (id !== run) return; $('ok').style.opacity = 1;
      let total = 0;
      for (const x of [10, 25, 50, 25, 100]) {
        await sleep(950); if (id !== run) return;
        total += x; $('bal').textContent = '€' + total;
        $('toasts').insertAdjacentHTML('afterbegin', `<div class="toast2"><span>🎁 ${t('k.sale')}</span><b>+€${x}</b></div>`);
        if ($('toasts').children.length > 3) $('toasts').lastElementChild.remove();
      }
    },
    async id => {
      ['b1', 'b2'].forEach(b => $(b).classList.remove('done')); $('golive').classList.remove('on'); $('done').style.opacity = 0; $('cp').textContent = '⧉';
      for (const step of [() => $('b1').classList.add('done'), () => $('b2').classList.add('done'), () => { $('cp').textContent = '✓'; }, () => $('golive').classList.add('on'), () => { $('done').style.opacity = 1; }]) {
        await sleep(1000); if (id !== run) return; step();
      }
    }
  ];
  function show(i) {
    cur = i; const id = ++run;
    document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', +s.dataset.s === i));
    document.querySelectorAll('#steps li').forEach(li => {
      li.classList.toggle('on', +li.dataset.s === i);
      const bar = li.querySelector('.bar i'); bar.style.transition = 'none'; bar.style.width = '0';
      if (+li.dataset.s === i) requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${DUR}ms linear`; bar.style.width = '100%'; }));
    });
    plays[i](id);
    clearTimeout(show.t); show.t = setTimeout(() => show((cur + 1) % 4), DUR);
  }
  document.querySelectorAll('#steps li').forEach(li => li.addEventListener('click', () => show(+li.dataset.s)));
  document.addEventListener('langchange', () => show(cur));
  show(0);
})();
</script>
